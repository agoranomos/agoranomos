<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" role="img" aria-label="The MCP servers of agoranomos. The Claude apps reach the server built into Metabase over HTTPS with OAuth, and Claude Code reaches it and, in local mode, the servers of the warehouse and of Airflow, which run in the container ai and start through ./agoranomos mcp. The server of Metabase works as the person&#x27;s own account, within the level of AI access; MCP Toolbox reads the schema marts as the read-only role ai_reader; astro-airflow-mcp reads the DAGs, runs and logs as the Airflow user ai, a Viewer. ChatGPT, Gemini and Kimi as checked clients, and the MCP server of dbt, are planned."><defs><linearGradient id="ag-dg-ember" gradientUnits="userSpaceOnUse" x1="220" y1="0" x2="890" y2="0"><stop offset="0" stop-color="#FFB020"/><stop offset="1" stop-color="#FF4A1C"/></linearGradient><filter id="ag-dg-blur" filterUnits="userSpaceOnUse" x="-20" y="-20" width="940" height="450"><feGaussianBlur stdDeviation="4"/></filter></defs><rect class="dg-frame" x="326" y="112" width="228" height="172"/><text class="dg-k" x="340" y="132">THE CONTAINER AI · LOCAL MODE</text><path class="dg-glow" d="M220 45H340"/><path class="dg-data" d="M220 45H340"/><text class="dg-s" x="280.0" y="37" text-anchor="middle">https · oauth</text><path class="dg-glow" d="M220 145C280.0 145 280.0 45 340 45"/><path class="dg-data" d="M220 145C280.0 145 280.0 45 340 45"/><path class="dg-glow" d="M220 145C280.0 145 280.0 165 340 165"/><path class="dg-data" d="M220 145C280.0 145 280.0 165 340 165"/><path class="dg-glow" d="M220 145C280.0 145 280.0 235 340 235"/><path class="dg-data" d="M220 145C280.0 145 280.0 235 340 235"/><path class="dg-dash" d="M220 335C280.0 335 280.0 45 340 45"/><path class="dg-dash" d="M220 145C280.0 145 280.0 330 340 330"/><path class="dg-glow" d="M540 45H650"/><path class="dg-data" d="M540 45H650"/><path class="dg-glow" d="M540 165H650"/><path class="dg-data" d="M540 165H650"/><path class="dg-glow" d=