<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="Server mode. The firewall lets in TCP 22, 80 and 443 only. Caddy answers on ports 80 and 443 and passes HTTPS to Metabase. Airflow and Metabase listen on 127.0.0.1 only, for an SSH tunnel from your own machine. The two PostgreSQL instances publish no port. The backup service dumps the databases every day, at 03:00 UTC by default, into the backups folder."><defs><linearGradient id="ag-dg-ember" gradientUnits="userSpaceOnUse" x1="180" y1="0" x2="940" y2="0"><stop offset="0" stop-color="#FFB020"/><stop offset="1" stop-color="#FF4A1C"/></linearGradient><filter id="ag-dg-blur" filterUnits="userSpaceOnUse" x="-20" y="-20" width="1000" height="400"><feGaussianBlur stdDeviation="4"/></filter></defs><rect class="dg-frame" x="250" y="10" width="700" height="300"/><text class="dg-k" x="264" y="30">YOUR SERVER · INBOUND: TCP 22, 80 AND 443 ONLY</text><path class="dg-glow" d="M180 75H280"/><path class="dg-data" d="M180 75H280"/><text class="dg-s" x="188" y="67" text-anchor="start">https · 443</text><path class="dg-glow" d="M450 75H500"/><path class="dg-data" d="M450 75H500"/><path class="dg-ctl" d="M180 175H280"/><text class="dg-s" x="188" y="167" text-anchor="start">ssh tunnel · 22</text><path class="dg-ctl" d="M450 175H500"/><path class="dg-glow" d="M585.0 143V100"/><path class="dg-data" d="M585.0 143V100"/><path class="dg-glow" d="M670 175H750"/><path class="dg-data" d="M670 175H750"/><text class="dg-s" x="710.0" y="167" text-anchor="middle">pg_dump</text><path class="dg-glow" d="M835.0 207V245"/><path class="dg-data" d="M835.0 207V245"/><g class="dg-node dg-user"><rect x="10" y="50" width="170" height="50"/><text class="dg-k" x="22" y="68">THE INTERNET</text><text class="dg-t" x="22" y="88">a browser</text><rect class="dg-sq" x="164" y="60" width="7" height="7"/></g><g class="dg-node dg-user"><rect x="10" y="150" width="170" height="50"/><text class="dg-k" x="22" y="168">YOUR MACHINE</text><text class="dg-t" x="22" y="188">ssh</text><rect class="dg-sq" x="164" y="160" width="7" height="7"/></g><g class="dg-node"><rect x="280" y="50" width="170" height="50"/><text class="dg-k" x="292" y="68">PROXY · TCP 80 · 443</text><text class="dg-t" x="292" y="88">caddy</text><rect class="dg-sq" x="434" y="60" width="7" height="7"/></g><g class="dg-node dg-user"><rect x="500" y="50" width="170" height="50"/><text class="dg-k" x="512" y="68">BI · 127.0.0.1:3000</text><text class="dg-t" x="512" y="88">metabase</text><rect class="dg-sq" x="654" y="60" width="7" height="7"/></g><g class="dg-node"><rect x="280" y="150" width="170" height="50"/><text class="dg-k" x="292" y="168">127.0.0.1:8080</text><text class="dg-t" x="292" y="188">airflow</text><rect class="dg-sq" x="434" y="160" width="7" height="7"/></g><g class="dg-node"><rect x="500" y="143" width="170" height="64"/><text class="dg-k" x="512" y="161">DATABASES · NO PORT</text><text class="dg-t" x="512" y="181">postgresql</text><text class="dg-s" x="512" y="198">warehouse · platform</text><rect class="dg-sq" x="654" y="153" width="7" height="7"/></g><g class="dg-node"><rect x="750" y="143" width="170" height="64"/><text class="dg-k" x="762" y="161">OPS · EVERY DAY</text><text class="dg-t" x="762" y="181">backup</text><text class="dg-s" x="762" y="198">03:00 utc by default</text><rect class="dg-sq" x="904" y="153" width="7" height="7"/></g><g class="dg-node"><rect x="750" y="245" width="170" height="50"/><text class="dg-k" x="762" y="263">FOLDER</text><text class="dg-t" x="762" y="283">backups/</text></g><path class="dg-glow" d="M10 341H32"/><path class="dg-data" d="M10 341H32"/><text class="dg-legend" x="40" y="345">data</text><path class="dg-ctl" d="M94.4 341H116.4"/><text class="dg-legend" x="124.4" y="345">a person or airflow starts it</text><g class="dg-node dg-user"><rect x="343.79999999999995" y="335" width="22" height="12"/></g><text class="dg-legend" x="373.79999999999995" y="345">what people open</text></svg>
