<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 385" role="img" aria-label="A backup. The backup service, or ./agoranomos backup, dumps the warehouse, Airflow and Metabase databases and packs the extensions folder into a folder of the backups folder on the server, one per run. A copy goes to another machine with rsync or rclone. ./agoranomos restore puts a backup back into the stack."><defs><linearGradient id="ag-dg-ember" gradientUnits="userSpaceOnUse" x1="200" y1="0" x2="720" y2="0"><stop offset="0" stop-color="#FFB020"/><stop offset="1" stop-color="#FF4A1C"/></linearGradient><filter id="ag-dg-blur" filterUnits="userSpaceOnUse" x="-20" y="-20" width="770" height="425"><feGaussianBlur stdDeviation="4"/></filter></defs><rect class="dg-frame" x="10" y="40" width="208" height="290"/><text class="dg-k" x="24" y="60">THE STACK</text><path class="dg-glow" d="M204 95C247.0 95 247.0 187 290 187"/><path class="dg-data" d="M204 95C247.0 95 247.0 187 290 187"/><path class="dg-glow" d="M204 155C247.0 155 247.0 187 290 187"/><path class="dg-data" d="M204 155C247.0 155 247.0 187 290 187"/><path class="dg-glow" d="M204 215C247.0 215 247.0 187 290 187"/><path class="dg-data" d="M204 215C247.0 215 247.0 187 290 187"/><path class="dg-glow" d="M204 275C247.0 275 247.0 187 290 187"/><path class="dg-data" d="M204 275C247.0 275 247.0 187 290 187"/><path class="dg-glow" d="M470 187C505.0 187 505.0 112 540 112"/><path class="dg-data" d="M470 187C505.0 187 505.0 112 540 112"/><path class="dg-glow" d="M630.0 144V250"/><path class="dg-data" d="M630.0 144V250"/><text class="dg-s" x="620.0" y="202" text-anchor="end">rsync · rclone</text><path class="dg-ctl" d="M630.0 80V18H114.0V34"/><path class="dg-ctl-head" d="M110.0 28L114.0 34L118.0 28"/><text class="dg-s" x="372.0" y="12" text-anchor="middle">./agoranomos restore</text><g class="dg-node"><rect x="24" y="70" width="180" height="50"/><text class="dg-k" x="36" y="88">DATABASE</text><text class="dg-t" x="36" y="108">warehouse</text><rect class="dg-sq" x="188" y="80" width="7" height="7"/></g><g class="dg-node"><rect x="24" y="130" width="180" height="50"/><text class="dg-k" x="36" y="148">DATABASE</text><text class="dg-t" x="36" y="168">airflow</text><rect class="dg-sq" x="188" y="140" width="7" height="7"/></g><g class="dg-node"><rect x="24" y="190" width="180" height="50"/><text class="dg-k" x="36" y="208">DATABASE</text><text class="dg-t" x="36" y="228">metabase</text><rect class="dg-sq" x="188" y="200" width="7" height="7"/></g><g class="dg-node"><rect x="24" y="250" width="180" height="50"/><text class="dg-k" x="36" y="268">FOLDER</text><text class="dg-t" x="36" y="288">extensions/</text></g><g class="dg-node"><rect x="290" y="155" width="180" height="64"/><text class="dg-k" x="302" y="173">PG_DUMP · TAR</text><text class="dg-t" x="302" y="193">backup</text><text class="dg-s" x="302" y="210">every day with ops</text><rect class="dg-sq" x="454" y="165" width="7" height="7"/></g><g class="dg-node"><rect x="540" y="80" width="180" height="64"/><text class="dg-k" x="552" y="98">ON THE SERVER</text><text class="dg-t" x="552" y="118">backups/</text><text class="dg-s" x="552" y="135">a folder per run</text></g><g class="dg-node dg-user"><rect x="540" y="250" width="180" height="50"/><text class="dg-k" x="552" y="268">ANOTHER MACHINE</text><text class="dg-t" x="552" y="288">a copy</text><rect class="dg-sq" x="704" y="260" width="7" height="7"/></g><path class="dg-glow" d="M10 368H32"/><path class="dg-data" d="M10 368H32"/><text class="dg-legend" x="40" y="372">the dumps</text><path class="dg-ctl" d="M127.4 368H149.4"/><text class="dg-legend" x="157.4" y="372">you run it</text><g class="dg-node dg-user"><rect x="251.4" y="362" width="22" height="12"/></g><text class="dg-legend" x="281.4" y="372">kept apart from the server</text></svg>
