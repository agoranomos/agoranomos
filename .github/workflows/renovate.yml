name: Renovate

# Runs Renovate in this repository's own Actions, as the organization's GitHub App, so the code
# does not leave GitHub (ADR-0012). The app's client ID is the repository variable
# RENOVATE_APP_CLIENT_ID, and its private key is the repository secret RENOVATE_APP_PRIVATE_KEY.
on:
  schedule:
    # Daily at 02:17 UTC, but GitHub delays a scheduled run under load: the 52 scheduled runs from
    # 5 October to 25 November 2026 started between 06:57 and 12:29 UTC. So the weekly work in
    # renovate.json (Renovate's own version, the Docker image digests and the refresh of the lock
    # files) takes the whole of Monday, "* * * * 1" in UTC, which a late run still meets, and
    # prHourlyLimit is 0, so that the one run of a day opens every pull request that is due.
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The job needs no GITHUB_TOKEN permissions: Renovate acts with the app's installation token.
    permissions: {}
    steps:
      - name: Create an installation token for the app
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          # Exactly the permissions Renovate documents for a self-hosted GitHub App.
          permission-administration: read
          permission-checks: write
          permission-contents: write
          permission-issues: write
          permission-members: read
          permission-metadata: read
          permission-pull-requests: write
          permission-statuses: write
          permission-vulnerability-alerts: read
          permission-workflows: write

      - name: Look up the app's bot user
        id: bot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          test -n "${user_id}"
          echo "git-author=${APP_SLUG}[bot] <${user_id}+${APP_SLUG}[bot]@users.noreply.github.com>" >> "$GITHUB_OUTPUT"

      - name: Run Renovate
        uses: renovatebot/github-action@ebcbb513d07ead4d9c0c2139064301db05e84a3e # v46.3.15
        with:
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: 44.132.5
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # The Signed-off-by trailer of :gitSignOff uses this author.
          RENOVATE_GIT_AUTHOR: ${{ steps.bot.outputs.git-author }}
          # Commits go through GitHub's API, so GitHub signs them as the app.
          RENOVATE_PLATFORM_COMMIT: enabled
