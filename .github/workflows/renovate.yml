name: Renovate

# Runs Renovate in this repository's own Actions, as the organization's GitHub App, so the code
# does not leave GitHub (ADR-0012). The app's client ID is the repository variable
# RENOVATE_APP_CLIENT_ID, and its private key is the repository secret RENOVATE_APP_PRIVATE_KEY.
on:
  schedule:
    # Daily at 02:17 UTC. Keep it before 04:00 UTC: the weekly work in renovate.json (the uv.lock
    # refresh and Renovate's own version) runs only in the window "* 0-3 * * 1" (Monday, UTC).
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The job needs no GITHUB_TOKEN permissions: Renovate acts with the app's installation token.
    permissions: {}
    steps:
      - name: Create an installation token for the app
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          # Exactly the permissions Renovate documents for a self-hosted GitHub App.
          permission-administration: read
          permission-checks: write
          permission-contents: write
          permission-issues: write
          permission-members: read
          permission-metadata: read
          permission-pull-requests: write
          permission-statuses: write
          permission-vulnerability-alerts: read
          permission-workflows: write

      - name: Look up the app's bot user
        id: bot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          test -n "${user_id}"
          echo "git-author=${APP_SLUG}[bot] <${user_id}+${APP_SLUG}[bot]@users.noreply.github.com>" >> "$GITHUB_OUTPUT"

      - name: Run Renovate
        uses: renovatebot/github-action@2804199d260ad00c1fae0e9e842888369391c776 # v46.3.10
        with:
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: 44.132.5
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # The Signed-off-by trailer of :gitSignOff uses this author.
          RENOVATE_GIT_AUTHOR: ${{ steps.bot.outputs.git-author }}
          # Commits go through GitHub's API, so GitHub signs them as the app.
          RENOVATE_PLATFORM_COMMIT: enabled
