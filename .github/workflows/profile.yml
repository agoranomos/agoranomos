name: Profile

# Measures a profile of ADR-0040 on synthetic data: a stack in local mode without the demo, with
# the limits of the block "Agency profile" of .env.example, whose core tests/stack/synthetic.py
# fills at the density of the profile, then the stack tests of tests/stack/test_profile.py, which
# time each card of the dashboard Advertising against the threshold of 2 seconds of ADR-0037, the
# first values of its linked filters, the scan of the values of fields and 20 clients of Metabase
# at once, and a run of the transform. scripts/memory_report.py samples the containers during each
# step and appends its table to the summary of the job, as do the tests with their times, so that
# the summary holds the measurement of the profile.
# The profile agency is the working profile, 15,000 rows of ads a day over 400 days; limit is the
# limit of one server, 80,000 a day over 100 days, which fits the 14 GB of SSD of a runner, with the
# limits of the agency, as a runner has 16 GB of memory and the limit asks for a server of 32 GB
# (the reference of GitHub-hosted runners on docs.github.com, read on 12 November 2026: 4 CPUs,
# 16 GB of memory and 14 GB of SSD for ubuntu-24.04 in a public repository).
# It runs once a week, on Wednesday, two days after the weekly run of the workflow Stack, and by
# hand, never on a pull request: a run takes most of an hour, and its numbers say how the profile
# fares on a shared runner, not whether a change works. It runs on amd64 only, one job.
on:
  schedule:
    - cron: "23 4 * * 3" # Wednesday 04:23 UTC
  workflow_dispatch:
    inputs:
      profile:
        description: The profile of tests/stack/synthetic.py
        type: choice
        options: [agency, limit]
        default: agency
      days:
        description: The days of the period, which ends yesterday; empty for the default of the profile
        type: string
        default: ""

permissions: {}

# A manual run waits for a scheduled one, and the other way round: two would share no runner, but
# the numbers of each would be those of a busy repository.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  measure:
    name: Profile ${{ inputs.profile || 'agency' }} (amd64)
    runs-on: ubuntu-24.04
    # On the test server of the project, an Intel Core i5-3230M with 2 cores and 4 threads, on 11
    # November 2026, the profile agency took 6 minutes for a start with the image built, 13.5 for
    # the build of the empty model, 5 for the generator, 3 for the measurements of Metabase and 13
    # for the run of the transform. A runner builds the image first, as the jobs of the workflow
    # Stack do; the time of a runner is an estimate until the first runs measure it.
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      # renovate: datasource=github-releases depName=docker/compose
      COMPOSE_VERSION: v5.7.1
      AGORANOMOS_PROFILE: ${{ inputs.profile || 'agency' }}
      AGORANOMOS_PROFILE_DAYS: ${{ inputs.days }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0
        with:
          version: ${{ env.COMPOSE_VERSION }}
          cache-binary: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - run: uv sync --locked
      - name: Set up .env
        run: ./agoranomos init
      # core alone: no demo, as a deployment of an agency runs, and the limits of the block
      # "Agency profile" of .env.example in place of the defaults, each line of it that sets one.
      - name: Take the limits of the profile of an agency
        run: |
          sed -i 's|^COMPOSE_PROFILES=.*|COMPOSE_PROFILES=core|' .env
          limits=$(sed -n 's/^#   \([A-Z_]*_MEMORY=[0-9]*[mg]\)$/\1/p' .env.example)
          test -n "$limits"
          for limit in $limits; do
            sed -i "s|^${limit%%=*}=.*|$limit|" .env
            grep -qx "$limit" .env
          done
          grep -E '^(COMPOSE_PROFILES|[A-Z_]+_MEMORY)=' .env
      - name: Free disk space on the runner
        run: |
          df -h /var/lib/docker
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /var/lib/docker
      - name: Pull the images
        run: docker compose pull --quiet --ignore-buildable
      - name: Start the stack
        run: ./agoranomos up
      # As the job no-demo of the workflow Stack: the first run of the transform builds the empty
      # model, and the start after it gives Metabase the marts and the dashboard Advertising.
      - name: Build the empty model
        run: uv run pytest tests/stack/test_dbt_metadata.py -v -m transform
      - name: Start again (the marts are new)
        run: ./agoranomos up
      - name: Write the synthetic data
        env:
          TITLE: Profile ${{ env.AGORANOMOS_PROFILE }}, the generator
        run: |
          set -- generate "$AGORANOMOS_PROFILE"
          if [ -n "$AGORANOMOS_PROFILE_DAYS" ]; then
            set -- "$@" --days "$AGORANOMOS_PROFILE_DAYS"
          fi
          uv run python scripts/memory_report.py --title "$TITLE" --output "$GITHUB_STEP_SUMMARY" -- uv run python tests/stack/synthetic.py "$@"
          df -h /var/lib/docker
      - name: Measure Metabase on the profile
        env:
          TITLE: Profile ${{ env.AGORANOMOS_PROFILE }}, the cards, the filters, the scan and 20 clients
        run: AGORANOMOS_PROFILE_REPORT="$GITHUB_STEP_SUMMARY" uv run python scripts/memory_report.py --title "$TITLE" --output "$GITHUB_STEP_SUMMARY" -- uv run pytest tests/stack/test_profile.py -v -m "not transform"
      - name: Measure a run of the transform beside the profile
        if: ${{ !cancelled() }}
        env:
          TITLE: Profile ${{ env.AGORANOMOS_PROFILE }}, a run of the transform
        run: AGORANOMOS_PROFILE_REPORT="$GITHUB_STEP_SUMMARY" uv run python scripts/memory_report.py --title "$TITLE" --output "$GITHUB_STEP_SUMMARY" -- uv run pytest tests/stack/test_profile.py -v -m transform
      - name: Collect the logs
        if: ${{ failure() }}
        run: |
          docker compose ps --all > stack-logs.txt 2>&1 || true
          docker compose logs --no-color --timestamps >> stack-logs.txt 2>&1 || true
      - name: Upload the logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: profile-logs
          path: stack-logs.txt
          retention-days: 3
