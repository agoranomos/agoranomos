name: Docs

# Builds the documentation site from the tag of a release and publishes it on GitHub Pages, at
# https://agoranomos.dev (ADR-0009), so that the site describes the latest release and not main.
# The release workflow calls it when release-please has published a release. To publish a release
# again, for example after a failed run, run it by hand from main with the tag of that release.
# Pages takes the site from the environment github-pages, which deploys from main only.
on:
  workflow_call:
    inputs:
      tag:
        description: The tag of the release to publish, such as v0.3.0.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: The tag of the release to publish, such as v0.3.0.
        required: true
        type: string

permissions: {}

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
      - run: uv sync --locked
      - run: uv run zensical build --strict
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  deploy:
    name: Publish the site
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write # to publish the site
      id-token: write # for Pages to check where the site comes from
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
