name: Stack

# Starts the Docker Compose stack with ./agoranomos up and runs the stack tests in tests/stack.
# ADR-0011 asks for every mode of the stack to be tested in CI: this workflow tests local mode, and
# server mode is to follow. Local mode has two variants of Airflow (ADR-0015): "local", the
# LocalExecutor that compose.yaml runs by default, and "celery", the CeleryExecutor with a broker
# and a worker, which compose.celery.yaml adds and COMPOSE_FILE in .env selects.
# Pull requests that change the stack run the local variant on amd64.
# Pushes to main, the weekly schedule and manual runs add the celery variant and arm64 (ADR-0010):
# all four combinations. In a private repository, arm64 runners use the Actions minutes, so they do
# not run for every pull request.
# The secrets of the stack are generated anew in every run, so the logs uploaded on failure hold
# nothing that lives on.
on:
  pull_request:
    paths:
      - agoranomos
      - compose.yaml
      - compose.celery.yaml
      - .env.example
      - "postgres/**"
      - "airflow/**"
      - "metabase/**"
      - "tests/stack/**"
      - scripts/memory_report.py
      - .github/workflows/stack.yml
  push:
    branches: [main]
    paths:
      - agoranomos
      - compose.yaml
      - compose.celery.yaml
      - .env.example
      - "postgres/**"
      - "airflow/**"
      - "metabase/**"
      - "tests/stack/**"
      - scripts/memory_report.py
      - .github/workflows/stack.yml
  schedule:
    - cron: "41 3 * * 1" # Monday 03:41 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  local:
    name: Local mode (${{ matrix.arch }}, ${{ matrix.variant }})
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(github.event_name == 'pull_request' && '["amd64"]' || '["amd64", "arm64"]') }}
        variant: ${{ fromJSON(github.event_name == 'pull_request' && '["local"]' || '["local", "celery"]') }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    # The first start builds the Airflow image.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
      - run: uv sync --locked
      - name: Compose refuses to start before ./agoranomos init
        run: |
          if docker compose --profile core config --quiet 2> compose-error.txt; then
            echo "::error::docker compose accepted compose.yaml without a .env file"
            exit 1
          fi
          grep -q "run ./agoranomos init" compose-error.txt
      - name: Set up .env
        run: ./agoranomos init
      - name: Select the Celery overlay
        if: ${{ matrix.variant == 'celery' }}
        run: |
          sed -i 's|^COMPOSE_FILE=.*|COMPOSE_FILE=compose.yaml:compose.celery.yaml|' .env
          grep -qx 'COMPOSE_FILE=compose.yaml:compose.celery.yaml' .env
      - name: Put a test DAG into the extensions folder
        run: |
          mkdir -p extensions/dags
          cp tests/stack/fixtures/ci_extension_check.py extensions/dags/
      # The images of the stack take several GB, and ./agoranomos up stops below 10 GB of free disk for
      # Docker. The runner has toolchains that the stack does not use.
      - name: Free disk space on the runner
        run: |
          df -h /var/lib/docker
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /var/lib/docker
      # airflow-init builds the Airflow image, and the other Airflow services never pull it, so
      # pull skips them.
      - name: Pull the images
        run: docker compose pull --quiet --ignore-buildable
      - name: Start the stack
        run: ./agoranomos up
      - name: Stack tests
        run: uv run pytest tests/stack -v
      - name: Start again (nothing changes)
        run: |
          sha256sum .env > env.sha256
          docker compose ps --quiet --status running | sort > containers-before.txt
          ./agoranomos up
          sha256sum --check env.sha256
          docker compose ps --quiet --status running | sort > containers-after.txt
          diff containers-before.txt containers-after.txt
          uv run pytest tests/stack -v
      - name: Collect the logs
        if: ${{ failure() }}
        run: |
          docker compose ps --all > stack-logs.txt 2>&1 || true
          docker compose logs --no-color --timestamps >> stack-logs.txt 2>&1 || true
      - name: Upload the logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stack-logs-${{ matrix.arch }}-${{ matrix.variant }}
          path: stack-logs.txt
          retention-days: 3
