name: Stack

# Starts the Docker Compose stack with ./agoranomos up and runs the stack tests in tests/stack: every
# mode of the stack is tested in CI (ADR-0011). Pull requests that change the stack run it on amd64.
# Pushes to main, the weekly schedule and manual runs add arm64 (ADR-0010): in a private repository,
# arm64 runners use the Actions minutes, so they do not run for every pull request.
# The secrets of the stack are generated anew in every run, so the logs uploaded on failure hold
# nothing that lives on.
on:
  pull_request:
    paths:
      - agoranomos
      - compose.yaml
      - .env.example
      - "postgres/**"
      - "airflow/**"
      - "metabase/**"
      - "tests/stack/**"
      - scripts/memory_report.py
      - .github/workflows/stack.yml
  push:
    branches: [main]
    paths:
      - agoranomos
      - compose.yaml
      - .env.example
      - "postgres/**"
      - "airflow/**"
      - "metabase/**"
      - "tests/stack/**"
      - scripts/memory_report.py
      - .github/workflows/stack.yml
  schedule:
    - cron: "41 3 * * 1" # Monday 03:41 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  local:
    name: Local mode (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(github.event_name == 'pull_request' && '["amd64"]' || '["amd64", "arm64"]') }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
      - run: uv sync --locked
      - name: Compose refuses to start before ./agoranomos init
        run: |
          if docker compose --profile core config --quiet 2> compose-error.txt; then
            echo "::error::docker compose accepted compose.yaml without a .env file"
            exit 1
          fi
          grep -q "run ./agoranomos init" compose-error.txt
      - name: Start the stack
        run: ./agoranomos up
      - name: Stack tests
        run: uv run pytest tests/stack -v
      - name: Start again (nothing changes)
        run: |
          sha256sum .env > env.sha256
          ./agoranomos up
          sha256sum --check env.sha256
          uv run pytest tests/stack -v
      - name: Collect the logs
        if: ${{ failure() }}
        run: docker compose logs --no-color --timestamps > stack-logs.txt 2>&1 || true
      - name: Upload the logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stack-logs-${{ matrix.arch }}
          path: stack-logs.txt
          retention-days: 3
