name: Stack

# Starts the Docker Compose stack with ./agoranomos up and runs the stack tests in tests/stack.
# ADR-0011 asks for every mode of the stack to be tested in CI: the job local tests local mode, and
# the job server tests server mode with the own authority of Caddy and the name agoranomos.localhost,
# with the LocalExecutor, the server of v0.1.0 (ADR-0019, ADR-0022). Local mode has two variants of
# Airflow (ADR-0015): "local", the LocalExecutor that compose.yaml runs by default, and "celery",
# the CeleryExecutor with a broker and a worker, which compose.celery.yaml adds and COMPOSE_FILE in
# .env selects.
# Every run tests every combination: local mode on amd64 and arm64 (ADR-0010) with both variants,
# and server mode on both architectures, which runs the same stack tests and those of the proxy and
# the backups. These jobs run the demo, which .env.example turns on. The job no-demo runs local mode
# with COMPOSE_PROFILES=core, as a deployment with a real source runs: on 31 October 2026 the model
# did not build without the demo (#156), and no job caught it. It runs on amd64 with the
# LocalExecutor only, one job, to stay within the concurrent jobs of GitHub. Without the demo no
# run of the transform comes with the start, so the job builds the empty model with the tests of
# the transform of test_dbt_metadata.py and starts the stack again, the start after the first run
# of the transform that a deployment has, before the stack tests, which it runs with -m "not demo":
# the tests that need the demo carry the mark demo (pyproject.toml), and skip without it.
# One job of each combination ran every stack test twice, until on 13 November 2026 that took
# longer than the 6 hours that GitHub gives a job at most. So the test files are in three parts,
# which tests/stack/parts.py lists, balanced by their time, and each job of local mode with the
# demo and of server mode runs one part, with --part, on a stack of its own: 12 jobs of local mode
# and 6 of server mode, which with the job no-demo are 19 jobs at the same time. The job no-demo,
# which has no demo to load and transform, runs every file. The organization is on GitHub Free,
# which runs at most 20 jobs on GitHub-hosted runners at the same time (the limits of GitHub
# Actions on docs.github.com, read on 13 November 2026), so the jobs of a run wait for a runner
# while those of another run of the stack, or of CI, hold them.
# The workflow runs on a pull request, where the jobs start when it changes the stack,
# on a push to main that does, every week, which catches what changes around the repository, such
# as the images of the runners, and by hand. The job passed is a required check of main: it reports
# on every pull request, and the jobs of the stack cannot be required, as a job that does not start
# keeps a pull request waiting. The standard GitHub-hosted runners, ubuntu-24.04 and ubuntu-24.04-arm among them, are
# free and unlimited in a public repository, as this one is (the reference of GitHub-hosted runners
# on docs.github.com, read on 30 October 2026), so no run saves minutes on a smaller set.
# The secrets of the stack are generated anew in every run, so the logs uploaded on failure hold
# nothing that lives on.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - agoranomos
      - compose.yaml
      - compose.celery.yaml
      - "ai/**"
      - "caddy/**"
      - .env.example
      - "postgres/**"
      - "airflow/**"
      - "dbt/**"
      - "metabase/**"
      - "tests/stack/**"
      - scripts/memory_report.py
      - .github/workflows/stack.yml
  schedule:
    - cron: "41 3 * * 1" # Monday 03:41 UTC
  workflow_dispatch:

permissions: {}

# The event is part of the group: a push to main never replaces a weekly or manual run that waits,
# which would skip that week's check of what changes around the repository. A newer push to main
# stops the run of an older one, as it tests what the older one holds, so a green main takes one
# run after several merges.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  changes:
    name: Changes of the stack
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      stack: ${{ steps.files.outputs.stack }}
    steps:
      - name: Look for the files of the stack
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          stack=true
          if [ "$EVENT" = pull_request ]; then
            stack=false
            files='^(agoranomos|compose\.yaml|compose\.celery\.yaml|\.env\.example'
            files="$files|scripts/memory_report\.py|\.github/workflows/stack\.yml"
            files="$files|(ai|airflow|caddy|dbt|metabase|postgres|tests/stack)/.*)\$"
            # In two steps, so that a failed request stops the job and does not read as no file.
            changed=$(gh api --paginate "repos/$REPOSITORY/pulls/$NUMBER/files" --jq '.[].filename')
            if printf '%s\n' "$changed" | grep -qE "$files"; then
              stack=true
            fi
          fi
          echo "stack=$stack" | tee -a "$GITHUB_OUTPUT"

  local:
    name: Local mode (${{ matrix.arch }}, ${{ matrix.variant }}, part ${{ matrix.part }})
    needs: changes
    if: ${{ needs.changes.outputs.stack == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        variant: [local, celery]
        part: [1, 2, 3]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    # The first start builds the Airflow image and makes the demo ready, with a run of the transform
    # of the model; each of the two runs of the tests of a part runs the transform more, with the
    # hooks of elementary (ADR-0028, ADR-0029), on the four CPUs of a runner of a public
    # repository. One job ran every test file before the parts, and took 57 to 108 minutes in
    # October 2026: in the weekly run of 26 October, 72 minutes on amd64 and 57 on arm64 with the
    # local variant, and 88 and 63 with the celery variant; on the pushes to main of 29 October, 106
    # and 108 minutes on amd64 with the local variant. Since the core of v0.5 (#281, #283), each run
    # of the transform takes about 14 minutes: a pull request, whose second run of the tests leaves
    # out the mark transform, took 87 to 97 minutes on 7 November 2026, and a push to main, which
    # runs it twice, 138 and 139 minutes on arm64 and reached 150 minutes on amd64 on 7 and 8
    # November; with 240 minutes, 163 to 216 minutes on main 8bb634e on 9 November, and the facts of
    # the core add about 7 % to each run of the transform. With 300 minutes, the celery variant on
    # amd64 reached the limit on main 94c9758 on 10 November: its two runs of the tests took 146 and
    # 138 minutes, where each run of the other jobs took 79 to 110. With 360 minutes, the most that
    # GitHub gives a job, it reached the limit again on main b0578c4 on 13 November, after a first
    # run of 209 minutes, where the other jobs of local mode took 326 to 348 minutes. In the times of
    # each test of that run, a run of the tests of a part of tests/stack/parts.py takes 69 to 70
    # minutes with the celery variant on amd64 and 49 to 57 in the other jobs: with the 14 minutes
    # before the first test, about 155 minutes for the slowest job on a push to main, and 90 on a
    # pull request. Each task of the transform runs a process of dbt for its node; one dbt build in
    # the watcher mode of Cosmos (ADR-0039) is to replace them, and is not built yet.
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      # renovate: datasource=github-releases depName=docker/compose
      COMPOSE_VERSION: v5.7.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Docker Compose of the runner image (2.38.2 as of October 2026) loses the digest of an image
      # that it builds (docker/compose#13047), so the second start would recreate the Airflow
      # containers. CI therefore installs a pinned version.
      - uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0
        with:
          version: ${{ env.COMPOSE_VERSION }}
          cache-binary: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - run: uv sync --locked
      - name: Compose refuses to start before ./agoranomos init
        run: |
          if docker compose --profile core config --quiet 2> compose-error.txt; then
            echo "::error::docker compose accepted compose.yaml without a .env file"
            exit 1
          fi
          grep -q "run ./agoranomos init" compose-error.txt
      - name: Set up .env
        run: ./agoranomos init
      - name: Select the Celery overlay
        if: ${{ matrix.variant == 'celery' }}
        run: |
          sed -i 's|^COMPOSE_FILE=.*|COMPOSE_FILE=compose.yaml:compose.celery.yaml|' .env
          grep -qx 'COMPOSE_FILE=compose.yaml:compose.celery.yaml' .env
      # The alerts of the stack (ADR-0045) go to a local address of the JSON service of Apprise,
      # where tests/stack/test_alerts.py starts a receiver in the containers of Airflow; while none
      # listens, a send fails at once and nothing leaves the runner.
      - name: Send the alerts to a local address
        run: echo 'AGORANOMOS_ALERT_URLS=json://127.0.0.1:8925/stack-tests' >> .env
      - name: Put a test DAG into the extensions folder
        run: |
          mkdir -p extensions/dags
          cp tests/stack/fixtures/ci_extension_check.py extensions/dags/
      # The images of the stack take several GB, and ./agoranomos up stops below 10 GB of free disk for
      # Docker. The runner has toolchains that the stack does not use.
      - name: Free disk space on the runner
        run: |
          df -h /var/lib/docker
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /var/lib/docker
      # airflow-init builds the Airflow image, and the other Airflow services never pull it, so
      # pull skips them.
      - name: Pull the images
        run: docker compose pull --quiet --ignore-buildable
      - name: Start the stack
        run: ./agoranomos up
      # The memory report samples every container while the tests run, and appends a table of the
      # limits, the peaks and the kills at a limit to the summary of the job
      # (docs/reference/system-requirements.md). It exits with the exit code of the tests.
      - name: Stack tests
        env:
          TITLE: Local mode (${{ matrix.arch }}, ${{ matrix.variant }}, part ${{ matrix.part }}), the stack tests
          PART: ${{ matrix.part }}
        run: uv run python scripts/memory_report.py --title "$TITLE" --output "$GITHUB_STEP_SUMMARY" -- uv run pytest tests/stack -v --part "$PART"
      # A pull request takes the tests of the mark transform in the run above only: they load and
      # transform the demo, which is 41 of the 45 minutes of a run on amd64, and none of them failed
      # here alone in the 186 runs up to 31 October 2026, while the comparison of the containers did,
      # and a test of another file. A push to main and the weekly run take every test again.
      - name: Start again (nothing changes)
        env:
          MARKS: ${{ github.event_name == 'pull_request' && 'not transform' || '' }}
          PART: ${{ matrix.part }}
        run: |
          sha256sum .env > env.sha256
          docker compose ps --quiet --status running | sort > containers-before.txt
          ./agoranomos up
          sha256sum --check env.sha256
          docker compose ps --quiet --status running | sort > containers-after.txt
          diff containers-before.txt containers-after.txt
          uv run pytest tests/stack -v --part "$PART" -m "$MARKS"
      - name: Collect the logs
        if: ${{ failure() }}
        run: |
          docker compose ps --all > stack-logs.txt 2>&1 || true
          docker compose logs --no-color --timestamps >> stack-logs.txt 2>&1 || true
      - name: Upload the logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stack-logs-${{ matrix.arch }}-${{ matrix.variant }}-part-${{ matrix.part }}
          path: stack-logs.txt
          retention-days: 3

  no-demo:
    name: Local mode (amd64, local, no demo)
    needs: changes
    if: ${{ needs.changes.outputs.stack == 'true' }}
    runs-on: ubuntu-24.04
    # A cold build of the Airflow image, a build of the empty model, a start after it, and two runs
    # of the stack tests without the tests of the demo, the first with a rebuild of the empty model:
    # no demo to load, and no transform of its data, which is most of the time of the job local. It
    # took 41 minutes on main b0578c4 and 43 on a pull request on 13 November 2026, with every test
    # file in one job.
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      # renovate: datasource=github-releases depName=docker/compose
      COMPOSE_VERSION: v5.7.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0
        with:
          version: ${{ env.COMPOSE_VERSION }}
          cache-binary: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - run: uv sync --locked
      - name: Set up .env
        run: ./agoranomos init
      # core alone, as docs/how-to/see-the-demo.md says: no demo-init runs, the demo DAGs stay
      # paused, and no run of the transform comes with the start. The ai profile stays out with the
      # demo: the job local tests the container of the MCP servers.
      - name: Leave the demo out
        run: |
          sed -i 's|^COMPOSE_PROFILES=.*|COMPOSE_PROFILES=core|' .env
          grep -qx 'COMPOSE_PROFILES=core' .env
      # The alerts of the stack (ADR-0045) go to a local address of the JSON service of Apprise,
      # where tests/stack/test_alerts.py starts a receiver in the containers of Airflow; while none
      # listens, a send fails at once and nothing leaves the runner.
      - name: Send the alerts to a local address
        run: echo 'AGORANOMOS_ALERT_URLS=json://127.0.0.1:8925/stack-tests' >> .env
      - name: Put a test DAG into the extensions folder
        run: |
          mkdir -p extensions/dags
          cp tests/stack/fixtures/ci_extension_check.py extensions/dags/
      - name: Free disk space on the runner
        run: |
          df -h /var/lib/docker
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /var/lib/docker
      - name: Pull the images
        run: docker compose pull --quiet --ignore-buildable
      # metabase-init passes without the marts: the metrics and the dashboard Advertising wait for
      # a start after the first run of the transform.
      - name: Start the stack
        run: ./agoranomos up
      # Without the demo no job of the stack runs the transform: the tests of the transform of
      # test_dbt_metadata.py trigger a run and check what it built, the comments and the primary key
      # of the empty model. From here the marts exist, as in a deployment after its first load, so
      # the stack tests find them whatever their order.
      - name: Build the empty model
        run: uv run pytest tests/stack/test_dbt_metadata.py -v -m transform
      # The start after the first run of the transform, which a deployment has too: metabase-init
      # shows the marts in Metabase and makes the metrics and the dashboard Advertising, and reports
      # them as changes. The stack tests then meet a stack whose start reported every change, and a
      # test that runs metabase-init again finds nothing to change.
      - name: Start again (the marts are new)
        run: ./agoranomos up
      - name: Stack tests
        env:
          TITLE: Local mode (amd64, local, no demo), the stack tests
        run: uv run python scripts/memory_report.py --title "$TITLE" --output "$GITHUB_STEP_SUMMARY" -- uv run pytest tests/stack -v -m "not demo"
      # As in the job local, a pull request takes the tests of the mark transform in the run above
      # only: here the two of test_dbt_metadata.py, which rebuild the empty model.
      - name: Start again (nothing changes)
        env:
          MARKS: ${{ github.event_name == 'pull_request' && 'not demo and not transform' || 'not demo' }}
        run: |
          sha256sum .env > env.sha256
          docker compose ps --quiet --status running | sort > containers-before.txt
          ./agoranomos up
          sha256sum --check env.sha256
          docker compose ps --quiet --status running | sort > containers-after.txt
          diff containers-before.txt containers-after.txt
          uv run pytest tests/stack -v -m "$MARKS"
      - name: Collect the logs
        if: ${{ failure() }}
        run: |
          docker compose ps --all > stack-logs.txt 2>&1 || true
          docker compose logs --no-color --timestamps >> stack-logs.txt 2>&1 || true
      - name: Upload the logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stack-logs-no-demo
          path: stack-logs.txt
          retention-days: 3

  server:
    name: Server mode (${{ matrix.arch }}, part ${{ matrix.part }})
    needs: changes
    if: ${{ needs.changes.outputs.stack == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        part: [1, 2, 3]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    # A cold build of the Airflow and Caddy images, two runs of the tests of a part, with runs of the
    # transform of the model, with the hooks of elementary (ADR-0028, ADR-0029), and the question of
    # 70 seconds of test_server.py in part 3, and, from the backups on, the round trip of a backup
    # with two restores. One job ran every test file before the parts: 110 minutes on amd64 on
    # 20 October 2026, of which each run of the stack tests took 45 to 46, and 69 to 108 minutes on
    # amd64 from 26 to 29 October. Since the core of v0.5 (#281, #283), a pull request took 90 and
    # 127 minutes on 7 November 2026, and a push to main, whose second run of the tests takes the
    # mark transform too, reached 140 minutes on both architectures on 7 and 8 November; with 240
    # minutes, 158 and 166 minutes on main 8bb634e on 9 November; with 300 minutes, 192 minutes on
    # amd64 and 221 on arm64 on main 94c9758 on 10 November; with 360 minutes, the most that GitHub
    # gives a job, 336 minutes on amd64 and 310 on arm64 on main b0578c4 on 13 November. In the times
    # of each test of that run, a run of the tests of a part of tests/stack/parts.py takes 49 to 55
    # minutes, and the round trip 3: with the 12 minutes before the first test, about 125 minutes
    # on a push to main, and 75 on a pull request. The job gets the timeout of the jobs of local
    # mode.
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      # renovate: datasource=github-releases depName=docker/compose
      COMPOSE_VERSION: v5.7.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0
        with:
          version: ${{ env.COMPOSE_VERSION }}
          cache-binary: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - run: uv sync --locked
      # The runner has no public name: the site is agoranomos.localhost, on 127.0.0.1, with a
      # certificate of the own authority of Caddy, which the tests read from the proxy.
      - name: Set up .env for server mode
        run: |
          ./agoranomos init --server agoranomos.localhost
          sed -i 's|^AGORANOMOS_TLS=.*|AGORANOMOS_TLS=internal|' .env
          grep -qx 'AGORANOMOS_TLS=internal' .env
          grep -qx 'AGORANOMOS_SITE_URL=https://agoranomos.localhost' .env
      # The alerts of the stack (ADR-0045) go to a local address of the JSON service of Apprise,
      # where tests/stack/test_alerts.py starts a receiver in the containers of Airflow; while none
      # listens, a send fails at once and nothing leaves the runner.
      - name: Send the alerts to a local address
        run: echo 'AGORANOMOS_ALERT_URLS=json://127.0.0.1:8925/stack-tests' >> .env
      - name: Put a test DAG into the extensions folder
        run: |
          mkdir -p extensions/dags
          cp tests/stack/fixtures/ci_extension_check.py extensions/dags/
      - name: Free disk space on the runner
        run: |
          df -h /var/lib/docker
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /var/lib/docker
      - name: Pull the images
        run: docker compose pull --quiet --ignore-buildable
      - name: Start the stack
        run: ./agoranomos up
      - name: Stack tests
        env:
          TITLE: Server mode (${{ matrix.arch }}, part ${{ matrix.part }}), the stack tests
          PART: ${{ matrix.part }}
        run: uv run python scripts/memory_report.py --title "$TITLE" --output "$GITHUB_STEP_SUMMARY" -- uv run pytest tests/stack -v --part "$PART"
      # A pull request takes the tests of the mark transform in the run above only: they load and
      # transform the demo, which is 41 of the 45 minutes of a run on amd64, and none of them failed
      # here alone in the 186 runs up to 31 October 2026, while the comparison of the containers did,
      # and a test of another file. A push to main and the weekly run take every test again.
      - name: Start again (nothing changes)
        env:
          MARKS: ${{ github.event_name == 'pull_request' && 'not transform' || '' }}
          PART: ${{ matrix.part }}
        run: |
          sha256sum .env > env.sha256
          docker compose ps --quiet --status running | sort > containers-before.txt
          ./agoranomos up
          sha256sum --check env.sha256
          docker compose ps --quiet --status running | sort > containers-after.txt
          diff containers-before.txt containers-after.txt
          uv run pytest tests/stack -v --part "$PART" -m "$MARKS"
      # The round trip of a backup (ADR-0020): a refused restore of a damaged backup; a mark in
      # each database and a backup; a restore of Metabase into the running stack, then the tests of
      # the site again; the volumes of the stack removed, a restore on empty volumes, and the marks
      # again. memory_report.py measures both restores, whose peaks the databases must hold. The
      # tests that run a restore are destructive by design and run only with their opt-in. Each
      # part runs it, on the stack that its tests leave, in about 3 minutes.
      - name: Back up, restore into the running stack, remove the volumes, and restore
        env:
          AGORANOMOS_ROUNDTRIP_FILE: ${{ runner.temp }}/roundtrip.json
          LIVE: Server mode, a restore of Metabase into the running stack
          EMPTY: Server mode, a restore on empty volumes
        run: |
          AGORANOMOS_RESTORE_TESTS=1 uv run pytest tests/stack/test_backup.py -v -k refuses_a_damaged_backup
          AGORANOMOS_ROUNDTRIP=before uv run pytest tests/stack/test_backup_roundtrip.py -v
          AGORANOMOS_ROUNDTRIP=live uv run python scripts/memory_report.py --title "$LIVE" --output "$GITHUB_STEP_SUMMARY" -- uv run pytest tests/stack/test_backup_roundtrip.py -v
          uv run pytest tests/stack/test_server.py -v -k "not longer_than_a_minute"
          docker compose down --volumes --remove-orphans
          backup=$(uv run python -c 'import json, os; print(json.load(open(os.environ["AGORANOMOS_ROUNDTRIP_FILE"]))["backup"])')
          test -n "$backup"
          uv run python scripts/memory_report.py --title "$EMPTY" --output "$GITHUB_STEP_SUMMARY" -- ./agoranomos restore "$backup" --yes
          AGORANOMOS_ROUNDTRIP=after uv run pytest tests/stack/test_backup_roundtrip.py -v
      - name: Collect the logs
        if: ${{ failure() }}
        run: |
          docker compose ps --all > stack-logs.txt 2>&1 || true
          docker compose logs --no-color --timestamps >> stack-logs.txt 2>&1 || true
      - name: Upload the logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stack-logs-server-${{ matrix.arch }}-part-${{ matrix.part }}
          path: stack-logs.txt
          retention-days: 3

  passed:
    name: Stack passed
    needs: [changes, local, no-demo, server]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    # A pull request of a release waits here for the stack of main: up to the timeout of its jobs,
    # and some of the time that they can wait for a runner.
    timeout-minutes: 310
    permissions:
      actions: read
    steps:
      - name: Every job passed or did not need to start
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *)
                echo "::error::a job of the stack ended as $result"
                exit 1
                ;;
            esac
          done
      # A release takes main as it is, and a release pull request changes no file of the stack, so
      # the check of this pull request says nothing of the code that it would release. The newest
      # run on a push to main does, and a push that changes the stack starts one.
      - name: A release waits for the stack of main
        if: ${{ startsWith(github.head_ref, 'release-please--') }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          while :; do
            newest=$(gh run list --repo "$REPOSITORY" --workflow stack.yml --branch main \
              --event push --limit 1 --json status,conclusion \
              --jq '.[0] | "\(.status) \(.conclusion)"')
            case "$newest" in
              "completed success") exit 0 ;;
              completed*)
                echo "::error::the newest run of the stack on main ended as: $newest"
                exit 1
                ;;
            esac
            echo "the newest run of the stack on main: $newest"
            sleep 60
          done
