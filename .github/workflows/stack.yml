name: Stack

# Starts the Docker Compose stack with ./agoranomos up and runs the stack tests in tests/stack.
# ADR-0011 asks for every mode of the stack to be tested in CI: the job local tests local mode, and
# the job server tests server mode with the own authority of Caddy and the name agoranomos.localhost,
# with the LocalExecutor, the server of v0.1.0 (ADR-0019, ADR-0022). Local mode has two variants of
# Airflow (ADR-0015): "local", the LocalExecutor that compose.yaml runs by default, and "celery",
# the CeleryExecutor with a broker and a worker, which compose.celery.yaml adds and COMPOSE_FILE in
# .env selects.
# A pull request that changes the stack runs one job on amd64: the job server when it changes a file
# of server mode, which the job changes finds, and the job local (the local variant) otherwise; the
# job server runs the same stack tests and those of the proxy and the backups. A push to main runs
# both jobs on amd64: the job local with the local variant, and the job server. The weekly schedule
# runs the four combinations of local mode (two architectures and two variants, ADR-0010) and server
# mode on amd64, and a manual run does the same and adds server mode on arm64. In a private
# repository the minutes of Actions are counted, so a pull request does not run both jobs, and the
# arm64 runners and the celery variant run every week and on a manual run, not for every pull
# request or push.
# The secrets of the stack are generated anew in every run, so the logs uploaded on failure hold
# nothing that lives on.
on:
  pull_request:
    paths:
      - agoranomos
      - compose.yaml
      - compose.celery.yaml
      - "caddy/**"
      - .env.example
      - "postgres/**"
      - "airflow/**"
      - "dbt/**"
      - "metabase/**"
      - "tests/stack/**"
      - scripts/memory_report.py
      - .github/workflows/stack.yml
  push:
    branches: [main]
    paths:
      - agoranomos
      - compose.yaml
      - compose.celery.yaml
      - "caddy/**"
      - .env.example
      - "postgres/**"
      - "airflow/**"
      - "dbt/**"
      - "metabase/**"
      - "tests/stack/**"
      - scripts/memory_report.py
      - .github/workflows/stack.yml
  schedule:
    - cron: "41 3 * * 1" # Monday 03:41 UTC
  workflow_dispatch:

permissions: {}

# The event is part of the group: a push to main never replaces a weekly or manual run that waits,
# which would skip the arm64 runners and the celery variant for that week.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # On a pull request: does it change a file of server mode? Then the job server runs instead of
  # the job local. The list: the script, the Compose file that holds the profiles of server mode,
  # the proxy, the script of the backups, and their stack tests.
  changes:
    name: Files of server mode
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      server: ${{ steps.files.outputs.server }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Look for the files of server mode in the pull request
        id: files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(agoranomos|compose\.yaml|postgres/backup\.sh|tests/stack/test_(server|backup|backup_roundtrip)\.py)$|^caddy/'
          files=$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")
          if printf '%s\n' "$files" | grep -Eq "$pattern"; then
            echo "server=true" >> "$GITHUB_OUTPUT"
          else
            echo "server=false" >> "$GITHUB_OUTPUT"
          fi

  local:
    name: Local mode (${{ matrix.arch }}, ${{ matrix.variant }})
    needs: [changes]
    # Every push to main runs it, and a pull request that changes no file of server mode.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.server != 'true') }}
    strategy:
      fail-fast: false
      matrix:
        # The weekly schedule and a manual run test both architectures and both variants; a pull
        # request and a push to main test amd64 and the local variant.
        arch: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["amd64", "arm64"]' || '["amd64"]') }}
        variant: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["local", "celery"]' || '["local"]') }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    # The first start builds the Airflow image and makes the demo ready.
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # renovate: datasource=github-releases depName=docker/compose
      COMPOSE_VERSION: v5.6.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Docker Compose of the runner image (2.38.2 as of October 2026) loses the digest of an image
      # that it builds (docker/compose#13047), so the second start would recreate the Airflow
      # containers. CI therefore installs a pinned version.
      - uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0
        with:
          version: ${{ env.COMPOSE_VERSION }}
          cache-binary: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
      - run: uv sync --locked
      - name: Compose refuses to start before ./agoranomos init
        run: |
          if docker compose --profile core config --quiet 2> compose-error.txt; then
            echo "::error::docker compose accepted compose.yaml without a .env file"
            exit 1
          fi
          grep -q "run ./agoranomos init" compose-error.txt
      - name: Set up .env
        run: ./agoranomos init
      - name: Select the Celery overlay
        if: ${{ matrix.variant == 'celery' }}
        run: |
          sed -i 's|^COMPOSE_FILE=.*|COMPOSE_FILE=compose.yaml:compose.celery.yaml|' .env
          grep -qx 'COMPOSE_FILE=compose.yaml:compose.celery.yaml' .env
      - name: Put a test DAG into the extensions folder
        run: |
          mkdir -p extensions/dags
          cp tests/stack/fixtures/ci_extension_check.py extensions/dags/
      # The images of the stack take several GB, and ./agoranomos up stops below 10 GB of free disk for
      # Docker. The runner has toolchains that the stack does not use.
      - name: Free disk space on the runner
        run: |
          df -h /var/lib/docker
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /var/lib/docker
      # airflow-init builds the Airflow image, and the other Airflow services never pull it, so
      # pull skips them.
      - name: Pull the images
        run: docker compose pull --quiet --ignore-buildable
      - name: Start the stack
        run: ./agoranomos up
      # The memory report samples every container while the tests run, and appends a table of the
      # limits, the peaks and the kills at a limit to the summary of the job
      # (docs/reference/system-requirements.md). It exits with the exit code of the tests.
      - name: Stack tests
        env:
          TITLE: Local mode (${{ matrix.arch }}, ${{ matrix.variant }}), the stack tests
        run: uv run python scripts/memory_report.py --title "$TITLE" --output "$GITHUB_STEP_SUMMARY" -- uv run pytest tests/stack -v
      - name: Start again (nothing changes)
        run: |
          sha256sum .env > env.sha256
          docker compose ps --quiet --status running | sort > containers-before.txt
          ./agoranomos up
          sha256sum --check env.sha256
          docker compose ps --quiet --status running | sort > containers-after.txt
          diff containers-before.txt containers-after.txt
          uv run pytest tests/stack -v
      - name: Collect the logs
        if: ${{ failure() }}
        run: |
          docker compose ps --all > stack-logs.txt 2>&1 || true
          docker compose logs --no-color --timestamps >> stack-logs.txt 2>&1 || true
      - name: Upload the logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stack-logs-${{ matrix.arch }}-${{ matrix.variant }}
          path: stack-logs.txt
          retention-days: 3

  server:
    name: Server mode (${{ matrix.arch }})
    needs: [changes]
    # Every push to main runs it, and a pull request that changes a file of server mode.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.server == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["amd64", "arm64"]' || '["amd64"]') }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    # A cold build of the Airflow and Caddy images, two runs of the stack tests with a question of
    # 70 seconds, and, from the backups on, the round trip of a backup with two restores.
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      # renovate: datasource=github-releases depName=docker/compose
      COMPOSE_VERSION: v5.6.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0
        with:
          version: ${{ env.COMPOSE_VERSION }}
          cache-binary: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
      - run: uv sync --locked
      # The runner has no public name: the site is agoranomos.localhost, on 127.0.0.1, with a
      # certificate of the own authority of Caddy, which the tests read from the proxy.
      - name: Set up .env for server mode
        run: |
          ./agoranomos init --server agoranomos.localhost
          sed -i 's|^AGORANOMOS_TLS=.*|AGORANOMOS_TLS=internal|' .env
          grep -qx 'AGORANOMOS_TLS=internal' .env
          grep -qx 'AGORANOMOS_SITE_URL=https://agoranomos.localhost' .env
      - name: Put a test DAG into the extensions folder
        run: |
          mkdir -p extensions/dags
          cp tests/stack/fixtures/ci_extension_check.py extensions/dags/
      - name: Free disk space on the runner
        run: |
          df -h /var/lib/docker
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /var/lib/docker
      - name: Pull the images
        run: docker compose pull --quiet --ignore-buildable
      - name: Start the stack
        run: ./agoranomos up
      - name: Stack tests
        env:
          TITLE: Server mode (${{ matrix.arch }}), the stack tests
        run: uv run python scripts/memory_report.py --title "$TITLE" --output "$GITHUB_STEP_SUMMARY" -- uv run pytest tests/stack -v
      - name: Start again (nothing changes)
        run: |
          sha256sum .env > env.sha256
          docker compose ps --quiet --status running | sort > containers-before.txt
          ./agoranomos up
          sha256sum --check env.sha256
          docker compose ps --quiet --status running | sort > containers-after.txt
          diff containers-before.txt containers-after.txt
          uv run pytest tests/stack -v
      # The round trip of a backup (ADR-0020): a refused restore of a damaged backup; a mark in
      # each database and a backup; a restore of Metabase into the running stack, then the tests of
      # the site again; the volumes of the stack removed, a restore on empty volumes, and the marks
      # again. memory_report.py measures both restores, whose peaks the databases must hold. The
      # tests that run a restore are destructive by design and run only with their opt-in.
      - name: Back up, restore into the running stack, remove the volumes, and restore
        env:
          AGORANOMOS_ROUNDTRIP_FILE: ${{ runner.temp }}/roundtrip.json
          LIVE: Server mode, a restore of Metabase into the running stack
          EMPTY: Server mode, a restore on empty volumes
        run: |
          AGORANOMOS_RESTORE_TESTS=1 uv run pytest tests/stack/test_backup.py -v -k refuses_a_damaged_backup
          AGORANOMOS_ROUNDTRIP=before uv run pytest tests/stack/test_backup_roundtrip.py -v
          AGORANOMOS_ROUNDTRIP=live uv run python scripts/memory_report.py --title "$LIVE" --output "$GITHUB_STEP_SUMMARY" -- uv run pytest tests/stack/test_backup_roundtrip.py -v
          uv run pytest tests/stack/test_server.py -v -k "not longer_than_a_minute"
          docker compose down --volumes --remove-orphans
          backup=$(uv run python -c 'import json, os; print(json.load(open(os.environ["AGORANOMOS_ROUNDTRIP_FILE"]))["backup"])')
          test -n "$backup"
          uv run python scripts/memory_report.py --title "$EMPTY" --output "$GITHUB_STEP_SUMMARY" -- ./agoranomos restore "$backup" --yes
          AGORANOMOS_ROUNDTRIP=after uv run pytest tests/stack/test_backup_roundtrip.py -v
      - name: Collect the logs
        if: ${{ failure() }}
        run: |
          docker compose ps --all > stack-logs.txt 2>&1 || true
          docker compose logs --no-color --timestamps >> stack-logs.txt 2>&1 || true
      - name: Upload the logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stack-logs-server-${{ matrix.arch }}
          path: stack-logs.txt
          retention-days: 3
