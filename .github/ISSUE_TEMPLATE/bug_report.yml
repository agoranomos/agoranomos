name: Bug report
description: Something does not work as the documentation says
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. The more precisely you describe it, the sooner it can be fixed.

        **Do not report security vulnerabilities here.** Follow the [security policy](https://github.com/agoranomos/agoranomos/security/policy) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact commands or steps, starting from a clean checkout if you can.
      placeholder: |
        1. Run ...
        2. Open ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The release version, or the commit hash from `git rev-parse --short HEAD`.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, CPU architecture (amd64 or arm64) and the versions of the tools involved, such as uv or Docker.
  - type: textarea
    id: logs
    attributes:
      label: Logs and output
      description: Paste the relevant output. Remove secrets, tokens and personal or customer data first.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues and found no duplicate.
          required: true
        - label: I removed secrets, tokens and personal data from everything I pasted here.
          required: true
