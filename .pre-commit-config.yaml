# Git hooks, run by prek (https://prek.j178.dev), a fast drop-in replacement for pre-commit.
#   uv run prek install            # once: run the hooks on every commit
#   uv run prek run --all-files    # check the whole repository
# CI runs the command above plus a scan of the whole git history for secrets (needs a full clone):
#   uv run prek run gitleaks-history --all-files --hook-stage manual
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--enforce-all] # check every file on full runs and in CI, not only the staged ones
      - id: check-case-conflict
      - id: check-merge-conflict
        args: [--assume-in-merge] # run outside a merge too, so full runs and CI look for conflict markers
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/crate-ci/typos
    rev: v1.50.3
    hooks:
      - id: typos

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
      - id: gitleaks
        alias: gitleaks-history
        name: Detect hardcoded secrets (full history)
        entry: gitleaks git --redact --verbose
        stages: [manual]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.2
    hooks:
      - id: check-github-workflows
      - id: check-github-workflows-require-timeout
      - id: check-github-issue-forms
      - id: check-github-issue-config
      - id: check-renovate

  - repo: local
    hooks:
      - id: check-docs-nav
        name: Documentation navigation matches the pages
        entry: python scripts/check_docs_nav.py
        language: python
        language_version: "3.13" # the Python of the repository; tomllib needs 3.11 or newer
        files: ^(zensical\.toml|docs/.+\.md)$
        pass_filenames: false
      - id: check-docs-lists
        name: Nested list items in the documentation are indented by four spaces
        entry: python scripts/check_docs_lists.py
        language: python
        language_version: "3.13"
        files: ^docs/.+\.md$
