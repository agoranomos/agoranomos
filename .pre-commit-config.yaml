# Git hooks, run by prek (https://prek.j178.dev), a fast drop-in replacement for pre-commit.
#   uv run prek install            # once: run the hooks on every commit
#   uv run prek run --all-files    # check the whole repository
# CI runs the command above plus a scan of the whole git history for secrets (needs a full clone):
#   uv run prek run gitleaks-history --all-files --hook-stage manual
# docs/assets/javascripts/mermaid.min.js is Mermaid as its npm package ships it (3.5 MB, minified). It stays byte for
# byte as released, so the hooks that size, fix or reformat a file skip it. The secret scans do not skip it, and typos
# skips it in _typos.toml.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--enforce-all] # check every file on full runs and in CI, not only the staged ones
        exclude: ^docs/assets/javascripts/mermaid\.min\.js$
      - id: check-case-conflict
      - id: check-merge-conflict
        args: [--assume-in-merge] # run outside a merge too, so full runs and CI look for conflict markers
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: ^docs/assets/javascripts/mermaid\.min\.js$
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^docs/assets/javascripts/mermaid\.min\.js$
      - id: trailing-whitespace
        exclude: ^docs/assets/javascripts/mermaid\.min\.js$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/crate-ci/typos
    rev: v1.51.1
    hooks:
      - id: typos

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
      - id: gitleaks
        alias: gitleaks-history
        name: Detect hardcoded secrets (full history)
        entry: gitleaks git --redact --verbose
        stages: [manual]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.31.1
    hooks:
      - id: zizmor

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.2
    hooks:
      - id: check-github-workflows
      - id: check-github-workflows-require-timeout
      - id: check-github-issue-forms
      - id: check-github-issue-config
      - id: check-renovate
      # The schema is the one that release-please-config.json names in its "$schema". Renovate moves
      # the version in both places in one pull request (customManagers in renovate.json).
      - id: check-jsonschema
        name: Validate the release-please configuration
        files: ^release-please-config\.json$
        args: [--schemafile, "https://raw.githubusercontent.com/googleapis/release-please/v17.11.2/schemas/config.json"]

  - repo: local
    hooks:
      - id: check-docs-nav
        name: Documentation navigation matches the pages
        entry: python scripts/check_docs_nav.py
        language: python
        language_version: "3.13" # the Python of the repository; tomllib needs 3.11 or newer
        files: ^(zensical\.toml|docs/.+\.md)$
        pass_filenames: false
      - id: check-docs-lists
        name: Nested list items in the documentation are indented by four spaces
        entry: python scripts/check_docs_lists.py
        language: python
        language_version: "3.13"
        files: ^docs/.+\.md$
      - id: check-docs-site
        name: The documentation site calls no other host and loads Mermaid itself
        entry: python scripts/check_docs_site.py
        language: python
        language_version: "3.13"
        additional_dependencies: ["zensical==0.0.71"] # the version of pyproject.toml: the hook builds the site
        files: ^(zensical\.toml|docs/.+|overrides/.+|scripts/check_docs_site\.py)$
        pass_filenames: false
