# The Celery overlay (ADR-0015): Airflow with the CeleryExecutor. It adds the Valkey broker and a separate
# airflow-worker that runs the tasks, and it switches the Airflow services of compose.yaml to Celery.
# It is not a stack of its own, so it is always used together with compose.yaml. To select it, set this in
# .env, which ./agoranomos and a plain docker compose both read, and run ./agoranomos up:
#
#   COMPOSE_FILE=compose.yaml:compose.celery.yaml
#
# To go back to the LocalExecutor, set COMPOSE_FILE=compose.yaml again.

# Anchors do not cross files, so the log limits of compose.yaml are stated again here, and so are the
# settings that the Airflow services of compose.yaml get for Celery.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# For every Airflow service: the executor, and CONNECTION_CHECK_MAX_COUNT=0, which stops the entrypoint of
# the image from waiting for the broker, when the scheduler and the worker start, with the URL of the broker
# as an argument of a python process, where other users of a Linux host could read the password. Compose
# waits for the broker to be healthy anyway.
x-airflow-celery-environment: &airflow-celery-environment
  CONNECTION_CHECK_MAX_COUNT: "0"
  AIRFLOW__CORE__EXECUTOR: CeleryExecutor

# For the scheduler, which sends the tasks to the broker, and for the worker, which runs them: the broker,
# the result backend and the size of the worker. No other service uses them: the DAG processor parses the
# extension DAGs, so it must not hold the password of the broker, and the API server, the triggerer and
# airflow-init have no use for it either.
x-airflow-celery-queue-environment: &airflow-celery-queue-environment
  AIRFLOW__CELERY__BROKER_URL: redis://:${VALKEY_PASSWORD:?run ./agoranomos init}@broker:6379/0
  # The results of the tasks (the state of each), which the worker writes and the scheduler reads: a
  # database of PostgreSQL, as the Celery provider recommends, of their own, with a role of their own
  # (postgres/platform.sql), so that the worker holds no password of the metadata database of Airflow.
  # That narrows what the worker holds, and does not keep the code of a task away from the scheduler:
  # Celery 5.6.3 keeps each result in this database as a pickle, which the scheduler loads, so a task
  # that writes a crafted result with this password runs code in the scheduler, which holds the
  # metadata database and the signing key (ADR-0015).
  AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql+psycopg2://celery_results:${CELERY_RESULTS_DB_PASSWORD:?run ./agoranomos init}@platform-db:5432/celery_results
  AIRFLOW__CELERY__WORKER_CONCURRENCY: ${AIRFLOW_WORKER_CONCURRENCY:-4}

services:
  broker:
    image: valkey/valkey:9.1.2-trixie@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    profiles: [core]
    restart: unless-stopped
    # The entrypoint of the image drops to this user only when the command is valkey-server. This command
    # is a shell, so the user is set here.
    user: valkey
    mem_limit: ${BROKER_MEMORY:-256m}
    memswap_limit: ${BROKER_MEMORY:-256m}
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?run ./agoranomos init}
    # The server reads its configuration from standard input (the - argument), so the password is in no
    # command line: docker inspect and the process list show $VALKEY_PASSWORD, not its value. The broker
    # keeps nothing on disk: Celery messages live for seconds, and Airflow queues lost tasks again.
    command:
      - sh
      - -c
      - |
        exec valkey-server - <<EOF
        requirepass $$VALKEY_PASSWORD
        save ""
        appendonly no
        EOF
    networks: [data]
    cap_drop: [ALL]
    # valkey-cli reads the password from VALKEYCLI_AUTH (REDISCLI_AUTH works too, as of 9.1.2), not from -a.
    healthcheck:
      test: ["CMD-SHELL", "VALKEYCLI_AUTH=\"$$VALKEY_PASSWORD\" valkey-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  airflow-init:
    environment: *airflow-celery-environment

  airflow-apiserver:
    environment: *airflow-celery-environment

  # It runs no task here: the worker, which extends the scheduler of compose.yaml, gets the limit of
  # the tasks from there.
  airflow-scheduler:
    mem_limit: ${AIRFLOW_SCHEDULER_MEMORY:-640m}
    memswap_limit: ${AIRFLOW_SCHEDULER_MEMORY:-640m}
    environment:
      <<: [*airflow-celery-environment, *airflow-celery-queue-environment]
      # With CeleryExecutor the scheduler runs no task, so the worker alone gets the passwords of the
      # warehouse roles: it extends the scheduler of compose.yaml, which has them, and these empty
      # values apply to the scheduler only.
      WAREHOUSE_LOADER_PASSWORD: ""
      DBT_ENV_SECRET_WAREHOUSE_PASSWORD: ""
    depends_on:
      broker:
        condition: service_healthy

  airflow-dag-processor:
    environment: *airflow-celery-environment

  airflow-triggerer:
    environment: *airflow-celery-environment

  # Runs the tasks. It starts from the scheduler of compose.yaml (extends), which gives it the image, the
  # user, the volumes, the networks, the logging and the dependencies. extends reads that service from
  # compose.yaml alone, without the changes above, so the Celery settings and the dependencies on the
  # broker and on the API server are stated again here. It holds neither the metadata database nor the
  # signing key of Airflow (below).
  airflow-worker:
    extends:
      file: compose.yaml
      service: airflow-scheduler
    command: ["celery", "worker"]
    environment:
      <<: [*airflow-celery-environment, *airflow-celery-queue-environment]
      # Lets the Celery worker finish its tasks when it stops (a warm shutdown).
      DUMB_INIT_SETSID: "0"
      # A worker runs the tasks, which reach Airflow through its execution API with the token that
      # the scheduler gives each of them: the security model of Airflow 3.3.2 gives a worker neither
      # the connection string of the metadata database nor the key that signs the tokens ("Workers
      # should not have access to the signing key"). The worker extends the scheduler of
      # compose.yaml, which has both, so !reset takes them away here, from the scheduler that it
      # starts from; in a later Compose file it would not, since the environment is merged by then.
      # Without the connection string, Airflow in the worker sees its default database, an SQLite
      # file in the container, which stays empty. The log server of the worker checks the requests
      # of the API server with AIRFLOW__API__SECRET_KEY, which it keeps.
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: !reset null
      AIRFLOW__API_AUTH__JWT_SECRET: !reset null
    healthcheck:
      test: ["CMD-SHELL", "celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d \"celery@$${HOSTNAME}\""]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 60s
    depends_on:
      broker:
        condition: service_healthy
      airflow-apiserver:
        condition: service_healthy

  # With CeleryExecutor the tasks of the demo run on the worker.
  demo-init:
    depends_on:
      airflow-worker:
        condition: service_healthy
