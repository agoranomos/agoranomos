[project]
site_name = "Agoranomos"
site_description = "Open-source marketing BI out of the box, with AI access via MCP."
site_author = "Andrei Gromov"
repo_url = "https://github.com/agoranomos/agoranomos"
repo_name = "agoranomos/agoranomos"
copyright = "Copyright &copy; 2026 Andrei Gromov and Agoranomos contributors. Apache-2.0."
# The brand style of the site: colors, the self-hosted fonts and the logo (see [project.theme]).
extra_css = ["stylesheets/brand.css"]
nav = [
  { "Home" = "index.md" },
  { "Tutorials" = ["tutorials/index.md"] },
  { "How-to guides" = [
    "how-to/index.md",
    { "Run Agoranomos locally" = "how-to/run-locally.md" },
    { "See the demo" = "how-to/see-the-demo.md" },
    { "Rename a field or add your own definitions" = "how-to/rename-a-field.md" },
  ] },
  { "Reference" = [
    "reference/index.md",
    { "Command line" = "reference/command-line.md" },
    { "Configuration" = "reference/configuration.md" },
    { "System requirements" = "reference/system-requirements.md" },
    { "Describe the marts" = "reference/describe-the-marts.md" },
  ] },
  { "Explanation" = ["explanation/index.md", "explanation/architecture.md"] },
  { "Decisions" = [
    "adr/index.md",
    { "ADR-0001: Record architecture decisions" = "adr/0001-record-architecture-decisions.md" },
    { "ADR-0002: Orchestrate with Apache Airflow 3" = "adr/0002-orchestrate-with-airflow-3.md" },
    { "ADR-0003: Run two PostgreSQL instances" = "adr/0003-two-postgres-instances.md" },
    { "ADR-0004: Ingest data with dlt" = "adr/0004-ingest-with-dlt.md" },
    { "ADR-0005: Transform data with dbt Core" = "adr/0005-transform-with-dbt-core.md" },
    { "ADR-0006: Use Metabase as the BI layer" = "adr/0006-metabase-as-bi.md" },
    { "ADR-0007: Give AI clients least-privilege access through MCP" = "adr/0007-ai-access-via-mcp-read-only.md" },
    { "ADR-0008: License under Apache-2.0 with DCO sign-off" = "adr/0008-apache-2-and-dco.md" },
    { "ADR-0009: Write documentation with Zensical and Diátaxis" = "adr/0009-documentation.md" },
    { "ADR-0010: Support amd64 and arm64 within a memory budget" = "adr/0010-multi-arch-and-memory-budget.md" },
    { "ADR-0011: Support local and server modes" = "adr/0011-local-and-server-modes.md" },
    { "ADR-0012: Use Python 3.13 and a pinned toolchain" = "adr/0012-python-and-tooling.md" },
    { "ADR-0013: Keep extensions apart from the base package" = "adr/0013-keep-extensions-apart-from-the-base-package.md" },
    { "ADR-0014: Start the stack with one script and a generated .env file" = "adr/0014-start-the-stack-with-one-script.md" },
    { "ADR-0015: Run LocalExecutor by default" = "adr/0015-run-localexecutor-by-default.md" },
    { "ADR-0016: Keep the metadata of the marts as code, with a deployment's overrides in extensions" = "adr/0016-keep-the-metadata-of-the-marts-as-code.md" },
    { "ADR-0017: Set the access of AI clients in Metabase by levels" = "adr/0017-set-ai-access-in-metabase-by-levels.md" },
    { "ADR-0018: Keep the content of the package in Metabase as code, and view-only" = "adr/0018-keep-the-content-of-the-package-in-metabase-as-code.md" },
    { "ADR-0022: Budget the memory by variant and mode" = "adr/0022-budget-the-memory-by-variant-and-mode.md" },
  ] },
]

[project.theme]
language = "en"
# The header is dark in both color schemes, so it takes the logo for dark backgrounds.
# brand.css hides the site name next to it: the logo already carries the name.
logo = "assets/brand/agoranomos-lockup-on-dark.svg"
favicon = "assets/brand/favicon.svg"
# No Google Fonts: Fira Sans and Fira Code are served from docs/assets/fonts by brand.css.
font = false
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

# The scheme follows the system until the reader picks one. The colors are custom: brand.css sets them.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
pymdownx.details = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

# MADR keeps an ADR's status in the front matter. Zensical also reads that field as a page
# status and shows an icon in the navigation, so give each status a name to show on hover.
# The keys are the status values that docs/adr/index.md lists: keep the two in step.
[project.extra.status]
proposed = "Proposed"
accepted = "Accepted"
rejected = "Rejected"
deprecated = "Deprecated"
superseded = "Superseded"
