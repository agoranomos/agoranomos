[project]
site_name = "Agoranomos"
site_description = "Open-source marketing BI out of the box, with AI access via MCP."
site_author = "Andrei Gromov"
repo_url = "https://github.com/agoranomos/agoranomos"
repo_name = "agoranomos/agoranomos"
copyright = "Copyright &copy; 2026 Andrei Gromov and Agoranomos contributors. Apache-2.0."
nav = [
  { "Home" = "index.md" },
  { "Tutorials" = ["tutorials/index.md"] },
  { "How-to guides" = ["how-to/index.md"] },
  { "Reference" = ["reference/index.md"] },
  { "Explanation" = ["explanation/index.md", "explanation/architecture.md"] },
  { "Decisions" = [
    "adr/index.md",
    { "ADR-0001: Record architecture decisions" = "adr/0001-record-architecture-decisions.md" },
    { "ADR-0002: Orchestrate with Apache Airflow 3" = "adr/0002-orchestrate-with-airflow-3.md" },
    { "ADR-0003: Run two PostgreSQL instances" = "adr/0003-two-postgres-instances.md" },
    { "ADR-0004: Ingest data with dlt" = "adr/0004-ingest-with-dlt.md" },
    { "ADR-0005: Transform data with dbt Core" = "adr/0005-transform-with-dbt-core.md" },
    { "ADR-0006: Use Metabase as the BI layer" = "adr/0006-metabase-as-bi.md" },
    { "ADR-0007: Give AI clients least-privilege access through MCP" = "adr/0007-ai-access-via-mcp-read-only.md" },
    { "ADR-0008: License under Apache-2.0 with DCO sign-off" = "adr/0008-apache-2-and-dco.md" },
    { "ADR-0009: Write documentation with Zensical and Diátaxis" = "adr/0009-documentation.md" },
    { "ADR-0010: Support amd64 and arm64 within a memory budget" = "adr/0010-multi-arch-and-memory-budget.md" },
    { "ADR-0011: Support local and server modes" = "adr/0011-local-and-server-modes.md" },
    { "ADR-0012: Use Python 3.13 and a pinned toolchain" = "adr/0012-python-and-tooling.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
pymdownx.details = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

# MADR keeps an ADR's status in the front matter. Zensical also reads that field as a page
# status and shows an icon in the navigation, so give each status a name to show on hover.
# The keys are the status values that docs/adr/index.md lists: keep the two in step.
[project.extra.status]
proposed = "Proposed"
accepted = "Accepted"
rejected = "Rejected"
deprecated = "Deprecated"
superseded = "Superseded"
