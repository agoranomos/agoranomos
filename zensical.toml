[project.theme]
language = "en"
# The header is dark in both color schemes, so it takes the logo for dark backgrounds.
# brand.css hides the site name next to it: the logo already carries the name.
logo = "assets/brand/agoranomos-lockup-on-dark.svg"
favicon = "assets/brand/favicon.svg"
# No Google Fonts: Fira Sans and Fira Code are served from docs/assets/fonts by brand.css.
font = false
# Mermaid 11.17.2 (MIT, as of October 2026) is served by the site: docs/assets/javascripts/mermaid.min.js is
# dist/mermaid.min.js of the npm package, unmodified, with its license text next to it. overrides/main.html adds it
# to a page that has a diagram. The script sets the global mermaid, and the theme then draws the diagrams with it
# instead of loading Mermaid from unpkg.com (the Diagrams page of the Zensical documentation shows this way).
custom_dir = "overrides"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

# The scheme follows the system until the reader picks one. The colors are custom: brand.css sets them.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
pymdownx.details = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

# MADR keeps an ADR's status in the front matter. Zensical also reads that field as a page
# status and shows an icon in the navigation, so give each status a name to show on hover.
# The keys are the status values that docs/adr/index.md lists: keep the two in step.
[project.extra.status]
proposed = "Proposed"
accepted = "Accepted"
rejected = "Rejected"
deprecated = "Deprecated"
superseded = "Superseded"
