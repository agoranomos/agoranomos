# The Agoranomos stack. Start it with ./agoranomos up (docs/reference/command-line.md).
# Settings and secrets come from .env, which ./agoranomos init creates from .env.example; without it,
# docker compose stops and asks for ./agoranomos init. .env also sets COMPOSE_PROFILES: core is the whole
# stack in local mode (ADR-0011). Images are pinned by tag and digest, and Renovate updates them.
# Airflow runs on an image of its own, built from airflow/Dockerfile, with the LocalExecutor: the
# scheduler runs the tasks. compose.celery.yaml adds a broker and a separate worker (CeleryExecutor);
# select it with COMPOSE_FILE in .env (ADR-0015).

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# What every Airflow container shares. Anchors do not cross files, so compose.celery.yaml extends services
# of this file where it needs the same settings.
x-airflow: &airflow
  # The image of Agoranomos (ADR-0002): the official image with dlt, Cosmos and dbt added. airflow-init
  # builds it from airflow/Dockerfile on every start, from the cache of Docker after the first time, so
  # it always matches the checkout, and the other services run it; it is never pulled from or pushed to
  # a registry. Only one service builds it. With a build in every service, Compose runs one build per
  # service, in parallel, each puts the name of its service on the image as a label, and which of these
  # images keeps the tag depends on timing: Compose would find a new image at every start and recreate
  # the Airflow containers.
  image: agoranomos-airflow:local
  pull_policy: never
  profiles: [core]
  restart: unless-stopped
  user: "50000:0"
  environment: &airflow-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    # How many tasks run at the same time; Airflow's own default is 32.
    AIRFLOW__CORE__PARALLELISM: ${AIRFLOW_PARALLELISM:-4}
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?run ./agoranomos init}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?run ./agoranomos init}@platform-db:5432/airflow
    # Every Airflow container must share these two keys.
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:?run ./agoranomos init}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?run ./agoranomos init}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # New DAG files appear within a minute (the default is 300 seconds).
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "60"
    # Two DAG bundles (ADR-0013): the DAGs of the base package and the deployment's own extensions.
    AIRFLOW__DAG_PROCESSOR__DAG_BUNDLE_CONFIG_LIST: >-
      [{"name": "agoranomos", "classpath": "airflow.dag_processing.bundles.local.LocalDagBundle",
      "kwargs": {"path": "/opt/agoranomos/dags"}},
      {"name": "extensions", "classpath": "airflow.dag_processing.bundles.local.LocalDagBundle",
      "kwargs": {"path": "/opt/agoranomos/extensions/dags"}}]
    # No usage telemetry from dlt, dbt and Cosmos; the image sets the same variables.
    RUNTIME__DLTHUB_TELEMETRY: "false"
    DBT_ENGINE_SEND_ANONYMOUS_USAGE_STATS: "False"
    AIRFLOW__COSMOS__ENABLE_TELEMETRY: "False"
    DO_NOT_TRACK: "1"
    # dlt takes no settings from Airflow Variables, which the Op role may create: one could send the
    # connection of a load, with its password, to another host. The image sets the same.
    PROVIDERS__ENABLE_AIRFLOW_SECRETS: "false"
    # The two caches from which Cosmos renders the tasks of dbt stay out of Airflow Variables, which
    # the Op role may edit: with the cache of dbt ls there, one could change what a dbt task runs.
    # The image sets the same.
    AIRFLOW__COSMOS__ENABLE_CACHE_DBT_LS: "False"
    AIRFLOW__COSMOS__ENABLE_CACHE_DBT_YAML_SELECTORS: "False"
  # The base DAGs and the dbt project come from the checkout, read-only. Cosmos runs dbt in a
  # temporary folder that links to the project, where dbt writes its target and logs folders.
  volumes:
    - ./airflow/dags:/opt/agoranomos/dags:ro
    - ./dbt:/opt/agoranomos/dbt:ro
    - ${AGORANOMOS_EXTENSIONS_DIR:-./extensions}/dags:/opt/agoranomos/extensions/dags:ro
    - airflow-logs:/opt/airflow/logs
  networks: [default, data]
  security_opt: ["no-new-privileges:true"]
  logging: *logging
  depends_on: &airflow-depends-on
    platform-db:
      condition: service_healthy
    db-init:
      condition: service_completed_successfully

services:
  warehouse-db:
    image: postgres:18.6-trixie@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    profiles: [core]
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${WAREHOUSE_POSTGRES_PASSWORD:?run ./agoranomos init}
      POSTGRES_DB: warehouse
    # pg_stat_statements must be loaded at start-up, so it is on from the first start: the Ops collection
    # reads it later.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=top
      - -c
      - track_io_timing=on
    volumes:
      # PostgreSQL 18 images keep their data under /var/lib/postgresql/18/docker (ADR-0003).
      - warehouse-data:/var/lib/postgresql
    networks: [data]
    # The check connects over TCP: on the first start with an empty volume the image runs a temporary
    # server that listens only on the Unix socket while it initializes, and a check over the socket
    # could report it ready. Over TCP only the final server answers.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d warehouse"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  platform-db:
    image: postgres:18.6-trixie@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    profiles: [core]
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${PLATFORM_POSTGRES_PASSWORD:?run ./agoranomos init}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=top
      - -c
      - track_io_timing=on
    volumes:
      - platform-data:/var/lib/postgresql
    networks: [data]
    # Over TCP, for the reason given at warehouse-db.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  # Creates or updates the roles, databases and schemas of both instances on every start.
  db-init:
    image: postgres:18.6-trixie@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    profiles: [core]
    restart: "no"
    user: postgres
    entrypoint: ["/bin/sh", "/opt/agoranomos/postgres/db-init.sh"]
    environment:
      WAREHOUSE_POSTGRES_PASSWORD: ${WAREHOUSE_POSTGRES_PASSWORD:?run ./agoranomos init}
      PLATFORM_POSTGRES_PASSWORD: ${PLATFORM_POSTGRES_PASSWORD:?run ./agoranomos init}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?run ./agoranomos init}
      METABASE_DB_PASSWORD: ${METABASE_DB_PASSWORD:?run ./agoranomos init}
      METABASE_READER_PASSWORD: ${METABASE_READER_PASSWORD:?run ./agoranomos init}
      WAREHOUSE_LOADER_PASSWORD: ${WAREHOUSE_LOADER_PASSWORD:?run ./agoranomos init}
      WAREHOUSE_TRANSFORMER_PASSWORD: ${WAREHOUSE_TRANSFORMER_PASSWORD:?run ./agoranomos init}
    volumes:
      - ./postgres:/opt/agoranomos/postgres:ro
    networks: [data]
    depends_on:
      warehouse-db:
        condition: service_healthy
      platform-db:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  # Migrates the metadata database and creates the admin user, on every start. The entrypoint of the image
  # migrates the database (_AIRFLOW_DB_MIGRATE) and then runs the command. The command creates the admin
  # with the Airflow CLI, called inside this Python process: the entrypoint's own way,
  # _AIRFLOW_WWW_USER_CREATE, runs airflow users create --password <the password>, which puts the password
  # on the command line of a process. Here the arguments exist only in sys.argv, and the command line of the
  # process holds this code. An admin that exists already is not an error: the command says so and succeeds,
  # so a password changed in Airflow stays.
  airflow-init:
    <<: *airflow
    # The one service that builds the image (see x-airflow).
    build:
      context: ./airflow
    pull_policy: build
    restart: "no"
    command:
      - python
      - -c
      - |
        import os
        import sys

        from airflow.__main__ import main

        # The entrypoint carries on when the migration fails, so check that the database is up to date.
        sys.argv = ["airflow", "db", "check-migrations", "--migration-wait-timeout", "1"]
        main()
        # Airflow writes the command into its audit log and hides the password only when the command
        # starts as airflow users create, with --password <password>: keep this shape.
        sys.argv = [
            "airflow",
            "users",
            "create",
            "--role",
            "Admin",
            "--username",
            "admin",
            "--firstname",
            "Agoranomos",
            "--lastname",
            "Admin",
            "--email",
            os.environ["AGORANOMOS_ADMIN_EMAIL"],
            "--password",
            os.environ["AIRFLOW_ADMIN_PASSWORD"],
        ]
        main()
    environment:
      <<: *airflow-environment
      _AIRFLOW_DB_MIGRATE: "true"
      AGORANOMOS_ADMIN_EMAIL: ${AGORANOMOS_ADMIN_EMAIL:-admin@example.com}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?run ./agoranomos init}

  airflow-apiserver:
    <<: *airflow
    command: ["api-server"]
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    # Reads the JSON of the health endpoint and requires a healthy metadata database, not only an HTTP
    # answer. The other components have checks of their own, and the stack tests look at all of them, so
    # this check does not depend on them.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import json
          import urllib.request

          url = "http://localhost:8080/api/v2/monitor/health"
          health = json.load(urllib.request.urlopen(url, timeout=5))
          raise SystemExit(0 if health["metadatabase"]["status"] == "healthy" else 1)
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully

  # With the LocalExecutor the scheduler also runs the tasks, as processes of its own container, so its
  # memory and its restarts are shared with them. Airflow's documentation warns that in a container a task
  # that runs out of memory can restart the scheduler (ADR-0015).
  airflow-scheduler:
    <<: *airflow
    command: ["scheduler"]
    environment:
      <<: *airflow-environment
      # The tasks run here with LocalExecutor, and on the worker with CeleryExecutor, which extends this
      # service. Only they get the passwords of the warehouse roles: the DAG processor parses the DAGs
      # of the extensions folder, so it gets none. The first is for dlt and the second for dbt, which
      # hides the values of DBT_ENV_SECRET_ variables in its logs.
      WAREHOUSE_LOADER_PASSWORD: ${WAREHOUSE_LOADER_PASSWORD:?run ./agoranomos init}
      DBT_ENV_SECRET_WAREHOUSE_PASSWORD: ${WAREHOUSE_TRANSFORMER_PASSWORD:?run ./agoranomos init}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://localhost:8974/health"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow
    command: ["dag-processor"]
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 60s
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow
    command: ["triggerer"]
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type TriggererJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 60s
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully

  metabase:
    image: metabase/metabase:v0.63.19@sha256:7324f83713df9851c6c7b6c8247098de14c0924fc3b868202f886df4877cd4ff
    profiles: [core]
    restart: unless-stopped
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: platform-db
      MB_DB_PORT: "5432"
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_DB_PASSWORD:?run ./agoranomos init}
      MB_ENCRYPTION_SECRET_KEY: ${METABASE_ENCRYPTION_KEY:?run ./agoranomos init}
      MB_SITE_URL: http://localhost:${METABASE_PORT:-3000}
      MB_ANON_TRACKING_ENABLED: "false"
      MB_CHECK_FOR_UPDATES: "false"
      # A new Metabase gets no Sample Database and no Examples collection, which have nothing to do
      # with marketing data.
      MB_LOAD_SAMPLE_CONTENT: "false"
      # Metabase 0.63 turns its AI entry points on by default: the built-in MCP server (with the OAuth
      # client registration that goes with it) and the Agent API. They stay off until an ADR decides what
      # AI access may do in Metabase (AGENTS.md). MB_AI_FEATURES_ENABLED is the master switch, which the
      # other two settings also require; all three are set, so that no one line opens an entry point. A
      # value from an environment variable wins over any value saved in Metabase, including one changed
      # in the Metabase UI.
      MB_AI_FEATURES_ENABLED: "false"
      MB_MCP_ENABLED: "false"
      MB_AGENT_API_ENABLED: "false"
      # Prometheus metrics, for the planned Ops collection. The port is not published, so it is
      # reachable only from the Compose networks.
      MB_PROMETHEUS_SERVER_PORT: "9191"
    ports:
      - "127.0.0.1:${METABASE_PORT:-3000}:3000"
    # default for the published port and for metabase-init; data to reach the databases.
    networks: [default, data]
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --output /dev/null http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s
    depends_on:
      platform-db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  # Sets Metabase up on the first start and keeps the warehouse connection current on every start. Metabase
  # makes the connection to the warehouse, so this job needs the default network only, to reach Metabase.
  metabase-init:
    image: python:3.13.16-slim-trixie@sha256:3dd7cc108ec1493442514f5c2a871af6af0ec31d768ff6e378a93340c3b3db5f
    profiles: [core]
    restart: "no"
    user: "65534:65534"
    command: ["python", "/opt/agoranomos/metabase/metabase_init.py"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      METABASE_URL: http://metabase:3000
      METABASE_SITE_NAME: Agoranomos
      METABASE_ADMIN_EMAIL: ${AGORANOMOS_ADMIN_EMAIL:-admin@example.com}
      METABASE_ADMIN_PASSWORD: ${METABASE_ADMIN_PASSWORD:?run ./agoranomos init}
      WAREHOUSE_HOST: warehouse-db
      WAREHOUSE_PORT: "5432"
      WAREHOUSE_DB: warehouse
      WAREHOUSE_USER: metabase_reader
      WAREHOUSE_PASSWORD: ${METABASE_READER_PASSWORD:?run ./agoranomos init}
    volumes:
      - ./metabase:/opt/agoranomos/metabase:ro
    depends_on:
      metabase:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    logging: *logging

networks:
  # The databases have no route to the internet; with CeleryExecutor, the broker joins them here.
  data:
    internal: true

volumes:
  warehouse-data:
  platform-data:
  airflow-logs:
