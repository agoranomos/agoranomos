# The Agoranomos stack. Start it with ./agoranomos up (docs/reference/command-line.md).
# Settings and secrets come from .env, which ./agoranomos init creates from .env.example; without it,
# docker compose stops and asks for ./agoranomos init. .env also sets COMPOSE_PROFILES: core is the whole
# stack in local mode (ADR-0011), demo adds the demo-init job, and server adds the proxy of server mode
# (ADR-0019). Images are pinned by tag and digest, and Renovate updates them.
# Airflow runs on an image of its own, built from airflow/Dockerfile, with the LocalExecutor: the
# scheduler runs the tasks. compose.celery.yaml adds a broker and a separate worker (CeleryExecutor);
# select it with COMPOSE_FILE in .env (ADR-0015).
# Every service has a memory limit, without swap, so that the stack stays within the memory budget of
# ADR-0022: those of the services that run all the time are settings of .env, from measurements
# (docs/reference/system-requirements.md), and those of the one-shot jobs are fixed here.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# What every Airflow container shares. Anchors do not cross files, so compose.celery.yaml extends services
# of this file where it needs the same settings.
x-airflow: &airflow
  # The image of Agoranomos (ADR-0002): the official image with dlt, Cosmos and dbt added. airflow-init
  # builds it from airflow/Dockerfile on every start, from the cache of Docker after the first time, so
  # it always matches the checkout, and the other services run it; it is never pulled from or pushed to
  # a registry. Only one service builds it. With a build in every service, Compose runs one build per
  # service, in parallel, each puts the name of its service on the image as a label, and which of these
  # images keeps the tag depends on timing: Compose would find a new image at every start and recreate
  # the Airflow containers.
  image: agoranomos-airflow:local
  pull_policy: never
  profiles: [core]
  restart: unless-stopped
  user: "50000:0"
  environment: &airflow-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    # How many tasks run at the same time; Airflow's own default is 32.
    AIRFLOW__CORE__PARALLELISM: ${AIRFLOW_PARALLELISM:-4}
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?run ./agoranomos init}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?run ./agoranomos init}@platform-db:5432/airflow
    # Every Airflow container must share these two keys.
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:?run ./agoranomos init}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?run ./agoranomos init}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # New DAG files appear within a minute (the default is 300 seconds).
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "60"
    # Two DAG bundles (ADR-0013): the DAGs of the base package and the deployment's own extensions.
    AIRFLOW__DAG_PROCESSOR__DAG_BUNDLE_CONFIG_LIST: >-
      [{"name": "agoranomos", "classpath": "airflow.dag_processing.bundles.local.LocalDagBundle",
      "kwargs": {"path": "/opt/agoranomos/dags"}},
      {"name": "extensions", "classpath": "airflow.dag_processing.bundles.local.LocalDagBundle",
      "kwargs": {"path": "/opt/agoranomos/extensions/dags"}}]
    # No usage telemetry from dlt, dbt and Cosmos; the image sets the same variables.
    RUNTIME__DLTHUB_TELEMETRY: "false"
    DBT_ENGINE_SEND_ANONYMOUS_USAGE_STATS: "False"
    AIRFLOW__COSMOS__ENABLE_TELEMETRY: "False"
    DO_NOT_TRACK: "1"
    # dlt takes no settings from Airflow Variables, which the Op role may create: one could send the
    # connection of a load, with its password, to another host. The image sets the same.
    PROVIDERS__ENABLE_AIRFLOW_SECRETS: "false"
    # The two caches from which Cosmos renders the tasks of dbt stay out of Airflow Variables, which
    # the Op role may edit: with the cache of dbt ls there, one could change what a dbt task runs.
    # The image sets the same.
    AIRFLOW__COSMOS__ENABLE_CACHE_DBT_LS: "False"
    AIRFLOW__COSMOS__ENABLE_CACHE_DBT_YAML_SELECTORS: "False"
  # The base DAGs and the dbt project come from the checkout, read-only. Cosmos runs dbt in a
  # temporary folder that links to the project, where dbt writes its target and logs folders.
  volumes:
    - ./airflow/dags:/opt/agoranomos/dags:ro
    - ./dbt:/opt/agoranomos/dbt:ro
    - ${AGORANOMOS_EXTENSIONS_DIR:-./extensions}/dags:/opt/agoranomos/extensions/dags:ro
    - airflow-logs:/opt/airflow/logs
  networks: [default, data]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging: *logging
  depends_on: &airflow-depends-on
    platform-db:
      condition: service_healthy
    db-init:
      condition: service_completed_successfully

services:
  # Each database runs as postgres from its first process, with no capability of Linux: the entrypoint
  # of the image then skips what needs root (a chown of the data directory and a switch of user),
  # and a new volume belongs to postgres already, as the folder of the image that it starts from.
  warehouse-db:
    image: postgres:18.6-trixie@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    profiles: [core]
    restart: unless-stopped
    user: postgres
    mem_limit: ${WAREHOUSE_DB_MEMORY:-256m}
    memswap_limit: ${WAREHOUSE_DB_MEMORY:-256m}
    environment:
      POSTGRES_PASSWORD: ${WAREHOUSE_POSTGRES_PASSWORD:?run ./agoranomos init}
      POSTGRES_DB: warehouse
    # pg_stat_statements must be loaded at start-up, so it is on from the first start: the Ops collection
    # reads it later.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=top
      - -c
      - track_io_timing=on
    volumes:
      # PostgreSQL 18 images keep their data under /var/lib/postgresql/18/docker (ADR-0003).
      - warehouse-data:/var/lib/postgresql
    networks: [data]
    cap_drop: [ALL]
    # The check connects over TCP: on the first start with an empty volume the image runs a temporary
    # server that listens only on the Unix socket while it initializes, and a check over the socket
    # could report it ready. Over TCP only the final server answers.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d warehouse"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  platform-db:
    image: postgres:18.6-trixie@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    profiles: [core]
    restart: unless-stopped
    user: postgres
    mem_limit: ${PLATFORM_DB_MEMORY:-384m}
    memswap_limit: ${PLATFORM_DB_MEMORY:-384m}
    environment:
      POSTGRES_PASSWORD: ${PLATFORM_POSTGRES_PASSWORD:?run ./agoranomos init}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=top
      - -c
      - track_io_timing=on
    volumes:
      - platform-data:/var/lib/postgresql
    networks: [data]
    cap_drop: [ALL]
    # Over TCP, for the reason given at warehouse-db.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  # Creates or updates the roles, databases and schemas of both instances on every start.
  db-init:
    image: postgres:18.6-trixie@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    profiles: [core]
    restart: "no"
    user: postgres
    mem_limit: 128m
    memswap_limit: 128m
    entrypoint: ["/bin/sh", "/opt/agoranomos/postgres/db-init.sh"]
    environment:
      WAREHOUSE_POSTGRES_PASSWORD: ${WAREHOUSE_POSTGRES_PASSWORD:?run ./agoranomos init}
      PLATFORM_POSTGRES_PASSWORD: ${PLATFORM_POSTGRES_PASSWORD:?run ./agoranomos init}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?run ./agoranomos init}
      METABASE_DB_PASSWORD: ${METABASE_DB_PASSWORD:?run ./agoranomos init}
      METABASE_READER_PASSWORD: ${METABASE_READER_PASSWORD:?run ./agoranomos init}
      WAREHOUSE_LOADER_PASSWORD: ${WAREHOUSE_LOADER_PASSWORD:?run ./agoranomos init}
      WAREHOUSE_TRANSFORMER_PASSWORD: ${WAREHOUSE_TRANSFORMER_PASSWORD:?run ./agoranomos init}
    volumes:
      - ./postgres:/opt/agoranomos/postgres:ro
    # psql writes nothing. The image declares a volume for the data of PostgreSQL, which db-init
    # does not use: the tmpfs takes its place, so that no new container of db-init leaves an
    # anonymous volume behind, which ./agoranomos down would keep.
    read_only: true
    tmpfs:
      - /var/lib/postgresql
    networks: [data]
    depends_on:
      warehouse-db:
        condition: service_healthy
      platform-db:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  # Migrates the metadata database and creates the admin user, on every start. The entrypoint of the image
  # migrates the database (_AIRFLOW_DB_MIGRATE) and then runs the command. The command creates the admin
  # with the Airflow CLI, called inside this Python process: the entrypoint's own way,
  # _AIRFLOW_WWW_USER_CREATE, runs airflow users create --password <the password>, which puts the password
  # on the command line of a process. Here the arguments exist only in sys.argv, and the command line of the
  # process holds this code. An admin that exists already is not an error: the command says so and succeeds,
  # so a password changed in Airflow stays.
  airflow-init:
    <<: *airflow
    # The one service that builds the image (see x-airflow).
    build:
      context: ./airflow
    pull_policy: build
    restart: "no"
    mem_limit: 384m
    memswap_limit: 384m
    command:
      - python
      - -c
      - |
        import os
        import sys

        from airflow.__main__ import main

        # The entrypoint carries on when the migration fails, so check that the database is up to date.
        sys.argv = ["airflow", "db", "check-migrations", "--migration-wait-timeout", "1"]
        main()
        # Airflow writes the command into its audit log and hides the password only when the command
        # starts as airflow users create, with --password <password>: keep this shape.
        sys.argv = [
            "airflow",
            "users",
            "create",
            "--role",
            "Admin",
            "--username",
            "admin",
            "--firstname",
            "Agoranomos",
            "--lastname",
            "Admin",
            "--email",
            os.environ["AGORANOMOS_ADMIN_EMAIL"],
            "--password",
            os.environ["AIRFLOW_ADMIN_PASSWORD"],
        ]
        main()
    environment:
      <<: *airflow-environment
      _AIRFLOW_DB_MIGRATE: "true"
      AGORANOMOS_ADMIN_EMAIL: ${AGORANOMOS_ADMIN_EMAIL:-admin@example.com}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?run ./agoranomos init}

  airflow-apiserver:
    <<: *airflow
    mem_limit: ${AIRFLOW_APISERVER_MEMORY:-512m}
    memswap_limit: ${AIRFLOW_APISERVER_MEMORY:-512m}
    command: ["api-server"]
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    # Reads the JSON of the health endpoint and requires a healthy metadata database, not only an HTTP
    # answer. The other components have checks of their own, and the stack tests look at all of them, so
    # this check does not depend on them.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import json
          import urllib.request

          url = "http://localhost:8080/api/v2/monitor/health"
          health = json.load(urllib.request.urlopen(url, timeout=5))
          raise SystemExit(0 if health["metadatabase"]["status"] == "healthy" else 1)
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully

  # With the LocalExecutor the scheduler also runs the tasks, as processes of its own container, so its
  # memory and its restarts are shared with them. Airflow's documentation warns that in a container a task
  # that runs out of memory can restart the scheduler (ADR-0015): on a host whose kernel has Yama, such as
  # Ubuntu, a plugin of the image makes each task process the first that the kernel stops at the memory limit
  # (airflow/plugins/agoranomos_oom.py); on Docker Desktop for macOS, which has no Yama, a task can still stop it.
  airflow-scheduler:
    <<: *airflow
    # It runs the tasks, so it gets the limit of the tasks; with CeleryExecutor the worker does.
    mem_limit: ${AIRFLOW_TASKS_MEMORY:-1280m}
    memswap_limit: ${AIRFLOW_TASKS_MEMORY:-1280m}
    command: ["scheduler"]
    environment:
      <<: *airflow-environment
      # The tasks run here with LocalExecutor, and on the worker with CeleryExecutor, which extends this
      # service. Only they get the passwords of the warehouse roles: the DAG processor parses the DAGs
      # of the extensions folder, so it gets none. The first is for dlt and the second for dbt, which
      # hides the values of DBT_ENV_SECRET_ variables in its logs.
      WAREHOUSE_LOADER_PASSWORD: ${WAREHOUSE_LOADER_PASSWORD:?run ./agoranomos init}
      DBT_ENV_SECRET_WAREHOUSE_PASSWORD: ${WAREHOUSE_TRANSFORMER_PASSWORD:?run ./agoranomos init}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://localhost:8974/health"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow
    # It runs dbt ls each time that it parses the transform DAG (docs/reference/configuration.md).
    mem_limit: ${AIRFLOW_DAG_PROCESSOR_MEMORY:-768m}
    memswap_limit: ${AIRFLOW_DAG_PROCESSOR_MEMORY:-768m}
    command: ["dag-processor"]
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 60s
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow
    mem_limit: ${AIRFLOW_TRIGGERER_MEMORY:-640m}
    memswap_limit: ${AIRFLOW_TRIGGERER_MEMORY:-640m}
    command: ["triggerer"]
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type TriggererJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 60s
    depends_on:
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully

  metabase:
    image: metabase/metabase:v0.64.1@sha256:fcf3ad4c00f303d96c63233967a24f0d0348bbb725d4704ee1961f9185674e13
    profiles: [core]
    restart: unless-stopped
    # The user that the entrypoint of the image would create and switch to, from the first process,
    # so that it needs no capability of Linux. Metabase keeps everything in its application
    # database, and its plugins in /plugins, which the image lets everyone write.
    user: "2000:2000"
    mem_limit: ${METABASE_MEMORY:-2176m}
    memswap_limit: ${METABASE_MEMORY:-2176m}
    environment:
      # Java gives its heap a quarter of the memory limit unless it is told otherwise, which would
      # leave Metabase short: half of the limit goes to the heap, and the other half holds what
      # Java needs besides, about 0.5 GiB for Metabase 0.64.1 (classes, threads and buffers).
      JAVA_OPTS: -XX:MaxRAMPercentage=50
      MB_DB_TYPE: postgres
      MB_DB_HOST: platform-db
      MB_DB_PORT: "5432"
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_DB_PASSWORD:?run ./agoranomos init}
      MB_ENCRYPTION_SECRET_KEY: ${METABASE_ENCRYPTION_KEY:?run ./agoranomos init}
      # Signs the sessions that Metabase keeps in its application database, so that whoever can read
      # or write that database cannot make a session of their own. At least 16 characters: a
      # shorter one stops Metabase at start. A new key signs everyone out of Metabase once.
      MB_SESSION_SECRET_KEY: ${METABASE_SESSION_KEY:?run ./agoranomos init}
      # The address of Metabase in its links: http://localhost and its port in local mode, and the
      # https:// address of the site in server mode, which ./agoranomos init --server sets. Metabase
      # does not redirect to HTTPS by itself: the proxy does, and metabase-init and demo-init reach
      # Metabase over the network of the stack, without HTTPS (MB_REDIRECT_ALL_REQUESTS_TO_HTTPS
      # stays unset).
      MB_SITE_URL: ${AGORANOMOS_SITE_URL:-http://localhost:${METABASE_PORT:-3000}}
      MB_ANON_TRACKING_ENABLED: "false"
      MB_CHECK_FOR_UPDATES: "false"
      # A connection of Metabase to a database may go to a private network, where the warehouse
      # is, or to a public address on the internet, but not to a loopback or link-local address,
      # such as the metadata service of a cloud at 169.254.169.254, or to another address that is
      # neither private nor public, such as the documentation range 192.0.2.0/24 (ADR-0021,
      # checked on Metabase 0.64.1, as of October 2026). Metabase 0.64 allows all by default.
      MB_WAREHOUSE_ALLOWED_NETWORKS: allow-private
      # Passwords and sessions on the internet (ADR-0019): ./agoranomos init --server sets passwords
      # of at least 15 characters, strong-enough, for new and changed passwords, and a sign-out after
      # 24 hours without activity. Local mode keeps the defaults of Metabase 0.64.1: normal, 6
      # characters and a digit, and no timeout, which an empty MB_SESSION_TIMEOUT gives, because
      # Metabase reads an empty variable as unset.
      MB_PASSWORD_COMPLEXITY: ${METABASE_PASSWORD_COMPLEXITY:-normal}
      MB_SESSION_TIMEOUT: ${METABASE_SESSION_TIMEOUT:-}
      # A new Metabase gets no Sample Database and no Examples collection, which have nothing to do
      # with marketing data.
      MB_LOAD_SAMPLE_CONTENT: "false"
      # Metabase 0.63 and 0.64 turn their AI entry points on by default: the built-in MCP server (with the
      # OAuth client registration that goes with it) and the Agent API. They stay off until an ADR decides
      # what AI access may do in Metabase (AGENTS.md). MB_AI_FEATURES_ENABLED is the master switch, which
      # the other two settings also require; all three are set, so that no one line opens an entry point.
      # A value from an environment variable wins over any value saved in Metabase, including one changed
      # in the Metabase UI.
      MB_AI_FEATURES_ENABLED: "false"
      MB_MCP_ENABLED: "false"
      MB_AGENT_API_ENABLED: "false"
      # Metabase 0.64 keeps the keys of LLM providers in a list that an admin can add to whatever the three
      # switches say. An empty list here puts the list under the control of the environment, and Metabase
      # then refuses to change it through its provider API and Admin > AI. The older per-provider
      # settings, such as that of the Anthropic key, still save a value into the stored list, which has no
      # effect, and which no one can see or clear through the API, while the variable is set. It applies
      # as soon as the variable is removed, so a change that removes it checks Admin > AI at the first
      # start without it.
      MB_LLM_PROVIDERS: "[]"
      # Metabase 0.64 can write the traces of its AI features, prompts and answers with the data that
      # they carry, into files, and show them to an admin. It is off by default and can be turned on
      # only from the environment: this keeps it off where the next person to read this file sees
      # it.
      MB_AI_EVAL_CAPTURE: "false"
      # On a sign-in from a new device, Metabase sends the address of the sign-in to get.geojs.io,
      # to name its place in an email to the user (Metabase 0.63 and 0.64). The data of a
      # deployment stays on its own machines, and so do the addresses of its users: this turns the
      # email off, and the question with it. The stack sets up no email server, so no email is lost;
      # if email is set up in Metabase later, it still sends no email about a sign-in from a new
      # device while this is false. The login history in Account settings still asks: extra_hosts
      # below answers it.
      MB_SEND_EMAIL_ON_FIRST_LOGIN_FROM_NEW_DEVICE: "false"
      # Prometheus metrics, for the planned Ops collection. The port is not published, so it is
      # reachable only from the Compose networks.
      MB_PROMETHEUS_SERVER_PORT: "9191"
    ports:
      - "127.0.0.1:${METABASE_PORT:-3000}:3000"
    # get.geojs.io is this container itself, where nothing listens, so the question of the login
    # history about the place of an address goes nowhere, and the history shows no place.
    extra_hosts:
      - "get.geojs.io:127.0.0.1"
    # default for the published port and for metabase-init; data to reach the databases.
    networks: [default, data]
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --output /dev/null http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s
    depends_on:
      platform-db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  # Exports the metadata of the dbt project on every start (ADR-0016): dbt ls reads the project, which
  # is mounted read-only, and metadata.py writes the descriptions, the meta and the columns of the models
  # and sources as JSON into the metadata-export volume, for metabase-init and demo-init. It is the one
  # service that can write that volume, and no Airflow service mounts it, so the code of a DAG cannot
  # change what the jobs with the admin password apply. It holds no secret and has no network. It runs
  # the Airflow image for its dbt, as nobody, with neither the entrypoint of Airflow nor its settings.
  metadata-export:
    image: agoranomos-airflow:local
    pull_policy: never
    profiles: [core]
    restart: "no"
    user: "65534:65534"
    mem_limit: 256m
    memswap_limit: 256m
    entrypoint: ["python", "/opt/agoranomos/metabase/metadata.py", "export"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      # No usage telemetry from dbt; the image sets the same.
      DBT_ENGINE_SEND_ANONYMOUS_USAGE_STATS: "False"
      DO_NOT_TRACK: "1"
    volumes:
      - ./dbt:/opt/agoranomos/dbt:ro
      - ./metabase:/opt/agoranomos/metabase:ro
      # The folder of the image that this volume is mounted on belongs to nobody, so the new volume
      # does too (airflow/Dockerfile).
      - metadata-export:/opt/agoranomos/metadata
    # dbt writes its target and logs folders under /tmp, and they go with the container; the job
    # writes nothing else but the export.
    read_only: true
    tmpfs:
      - /tmp
    network_mode: none
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  # Sets Metabase up on the first start and keeps the warehouse connection current on every start. Metabase
  # makes the connection to the warehouse, so this job needs the default network only, to reach Metabase.
  # Then it applies the metadata of the marts: the export and this deployment's overrides, both read-only.
  metabase-init:
    image: python:3.13.16-slim-trixie@sha256:3dd7cc108ec1493442514f5c2a871af6af0ec31d768ff6e378a93340c3b3db5f
    profiles: [core]
    restart: "no"
    user: "65534:65534"
    mem_limit: 128m
    memswap_limit: 128m
    command: ["python", "/opt/agoranomos/metabase/metabase_init.py"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      METABASE_URL: http://metabase:3000
      METABASE_SITE_NAME: Agoranomos
      METABASE_ADMIN_EMAIL: ${AGORANOMOS_ADMIN_EMAIL:-admin@example.com}
      METABASE_ADMIN_PASSWORD: ${METABASE_ADMIN_PASSWORD:?run ./agoranomos init}
      WAREHOUSE_HOST: warehouse-db
      WAREHOUSE_PORT: "5432"
      WAREHOUSE_DB: warehouse
      WAREHOUSE_USER: metabase_reader
      WAREHOUSE_PASSWORD: ${METABASE_READER_PASSWORD:?run ./agoranomos init}
      METADATA_EXPORT: /opt/agoranomos/metadata/metadata.json
      METADATA_OVERRIDES: /opt/agoranomos/extensions/metadata/overrides.toml
    volumes:
      - ./metabase:/opt/agoranomos/metabase:ro
      - metadata-export:/opt/agoranomos/metadata:ro
      - ${AGORANOMOS_EXTENSIONS_DIR:-./extensions}/metadata:/opt/agoranomos/extensions/metadata:ro
    depends_on:
      metabase:
        condition: service_healthy
      metadata-export:
        condition: service_completed_successfully
    # The job writes nothing: PYTHONDONTWRITEBYTECODE keeps Python from writing its bytecode.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  # Makes the demo ready on every start (the demo profile, which .env turns on by default): it runs the
  # demo pipeline once, then syncs the warehouse in Metabase and creates the demo collection, its
  # questions and its dashboard. It holds the passwords of both admins, which no Airflow task gets.
  # COMPOSE_PROFILES=core in .env turns the demo off.
  demo-init:
    image: python:3.13.16-slim-trixie@sha256:3dd7cc108ec1493442514f5c2a871af6af0ec31d768ff6e378a93340c3b3db5f
    profiles: [demo]
    restart: "no"
    user: "65534:65534"
    mem_limit: 128m
    memswap_limit: 128m
    command: ["python", "/opt/agoranomos/metabase/demo_init.py"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      AIRFLOW_URL: http://airflow-apiserver:8080
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?run ./agoranomos init}
      METABASE_URL: http://metabase:3000
      METABASE_ADMIN_EMAIL: ${AGORANOMOS_ADMIN_EMAIL:-admin@example.com}
      METABASE_ADMIN_PASSWORD: ${METABASE_ADMIN_PASSWORD:?run ./agoranomos init}
      # Where the warehouse is, to find its connection in Metabase; no password.
      WAREHOUSE_HOST: warehouse-db
      WAREHOUSE_PORT: "5432"
      WAREHOUSE_DB: warehouse
      WAREHOUSE_USER: metabase_reader
      METADATA_EXPORT: /opt/agoranomos/metadata/metadata.json
      METADATA_OVERRIDES: /opt/agoranomos/extensions/metadata/overrides.toml
    volumes:
      - ./metabase:/opt/agoranomos/metabase:ro
      - metadata-export:/opt/agoranomos/metadata:ro
      - ${AGORANOMOS_EXTENSIONS_DIR:-./extensions}/metadata:/opt/agoranomos/extensions/metadata:ro
    depends_on:
      airflow-apiserver:
        condition: service_healthy
      airflow-scheduler:
        condition: service_healthy
      airflow-dag-processor:
        condition: service_healthy
      metabase-init:
        condition: service_completed_successfully
    # As metabase-init, it writes nothing.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  # The proxy of server mode (the server profile, ADR-0019): the one service with ports on every
  # address of the host, TCP 80 and 443, in front of Metabase and nothing else. Airflow and Metabase
  # stay on 127.0.0.1, for SSH tunnels. It starts only after metabase-init has set Metabase up, and
  # its Caddyfile closes the setup API of Metabase for good (caddy/Caddyfile). Its image is the
  # official one of Caddy without the file capability of the binary, built from caddy/, with the
  # Caddyfile in it: like airflow-init, it builds on every start, from the cache of Docker after the
  # first time, so a changed Caddyfile recreates the proxy.
  proxy:
    image: agoranomos-caddy:local
    build:
      context: ./caddy
    pull_policy: build
    profiles: [server]
    restart: unless-stopped
    user: "65534:65534"
    mem_limit: ${PROXY_MEMORY:-256m}
    memswap_limit: ${PROXY_MEMORY:-256m}
    environment:
      AGORANOMOS_SITE_URL: ${AGORANOMOS_SITE_URL:-http://localhost:${METABASE_PORT:-3000}}
      AGORANOMOS_TLS: ${AGORANOMOS_TLS:-acme}
      AGORANOMOS_ACME_CA: ${AGORANOMOS_ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
    # AGORANOMOS_TLS=internal gives the site a certificate of the own authority of Caddy, for
    # tests; acme, the default, one from AGORANOMOS_ACME_CA. The shell becomes Caddy (exec), which
    # then gets the signals of Docker.
    command:
      - sh
      - -c
      - |
        case "$$AGORANOMOS_TLS" in
          acme) CADDY_TLS="" ;;
          internal) CADDY_TLS="tls internal" ;;
          *) echo "proxy: AGORANOMOS_TLS in .env must be acme or internal" >&2; exit 1 ;;
        esac
        export CADDY_TLS
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # The certificates and the key of the account of ACME. A lost volume means a new certificate,
      # and Let's Encrypt issues at most five for the same names in a week; backups leave it out.
      - caddy-data:/data
    read_only: true
    networks: [default]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      metabase-init:
        condition: service_completed_successfully
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

networks:
  # The databases have no route to the internet; with CeleryExecutor, the broker joins them here.
  data:
    internal: true

volumes:
  warehouse-data:
  platform-data:
  airflow-logs:
  # The export of metadata-export: only that job writes it.
  metadata-export:
  # The certificates of the proxy of server mode.
  caddy-data:
