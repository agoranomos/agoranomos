[default]
# The links to commits in CHANGELOG.md, which release-please writes: a short hash such as
# 7ba175e is not a word, and nobody can choose it.
extend-ignore-re = [
    '\[[0-9a-f]{7,}\]\(https://github\.com/[^)]+/commit/[0-9a-f]{40}\)',
]

[default.extend-words]
agoranomos = "agoranomos"
agoranomoi = "agoranomoi"
# The Python package of the Mozilla root certificates, which airflow/requirements.txt pins.
certifi = "certifi"
# German for "search", in the name of an ad account of the demo.
suche = "suche"

[files]
# Mermaid as released, minified: its short names are not words (see .pre-commit-config.yaml).
# The seeds of ISO 4217 and of the tz database are those lists as their publishers write them:
# codes such as JOD and names such as Som are not misspellings, and a fix would change the data.
extend-exclude = [
    "docs/assets/javascripts/mermaid.min.js",
    "dbt/seeds/seed_iso_4217_currencies.csv",
    "dbt/seeds/seed_iana_time_zones.csv",
]
