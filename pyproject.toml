[project]
name = "agoranomos"
version = "0.0.0"
description = "Open-source marketing BI out of the box, with AI access via MCP."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = "==3.13.*"
dependencies = []

[dependency-groups]
dev = [
    "prek==0.5.7",
    "pytest==9.1.1",
    "pytest-xdist==3.8.0",
    "ruff==0.17.3",
    "zensical==0.0.73",
]

[tool.uv]
# The root is a workspace for tooling and future packages; it is never built or installed itself.
package = false
# The minimum uv version: an older uv stops with an error. CI uses the exact version pinned in ci.yml and stack.yml.
required-version = ">=0.12.22"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "S", "PT", "AIR"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert, made-up passwords, local HTTP servers and subprocesses by design.
"tests/**" = ["S101", "S105", "S106", "S310", "S603", "S607"]

[tool.pytest.ini_options]
# The unit tests in tests/unit run by default. The stack tests in tests/stack need a running
# stack: start it with ./agoranomos up, then run uv run pytest tests/stack.
testpaths = ["tests/unit"]
pythonpath = ["scripts", "metabase", "airflow/dags"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "transform: a stack test that loads or transforms the demo, or reads what such a run left in its module, which takes minutes",
    "demo: a stack test that needs the profile demo, the data of the fictional platforms or the content of the demo in Metabase, which .env lists by default; it skips without it, and the job of CI without the demo leaves it out with -m \"not demo\"",
]
