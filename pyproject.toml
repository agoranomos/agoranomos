[project]
name = "agoranomos"
version = "0.0.0"
description = "Open-source marketing BI out of the box, with AI access via MCP."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = "==3.13.*"
dependencies = []

[dependency-groups]
dev = [
    "prek==0.5.4",
    "ruff==0.16.10",
    "zensical==0.0.67",
]

[tool.uv]
# The root is a workspace for tooling and future packages; it is never built or installed itself.
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "S", "PT", "AIR"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
