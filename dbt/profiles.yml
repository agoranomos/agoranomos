# dbt connects to the warehouse as the transformer role. Only the password comes from the environment:
# the Airflow services that run tasks have it, and dbt hides the values of DBT_ENV_SECRET_ variables in
# its logs. The DAG processor parses the project without it, because dbt ls does not connect.
# Cosmos 1.15.1 reads this file again, without dbt, and builds the URIs of the assets that it emits
# from the host, the port and the database. Its readers know the filters of Jinja but not those of
# dbt: the reader of the local mode, which the DAG uses, knows only as_number of them, and the reader
# of the watcher mode knows none, so that as_number there means no asset at all
# (astronomer/astronomer-cosmos#2948). So the file keeps to one plain env_var call, and the numbers
# are literals.
agoranomos:
  target: prod
  outputs:
    prod:
      type: postgres
      host: warehouse-db
      port: 5432
      user: transformer
      password: "{{ env_var('DBT_ENV_SECRET_WAREHOUSE_PASSWORD', '') }}"
      dbname: warehouse
      schema: marts
      threads: 4
