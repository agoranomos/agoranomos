# The dbt project of agoranomos (ADR-0005): the model of advertising statistics (ADR-0025), from the
# raw data of each platform through staging and the intermediate models to the marts. Airflow runs
# it through Cosmos, in the DAG agoranomos_demo_transform, as the transformer role. The project is
# mounted read-only: Cosmos runs dbt in a temporary folder that links to the project, where dbt
# writes its target and logs folders.
name: agoranomos
version: "0.1.0"
config-version: 2
require-dbt-version: [">=1.12.0", "<1.13.0"]
profile: agoranomos

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
# The packages of packages.yml, which the Airflow image installs here when it is built: the project
# is mounted read-only, and no task of dbt runs dbt deps (ADR-0029).
packages-install-path: /opt/airflow/dbt_packages

flags:
  # No usage telemetry; the image also sets DBT_ENGINE_SEND_ANONYMOUS_USAGE_STATS=False.
  send_anonymous_usage_stats: false

models:
  agoranomos:
    # dbt writes the descriptions into the comments of the tables, views and columns that it
    # builds, for SQL clients and the planned AI access (docs/reference/describe-the-marts.md).
    +persist_docs:
      relation: true
      columns: true
    staging:
      +schema: staging
      +materialized: view
    # The steps that the platforms share (ADR-0025): views in staging until an AI role needs a
    # schema of their own.
    intermediate:
      +schema: staging
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
    # The models of the Ops collection in Metabase (ADR-0029): views over the results that
    # elementary records and over the record of the loads, which metabase_reader may read; the
    # tables of elementary in the same schema it may not.
    ops:
      +schema: ops
      +materialized: view
      +grants:
        select: [metabase_reader]
  # The tables and views of elementary, in which its hooks record each run of dbt and its tests.
  elementary:
    +schema: ops

# The settings of elementary (ADR-0029). No rows of the data that a test finds: the result of a
# test is its status and the number of rows. The tables of the artifacts of the project, such as
# its models and tests, are written once a run, by the task that builds the models of elementary,
# and not by the hooks of each task of dbt, which takes about a second instead of three.
vars:
  test_sample_row_count: 0
  disable_dbt_artifacts_autoupload: true

# The tests of the base package. A test with the severity error, the default, stops the models that
# read its node (TestBehavior.BUILD of Cosmos, ADR-0028), and carries the tag critical (ADR-0038),
# for a run of the blocking tests by hand: dbt build --select tag:critical (CONTRIBUTING.md). Every
# test of the staging models and of the marts blocks, so their directories give the tag here: dbt
# gives a generic test the configs of the directory of its YAML file. Tags add up and none can be
# taken back, so where a directory holds a warning, the intermediate models, each test that blocks
# carries the tag in its YAML; so do the tests of the seeds, whose YAML lies at the root of seeds,
# and the singular test that blocks, in its config; the four singular tests that warn carry none.
# tests/unit/test_dbt_project.py checks that the tag and the severity agree.
data_tests:
  agoranomos:
    staging:
      +tags: [critical]
    marts:
      +tags: [critical]

seeds:
  agoranomos:
    # The lists that the model checks against: the platforms, the conversion actions, the
    # currencies of ISO 4217 and the time zones of IANA.
    +schema: staging
    +persist_docs:
      relation: true
      columns: true
    +quote_columns: false
