# The dbt project of agoranomos (ADR-0005): the model of advertising statistics (ADR-0036,
# ADR-0037), from the raw data of each platform through staging and the intermediate models to the
# core, and the marts as views over the core. Airflow runs
# it through Cosmos, in the DAG agoranomos_demo_transform, as the transformer role. The project is
# mounted read-only: Cosmos runs dbt in a temporary folder that links to the project, where dbt
# writes its target and logs folders.
name: agoranomos
version: "0.1.0"
config-version: 2
require-dbt-version: [">=1.12.0", "<1.13.0"]
profile: agoranomos

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
# The packages of packages.yml, which the Airflow image installs here when it is built: the project
# is mounted read-only, and no task of dbt runs dbt deps (ADR-0029).
packages-install-path: /opt/airflow/dbt_packages

flags:
  # No usage telemetry; the image also sets DBT_ENGINE_SEND_ANONYMOUS_USAGE_STATS=False.
  send_anonymous_usage_stats: false

models:
  agoranomos:
    # dbt writes the descriptions into the comments of the tables, views and columns that it
    # builds, for SQL clients and the planned AI access (docs/reference/describe-the-marts.md).
    +persist_docs:
      relation: true
      columns: true
    staging:
      +schema: staging
      +materialized: view
    # The steps that the platforms share (ADR-0025): views in staging until an AI role needs a
    # schema of their own.
    intermediate:
      +schema: staging
      +materialized: view
    # The marts (ADR-0037): views over the core, which read nothing else, as a view over a model
    # that a run rebuilds would go with it. A run of the transform builds a view that does not
    # exist, and leaves one that exists as it is, with its tests (macros/marts_view.sql); a build
    # with the var rebuild_views builds them all again.
    marts:
      +schema: marts
      +materialized: view
    # The dimensions and the registries of the core (ADR-0036, ADR-0038): incremental models that
    # merge their rows into the tables that the migrations of postgres/migrations create, own and
    # describe, so that transformer can neither drop nor change a table (ADR-0035). Never a full
    # refresh, as a rebuild would drop the table with the views over it; a model whose columns or
    # types no longer match its table fails rather than change it, as dbt would drop a column with
    # cascade to widen its type; and no comment, as persist_docs needs the ownership of the table.
    core:
      +schema: core
      +materialized: incremental
      +incremental_strategy: merge
      +full_refresh: false
      +on_schema_change: fail
      +persist_docs:
        relation: false
        columns: false
    # The models of the Ops collection in Metabase (ADR-0029): views over the results that
    # elementary records and over the record of the loads, which metabase_reader may read; the
    # tables of elementary in the same schema it may not.
    ops:
      +schema: ops
      +materialized: view
      +grants:
        select: [metabase_reader]
  # The tables and views of elementary, in which its hooks record each run of dbt and its tests.
  elementary:
    +schema: ops

# The versions of the campaigns, the ad groups and the ads (ADR-0036): snapshots of dbt in core,
# which transformer creates and so owns, with the right CREATE on the schema (warehouse.sql), and
# whose descriptions persist_docs writes. Each compares the columns of its check_cols in
# _snapshots.yml, and keeps the newest version of an entity that a run no longer reads, as a run
# does not read the entities of every account (hard_deletes ignore). The version that holds ends at
# the end of 9999, not at none, so that a fact finds the version of its day with one condition;
# from its second run a snapshot writes through a temporary table, which transformer may create
# (#187).
snapshots:
  agoranomos:
    +schema: core
    +strategy: check
    +hard_deletes: ignore
    +dbt_valid_to_current: "'9999-12-31 00:00:00'::timestamp"
    +persist_docs:
      relation: true
      columns: true

vars:
  # The settings of elementary (ADR-0029). No rows of the data that a test finds: the result of a
  # test is its status and the number of rows. The tables of the artifacts of the project, such as
  # its models and tests, are written once a run, by the task that builds the models of
  # elementary, and not by the hooks of each task of dbt, which takes about a second instead of
  # three.
  test_sample_row_count: 0
  disable_dbt_artifacts_autoupload: true
  # The share of the rows of an account in a dimension of the core above which its stubs, the
  # entities that only the statistics name, raise a warning (tests/generic/few_stubs.sql,
  # ADR-0036). Google lists the removed entities too, so a stub there means a connector that left
  # out a list; 5% leaves room for the deleted entities of Meta and of TikTok, which their lists
  # can leave out. Not checked yet on a live account.
  stub_share_warn: 0.05
  # The share of the spend that the core holds for an account on the days of a window that a load
  # may lose before G1a puts the account in quarantine (macros/quarantine.sql, ADR-0035): a window
  # replaces whole days, so a read that lost most of an account, such as a token that lost the
  # right to some of its campaigns, would erase them. A restatement of the platform moves the
  # spend of past days a little, and a window with no row at all goes to quarantine whatever the
  # share. Half leaves room for the restatements of a small account on a short window. Not checked
  # yet on a live account: the stand of #217 sets it.
  quarantine_spend_fall: 0.5
  # The share of the rows of a fact of the core in the windows of a run whose entity, a campaign, an
  # ad group or an ad, has no row in its dimension, above which G2 fails the run
  # (tests/generic/few_without_a_dimension.sql, ADR-0035). Each entity that the statistics name gets
  # a row, as a stub if no list gives it, so one in a thousand is a margin, not an expectation. Not
  # checked yet on a live account.
  dimensionless_share: 0.001
  # Whether core_fx_rates_daily computes every day of the rates again, and not only the days that
  # the loads of the run bring (models/core/core_fx_rates_daily.sql, ADR-0042), as after a change of
  # AGORANOMOS_REPORTING_CURRENCY: dbt run --select core_fx_rates_daily --vars
  # '{recompute_rates: true}'. A run computes every day by itself for a reporting currency of which
  # the table holds no row yet.
  recompute_rates: false

# The tests of the base package. A test with the severity error, the default, stops the models that
# read its node (TestBehavior.BUILD of Cosmos, ADR-0028), and carries the tag critical (ADR-0038),
# for a run of the blocking tests by hand: dbt build --select tag:critical (CONTRIBUTING.md). Every
# test of the staging models and of the marts blocks, so their directories give the tag here: dbt
# gives a generic test the configs of the directory of its YAML file. Tags add up and none can be
# taken back, so where a directory holds a warning, the intermediate models and the core, each test
# that blocks carries the tag in its YAML; so do the tests of the seeds, whose YAML lies at the root
# of seeds, and those of the snapshots, and the singular test that blocks, in its config; the four
# singular tests that warn carry none.
# tests/unit/test_dbt_project.py checks that the tag and the severity agree.
data_tests:
  agoranomos:
    staging:
      +tags: [critical]
    marts:
      +tags: [critical]

seeds:
  agoranomos:
    # The lists that the model checks against: the platforms, the conversion actions, the
    # currencies of ISO 4217 and the time zones of IANA.
    +schema: staging
    +persist_docs:
      relation: true
      columns: true
    +quote_columns: false
