sources:
  - name: raw_nbk
    description: >-
      The official rates of the tenge of the National Bank of Kazakhstan, which the DAG
      agoranomos_nbk_daily loads with dlt from the feed rss/get_rates.cfm of the NBK (ADR-0042),
      under its data licence, which allows their use with the source named. The DAG starts paused,
      so a deployment with the demo alone has no table here, and the models that read these tables
      then read none.
    schema: raw_nbk
    # No freshness check of dbt: the Ops collection shows the last load, from _agoranomos_loads
    # (models/ops/ops_loads.sql).
    config:
      freshness: null
    tables:
      - name: _agoranomos_loads
        description: >-
          The journal of the loads of the rates of the NBK: one row for each load, written in the
          same run as the rates of the load, so under its _dlt_load_id, with the account KZT, the
          base of the rates, the status loaded, the day of the load in Astana (as_of), the first
          and last day of the window that the load took (window_from, window_to), and the moment of
          the load (loaded_at). The staging model reads, for each day, the rates of the newest
          pinned load whose window covers the day.
      - name: _dlt_loads
        description: >-
          The loads of dlt into raw_nbk, one row each: a load is whole once it has its row here,
          with status 0, which dlt writes after the last table of the load. The pin of each run of
          the transform takes whole loads only.
      - name: rates_daily
        description: >-
          The official rates of the tenge of the NBK, one row for each currency and calendar day,
          as the feed names the elements of each of its items, every one text: the day of the feed
          as DD.MM.YYYY (date), the name of the currency in Russian (fullname), its ISO code
          (title), the price in tenge of quant units of it (description), quant, and the direction
          and size of the change from the day before (index, change). Every calendar day has a set,
          weekends and holidays too. Each load appends its rows under its own _dlt_load_id, and
          staging reads, for each day, those of the newest pinned load whose window covers the day.
