      - name: campaign_id
        description: '{{ doc("campaign_id") }}'
      - name: ad_group_id
        description: '{{ doc("ad_group_id") }}'
      - name: loaded_ad_group_name
        description: '{{ doc("loaded_ad_group_name") }}'
      - name: impressions
        description: '{{ doc("impressions") }}'
      - name: clicks
        description: '{{ doc("clicks") }}'
      - name: spend
        description: '{{ doc("spend") }}'
      - name: platform_conversions
        description: '{{ doc("platform_conversions") }}'
      - name: platform_conversion_value
        description: '{{ doc("platform_conversion_value") }}'
