  - name: stg_tiktok_ads__ads
    description: >-
      The ads of TikTok, one row for each ad that the newest list of its advertiser names, from the
      newest load of the advertiser that a run pinned, whose ID is load_id: an advertiser that
      failed in a load keeps the list of the load before, and an ad that the newest list no longer
      names is not here, so that its dimension in the core says that the platform no longer lists
      it; one that only the statistics name is a stub there (ADR-0036). An ad of a deleted campaign
      or ad group is removed. platform, account_id, ad_group_id and ad_id are its key. Its tests
      guard the marts: when one of them fails, dbt does not rebuild the models that read this one.
    data_tests:
      - unique_combination:
          arguments:
            columns: [platform, account_id, ad_group_id, ad_id]
    columns:
      - name: platform
        description: '{{ doc("platform") }}'
        data_tests: [not_null]
      - name: account_id
        description: '{{ doc("account_id") }}'
        data_tests: [not_null]
      - name: campaign_id
        description: '{{ doc("campaign_id") }}'
        data_tests: [not_null]
      - name: ad_group_id
        description: '{{ doc("ad_group_id") }}'
        data_tests: [not_null]
      - name: ad_id
        description: '{{ doc("ad_id") }}'
        data_tests: [not_null]
      - name: observed_name
        description: '{{ doc("observed_name") }}'
