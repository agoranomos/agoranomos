    description: >-
      The ad groups of TikTok, one row for each ad group that the newest list of its advertiser
      names, from the newest load of the advertiser that a run pinned, whose ID is load_id: an
      advertiser that failed in a load keeps the list of the load before, and an ad group that the
      newest list no longer names is not here, so that its dimension in the core says that the
      platform no longer lists it; one that only the statistics name is a stub there (ADR-0036). An
      ad group of a deleted campaign is removed. platform, account_id and ad_group_id are its key.
      Its tests guard the marts: when one of them fails, dbt does not rebuild the models that read
      this one.
    data_tests:
      - unique_combination:
          arguments:
