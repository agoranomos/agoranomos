        description: '{{ doc("ad_status") }}'
      - name: ad_state
        description: '{{ doc("ad_state") }}'
      - name: ad_type
        description: '{{ doc("ad_type") }}'
      - name: load_id
        description: '{{ doc("load_id") }}'
        data_tests: [not_null]
  - name: stg_tiktok_ads__account_totals
    description: >-
      The totals of the TikTok advertisers of the deployment by day, one row for each advertiser and
      day with a metric, from the integrated report at the level AUCTION_ADVERTISER, which returns
      the data of all the ads of the advertiser: the side of the platform of G0a (ADR-0035,
      ADR-0053), with the load of each row; clicks are the clicks (destination). It is empty until
      the first load. report_date, platform and account_id are its key. int_g1_failures compares the
      statistics of the campaigns of each advertiser and day with them, and holds an advertiser
      whose campaigns do not add up to them, within the share of platform_totals_tolerance, out of
      the core and the marts, and core.platform_totals_daily keeps them. Its tests guard the marts:
      when one of them fails, dbt does not rebuild the models that read this one.
    columns:
      - name: report_date
        description: '{{ doc("report_date") }}'
        data_tests: [not_null]
      - name: platform
        description: '{{ doc("platform") }}'
        data_tests: [not_null]
      - name: account_id
        description: '{{ doc("account_id") }}'
        data_tests: [not_null]
      - name: total_impressions
        description: '{{ doc("total_impressions") }}'
      - name: total_clicks
        description: '{{ doc("total_clicks") }}'
      - name: total_spend
        description: '{{ doc("total_spend") }}'
      - name: load_id
        description: '{{ doc("load_id") }}'
