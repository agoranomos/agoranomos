sources:
  - name: raw_google_ads
    description: >-
      The Google Ads accounts of the deployment that extensions/model/clients.toml names, which the
      DAG agoranomos_google_ads_daily loads with dlt from the REST interface of the Google Ads API
      (ADR-0032), each result as the API gives it, nested objects joined by __. The DAG starts
      paused, so a deployment without Google Ads has no table here, and the models that read these
      tables then read none.
    schema: raw_google_ads
    # No freshness check of dbt: the Ops collection shows the last load of each account, from
    # _agoranomos_reloads (models/ops/ops_loads.sql).
    config:
      freshness: null
    tables:
      - name: _agoranomos_reloads
        description: >-
          The journal of the loads of Google Ads: one row for each account in each load. An account
          that the load took has the status loaded, the day of the load in the time zone of the
          account (as_of), the first and last day that the load replaced (window_start,
          window_end), and the moment of the load. An account whose request to the API failed has
          the status failed, the text of the error, and no day. The rows of the loads before the
          status existed have none, and all of them loaded.
      - name: customers
        description: >-
          Each account as its customer resource gives it: its ID, name, currency, time zone,
          status and whether it is a manager account. Each load replaces the table.
      - name: campaigns
        description: >-
          The campaigns of each account, with their status and channel type, one row for each
          version that the loads saw: dlt keeps the versions (scd2), from _dlt_valid_from until
          _dlt_valid_to.
      - name: campaign_stats
        description: >-
          The statistics of each campaign by day (segments.date): impressions and clicks as
          strings, the INT64 numbers of the REST interface, cost in micros, and the conversions of
          the platform. Each load replaces the days of each account that it covers.
      - name: campaign_conversions
        description: >-
          The conversions of each campaign by day and conversion action, from a query of its own,
          as segments.conversion_action cannot be selected with the cost: the conversions of the
          platform and all conversions, with their values. Each load replaces the days of each
          account that it covers.
      - name: ad_groups
        description: >-
          The ad groups of each account, with their campaign, status and type, one row for each
          version that the loads saw: dlt keeps the versions (scd2), from _dlt_valid_from until
          _dlt_valid_to. A Performance Max campaign has none.
      - name: ad_group_stats
        description: >-
          The statistics of each ad group by day (segments.date): impressions and clicks as strings,
          the INT64 numbers of the REST interface, cost in micros, and the conversions of the
          platform. Each load replaces the days of each account that it covers.
      - name: ad_group_conversions
        description: >-
          The conversions of each ad group by day and conversion action, from a query of its own, as
          segments.conversion_action cannot be selected with the cost: the conversions of the
          platform and all conversions, with their values. Each load replaces the days of each
          account that it covers.
      - name: ads
        description: >-
          The ads of each account in their ad groups (ad_group_ad), with their status and type, one
          row for each version that the loads saw: dlt keeps the versions (scd2), from
          _dlt_valid_from until _dlt_valid_to. A type of ad that has no name on Google has no value
          in ad_group_ad__ad__name.
      - name: ad_stats
        description: >-
          The statistics of each ad by day (segments.date), in the form of ad_group_stats. Each load
          replaces the days of each account that it covers.
      - name: ad_conversions
        description: >-
          The conversions of each ad by day and conversion action, in the form of
          ad_group_conversions. Each load replaces the days of each account that it covers.
