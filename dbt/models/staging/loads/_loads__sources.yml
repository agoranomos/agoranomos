sources:
  - name: core
    description: >-
      The core of the warehouse, whose tables the migrations of postgres/migrations create and
      describe, owned by the role migrator, so that dbt writes their rows and can drop or change
      none of them (ADR-0035, ADR-0038).
    schema: core
    # The pin writes it at the start of every run of the transform: no freshness.
    config:
      freshness: null
    tables:
      - name: loads
        description: >-
          The journal of the loads of the core: one row for each load of a source and each account
          in it, which the task of the pin of each run of the transform copies from the journal
          _agoranomos_loads of the source once the load is whole, before the tasks of dbt, with
          its window, or its error for a failed account, and the status pinned until the core
          accepts it. stg_loads__newest_days reads the loads of each run from it.
      - name: dim_account
        description: >-
          The registry of the accounts of the core, which the model dim_account writes, as the runs
          before this one left it: the checks of G1a in int_g1_failures read it before this run
          writes the core, to find the accounts of the rows of core.ad_stats_campaign_daily.
      - name: ad_stats_campaign_daily
        description: >-
          The statistics of the campaigns by day in the core, as the runs before this one left
          them: the checks of G1a in int_g1_failures compare the spend of the window of each
          account with what this table holds on the same days, before this run writes the core.
      - name: web_sessions_daily
        description: >-
          The sessions of web analytics by day in the core, as the runs before this one left them:
          the checks of G1a in int_g1_failures find a load of a property with no row on the days on
          which this table holds sessions, before this run writes the core.
