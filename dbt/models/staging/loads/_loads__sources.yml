sources:
  - name: core
    description: >-
      The core of the warehouse, whose tables the migrations of postgres/migrations create and
      describe, owned by the role migrator, so that dbt writes their rows and can drop or change
      none of them (ADR-0035, ADR-0038).
    schema: core
    # The pin writes it at the start of every run of the transform: no freshness.
    config:
      freshness: null
    tables:
      - name: loads
        description: >-
          The journal of the loads of the core: one row for each load of a source and each account
          in it, which the task of the pin of each run of the transform copies from the journal
          _agoranomos_loads of the source once the load is whole, before the tasks of dbt, with
          its window, or its error for a failed account, and the status pinned until the core
          accepts it. stg_loads__newest_days reads the loads of each run from it.
      - name: dim_account
        description: >-
          The registry of the accounts of the core, which the model dim_account writes, as the runs
          before this one left it: the checks of G1a in int_g1_failures read it before this run
          writes the core, to find the accounts of the rows of core.ad_stats_campaign_daily.
      - name: dim_campaign
        description: >-
          The campaigns of the core, which the model dim_campaign writes, as the runs before this
          one left them: int_campaigns__current keeps the attributes of a campaign that the newest
          list of its account no longer names, and says that the platform no longer lists it.
      - name: dim_ad_group
        description: >-
          The ad groups of the core, which the model dim_ad_group writes, as the runs before this
          one left them: int_ad_groups__current keeps the attributes of an ad group that the newest
          list of its account no longer names, and says that the platform no longer lists it.
      - name: dim_ad
        description: >-
          The ads of the core, which the model dim_ad writes, as the runs before this one left them:
          int_ads__current keeps the attributes of an ad that the newest list of its account no
          longer names, and says that the platform no longer lists it.
      - name: dim_conversion_action
        description: >-
          The registry of the conversion actions of the core, which the model dim_conversion_action
          writes, as the runs before this one left it: int_conversion_actions__resolved keeps what
          a list of Google Ads said of an action that no list of this run names.
      - name: ad_stats_campaign_daily
        description: >-
          The statistics of the campaigns by day in the core, as the runs before this one left
          them: the checks of G1a in int_g1_failures compare the spend of the window of each
          account with what this table holds on the same days, before this run writes the core,
          and the test assert_every_account_with_data_is_in_the_settings finds the accounts that
          the settings no longer name and that this table holds rows of.
      - name: web_sessions_daily
        description: >-
          The sessions of web analytics by day in the core, as the runs before this one left them:
          the checks of G1a in int_g1_failures find a load of a property with no row on the days on
          which this table holds sessions, before this run writes the core, and the test
          assert_every_account_with_data_is_in_the_settings finds the properties that the settings
          no longer name and that this table holds rows of.
      - name: fx_rates_daily
        description: >-
          The rates of the core into the reporting currency, which the model core_fx_rates_daily
          writes, as the runs before this one left them: the check of the rates in
          int_g1_failures finds an account whose currency neither they nor the loads of the rates
          that this run reads have a rate of, before this run writes the core.
