sources:
  - name: raw_ecb
    description: >-
      The reference rates of the euro of the European Central Bank, which the DAG
      agoranomos_ecb_daily loads with dlt from the data API of the ECB (ADR-0032). The DAG starts
      paused, so a deployment with the demo alone has no table here, and the models that read
      these tables then read none.
    schema: raw_ecb
    # No freshness check of dbt: the Ops collection shows the last load, from _agoranomos_loads
    # (models/ops/ops_loads.sql).
    config:
      freshness: null
    tables:
      - name: _agoranomos_loads
        description: >-
          The journal of the loads of the rates of the ECB: one row for each load, written in the
          same run as the rates of the load, so under its _dlt_load_id, with the account EUR, the
          base of the rates, the status loaded, the day of the load in Frankfurt (as_of), the first
          and last day of the window that the load took (window_from, window_to), and the moment of
          the load (loaded_at). The staging model reads, for each day, the rates of the newest
          pinned load whose window covers the day.
      - name: _dlt_loads
        description: >-
          The loads of dlt into raw_ecb, one row each: a load is whole once it has its row here,
          with status 0, which dlt writes after the last table of the load. The pin of each run of
          the transform takes whole loads only.
      - name: rates_daily
        description: >-
          The daily reference rates of the euro of the ECB, the series EXR D..EUR.SP00.A, one row
          for each currency and day of publication, as the CSV of the data API of the ECB names its
          columns, every one text: the value of one unit of currency_denom in currency on the day of
          time_period, in obs_value. A weekend or a closing day of TARGET has no row. Each load
          appends its rows under its own _dlt_load_id, and staging reads, for each day, those of the
          newest pinned load whose window covers the day.
