models:
  - name: stg_demo_video__campaign_stats
    description: >-
      The statistics of the campaigns of demo_video, one row for each campaign and day, from its
      integrated report by campaign and day, with the column names of the model; clicks are its
      clicks (destination). report_date, platform, account_id and campaign_id are its key.
      int_g1_failures checks its rows for each account, and holds an account whose rows fail out of
      the core and the marts (ADR-0035). Its tests guard the marts: when one of them fails, dbt does
      not rebuild the models that read this one.
    columns:
      - name: report_date
        description: '{{ doc("report_date") }}'
        data_tests: [not_null]
      - name: platform
        description: '{{ doc("platform") }}'
        data_tests: [not_null]
      - name: account_id
        description: '{{ doc("account_id") }}'
        data_tests: [not_null]
      - name: campaign_id
        description: '{{ doc("campaign_id") }}'
      - name: loaded_campaign_name
        description: '{{ doc("loaded_campaign_name") }}'
      - name: impressions
        description: '{{ doc("impressions") }}'
      - name: clicks
        description: '{{ doc("clicks") }}'
      - name: spend
        description: '{{ doc("spend") }}'
      - name: platform_conversions
        description: '{{ doc("platform_conversions") }}'
      - name: platform_conversion_value
        description: '{{ doc("platform_conversion_value") }}'
  - name: stg_demo_video__campaign_conversions
    description: >-
      The conversions of the campaigns of demo_video by action, one row for each campaign, day and
      action with a count or a value, from its integrated report: complete_payment, the complete
      payments with the value of the purchases, and conversion, the event that the campaign
      optimizes for, which has no value. report_date, platform, account_id, campaign_id and
      conversion_action_id are its key. int_g1_failures checks its rows for each account, and holds
      an account whose rows fail out of the core and the marts (ADR-0035). Its tests guard the
      marts: when one of them fails, dbt does not rebuild the models that read this one.
    columns:
      - name: report_date
        description: '{{ doc("report_date") }}'
        data_tests: [not_null]
      - name: platform
        description: '{{ doc("platform") }}'
        data_tests: [not_null]
      - name: account_id
        description: '{{ doc("account_id") }}'
        data_tests: [not_null]
      - name: campaign_id
        description: '{{ doc("campaign_id") }}'
      - name: conversion_action_id
        description: '{{ doc("conversion_action_id") }}'
      - name: conversion_action_name
        description: '{{ doc("conversion_action_name") }}'
      - name: platform_category
        description: '{{ doc("platform_category") }}'
      - name: attribution_setting
        description: '{{ doc("attribution_setting") }}'
      - name: conversions
        description: '{{ doc("conversions") }}'
      - name: conversion_value
        description: '{{ doc("conversion_value") }}'
      - name: platform_conversions
        description: '{{ doc("platform_conversions") }}'
      - name: platform_conversion_value
        description: '{{ doc("platform_conversion_value") }}'
      - name: all_conversions
        description: '{{ doc("all_conversions") }}'
      - name: all_conversion_value
        description: '{{ doc("all_conversion_value") }}'
  - name: stg_demo_video__accounts
    description: >-
      The ad accounts of demo_video, its advertisers, one row each, from the newest load of the
      account that a run pinned. platform and account_id are its key. int_g1_failures checks each
      account for its key, its currency and its time zone, and holds one that fails out of the core
      and the marts (ADR-0035). Its tests guard the marts: when one of them fails, dbt does not
      rebuild the models that read this one.
    columns:
      - name: platform
        description: '{{ doc("platform") }}'
        data_tests: [not_null]
      - name: account_id
        description: '{{ doc("account_id") }}'
        data_tests: [not_null]
      - name: account_name
        description: '{{ doc("account_name") }}'
      - name: currency
        description: '{{ doc("currency") }}'
      - name: time_zone
        description: '{{ doc("time_zone") }}'
      - name: manager_account_id
        description: '{{ doc("manager_account_id") }}'
      - name: account_status
        description: '{{ doc("account_status") }}'
  - name: stg_demo_video__campaigns
    description: >-
      The campaigns of demo_video, one row for each campaign that the newest list of its account
      names, from the newest load of the account that a run pinned, whose ID is load_id: an account
      that failed in a load keeps the list of the load before, and a campaign that the newest list
      no longer names is not here, so that its dimension in the core says that the platform no
      longer lists it. The platform does not list a removed campaign. platform, account_id and
      campaign_id are its key. Its tests guard the marts: when one of them fails, dbt does not
      rebuild the models that read this one.
    data_tests:
      - unique_combination:
          arguments:
            columns: [platform, account_id, campaign_id]
    columns:
      - name: platform
        description: '{{ doc("platform") }}'
        data_tests: [not_null]
      - name: account_id
        description: '{{ doc("account_id") }}'
        data_tests: [not_null]
      - name: campaign_id
        description: '{{ doc("campaign_id") }}'
        data_tests: [not_null]
      - name: observed_name
        description: '{{ doc("observed_name") }}'
        data_tests: [not_null]
      - name: campaign_status
        description: '{{ doc("campaign_status") }}'
      - name: campaign_state
        description: '{{ doc("campaign_state") }}'
      - name: campaign_type
        description: '{{ doc("campaign_type") }}'
      - name: load_id
        description: '{{ doc("load_id") }}'
        data_tests: [not_null]
