sources:
  - name: raw_demo
    description: >-
      The demo data that the DAG agoranomos_demo_load loads with dlt: one fictional ad account with
      three campaigns.
    schema: raw_demo
    tables:
      - name: ad_stats_daily
        description: >-
          The demo statistics of ads as dlt loads them, one row for each campaign and day. dlt
          merges a load on account_id, campaign_id and date.
