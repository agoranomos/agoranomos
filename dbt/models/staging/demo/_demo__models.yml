models:
  - name: stg_demo__ad_stats_daily
    description: >
      The demo statistics, one row per campaign and day. Its tests guard the marts layer: when one of
      them fails, dbt does not rebuild the models that read this one.
    data_tests:
      - unique_combination:
          arguments:
            columns: [report_date, account_id, campaign_id]
    columns:
      - name: report_date
        description: The day of the statistics, in the time zone of the ad account (UTC in the demo).
        data_tests: [not_null]
      - name: account_id
        description: The ad account.
        data_tests: [not_null]
      - name: campaign_id
        description: The campaign, unique within its account.
        data_tests: [not_null]
      - name: campaign_name
        description: The name of the campaign.
        data_tests: [not_null]
      - name: currency
        description: The currency of the account, as an ISO 4217 code.
        data_tests:
          - accepted_values:
              arguments:
                values: ["USD"]
      - name: impressions
        description: How many times the ads were shown.
        data_tests: [not_null, non_negative]
      - name: clicks
        description: How many times the ads were clicked.
        data_tests: [not_null, non_negative]
      - name: spend
        description: The spend, in the currency of the account.
        data_tests: [not_null, non_negative]
      - name: conversions
        description: The conversions that the ad platform attributes to the campaign; they can be fractional.
        data_tests: [not_null, non_negative]
