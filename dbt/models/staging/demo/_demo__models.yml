models:
  - name: stg_demo__ad_stats_daily
    description: >-
      The demo statistics of ads from raw_demo, one row for each campaign and day, with the column
      names of the marts layer. Its tests guard the marts layer: when one of them fails, dbt does
      not rebuild the models that read this one.
    data_tests:
      - unique_combination:
          arguments:
            columns: [report_date, account_id, campaign_id]
    columns:
      - name: report_date
        description: '{{ doc("report_date") }}'
        data_tests: [not_null]
      - name: account_id
        description: '{{ doc("account_id") }}'
        data_tests: [not_null]
      - name: campaign_id
        description: '{{ doc("campaign_id") }}'
        data_tests: [not_null]
      - name: campaign_name
        description: '{{ doc("campaign_name") }}'
        data_tests: [not_null]
      - name: currency
        description: '{{ doc("currency") }}'
        data_tests:
          - accepted_values:
              arguments:
                values: ["USD"]
      - name: impressions
        description: '{{ doc("impressions") }}'
        data_tests: [not_null, non_negative]
      - name: clicks
        description: '{{ doc("clicks") }}'
        data_tests: [not_null, non_negative]
      - name: spend
        description: '{{ doc("spend") }}'
        data_tests: [not_null, non_negative]
      - name: conversions
        description: '{{ doc("conversions") }}'
        data_tests: [not_null, non_negative]
