models:
  - name: stg_demo_web__properties
    description: >-
      The properties of web analytics of demo_web, one row each, from the newest load of the
      property that a run pinned, with the time zone of their days and the currency of their
      revenue. platform and property_id are its key. int_g1_failures checks each account for its
      key, its currency and its time zone, and holds one that fails out of the core and the marts
      (ADR-0035). Its tests guard the marts: when one of them fails, dbt does not rebuild the models
      that read this one.
    columns:
      - name: platform
        description: '{{ doc("platform") }}'
        data_tests: [not_null]
      - name: property_id
        description: '{{ doc("property_id") }}'
        data_tests: [not_null]
      - name: property_name
        description: '{{ doc("property_name") }}'
      - name: time_zone
        description: '{{ doc("time_zone") }}'
      - name: currency
        description: '{{ doc("currency") }}'
  - name: stg_demo_web__sessions_daily
    description: >-
      The sessions of the properties of demo_web, one row for each property, day in the time zone of
      the property, source, medium, campaign and default channel group of the sessions, as GA4
      gives them; on some days the sessions of a campaign of demo_search are split between two
      groups. report_date, property_id, session_source, session_medium, session_campaign_name,
      session_campaign_id and session_default_channel_group are its key (ADR-0057), and a row
      without a group takes (not set). int_g1_failures checks its rows for
      each account, and holds an account whose rows fail out of the core and the marts (ADR-0035).
      Its tests guard the marts: when one of them fails, dbt does not rebuild the models that read
      this one.
    columns:
      - name: report_date
        description: '{{ doc("report_date") }}'
        data_tests: [not_null]
      - name: platform
        description: '{{ doc("platform") }}'
      - name: property_id
        description: '{{ doc("property_id") }}'
        data_tests: [not_null]
      - name: session_source
        description: '{{ doc("session_source") }}'
      - name: session_medium
        description: '{{ doc("session_medium") }}'
      - name: session_campaign_name
        description: '{{ doc("session_campaign_name") }}'
      - name: session_campaign_id
        description: '{{ doc("session_campaign_id") }}'
      - name: session_default_channel_group
        description: '{{ doc("session_default_channel_group") }}'
      - name: sessions
        description: '{{ doc("sessions") }}'
      - name: engaged_sessions
        description: '{{ doc("engaged_sessions") }}'
      - name: key_events
        description: '{{ doc("key_events") }}'
      - name: total_revenue
        description: '{{ doc("total_revenue") }}'
