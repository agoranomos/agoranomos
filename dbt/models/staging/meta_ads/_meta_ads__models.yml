  - name: stg_meta_ads__account_totals
    description: >-
      The totals of the Meta ad accounts of the deployment by day, one row for each account and day
      with a metric, from the insights at the level of the account, which Meta sums over every
      campaign, ad set and ad of the account, active, archived or deleted: the side of the platform
      of G0a (ADR-0035, ADR-0050), with the load of each row; clicks are the link clicks. It is
      empty until the first load. report_date, platform and account_id are its key.
      int_g1_failures compares the statistics of the campaigns of each account and day with them,
      and holds an account whose campaigns do not add up to them, within the share of
      platform_totals_tolerance, out of the core and the marts, and core.platform_totals_daily
      keeps them. Its tests guard the marts: when one of them fails, dbt does not rebuild the models
      that read this one.
    columns:
      - name: report_date
        description: '{{ doc("report_date") }}'
        data_tests: [not_null]
      - name: platform
        description: '{{ doc("platform") }}'
        data_tests: [not_null]
      - name: account_id
        description: '{{ doc("account_id") }}'
        data_tests: [not_null]
      - name: total_impressions
        description: >-
          How many times the ads of the account were shown on the day, as Meta totals them for the
          account, over all its campaigns.
      - name: total_clicks
        description: >-
          How many times the links of the ads of the account were clicked on the day, as Meta
          totals them for the account, over all its campaigns.
      - name: total_spend
        description: >-
          What the ads of the account cost on the day, as Meta estimates it for the account over all
          its campaigns, in the currency of the account, to six decimal places.
      - name: load_id
        description: '{{ doc("load_id") }}'
