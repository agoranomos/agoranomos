models:
  - name: int_clients__resolved
    description: >-
      The clients of the business, one row each: those that the settings of the deployment and the
      file of the demo name, the deployment's where both name one ID, and the default client
      Unassigned, which holds the accounts that no setting names. client_id is its key. It reads
      stg_settings__clients. Its tests guard the marts: when one of them fails, dbt does not
      rebuild the models that read this one.
    columns:
      - name: client_id
        description: '{{ doc("client_id") }}'
        data_tests:
          - not_null:
              config: {tags: [critical]}
          - unique:
              config: {tags: [critical]}
      - name: client_name
        description: '{{ doc("client_name") }}'
        data_tests:
          - not_null:
              config: {tags: [critical]}
      - name: origin
        description: '{{ doc("origin") }}'
      - name: is_default
        description: '{{ doc("is_default") }}'
  - name: int_conversion_actions__resolved
    description: >-
      The conversion actions of the data, of the Google Ads accounts and of the seed of conversion
      actions, one row for each platform and action: the name of the seed, else the one that the
      account gives, else that of the data; the category of the settings of the deployment, else of
      the seed, else the one that the category of the platform maps to, else other; and whether it
      is primary, as the settings of the deployment say, else, for Google Ads, the flag
      include_in_conversions_metric of the newest version of the action in the accounts, with which
      Google counts it in its metric of conversions, else the seed, else not; and, for the registry
      of conversion actions of the core, the status, the category and that flag of the newest
      version of the action in the accounts of Google Ads, where they list it. platform and
      conversion_action_id are its key. It reads the staging models of the conversions of each
      platform, stg_google_ads__conversion_actions, seed_conversion_actions and
      stg_settings__conversion_actions. Its tests guard the marts: when one of them fails, dbt does
      not rebuild the models that read this one.
    data_tests:
      - unique_combination:
          arguments:
            columns: [platform, conversion_action_id]
          config: {tags: [critical]}
    columns:
      - name: platform
        description: '{{ doc("platform") }}'
      - name: conversion_action_id
        description: '{{ doc("conversion_action_id") }}'
      - name: conversion_action_name
        description: '{{ doc("conversion_action_name") }}'
      - name: conversion_category
        description: '{{ doc("conversion_category") }}'
        data_tests:
          - accepted_values:
              arguments:
                values: ["purchase", "lead", "sign_up", "add_to_cart", "app_install", "other"]
              config: {tags: [critical]}
      - name: is_primary
        description: '{{ doc("is_primary") }}'
        data_tests:
          - not_null:
              config: {tags: [critical]}
      - name: conversion_action_status
        description: '{{ doc("conversion_action_status") }}'
      - name: platform_category
        description: '{{ doc("platform_category") }}'
      - name: include_in_conversions_metric
        description: '{{ doc("include_in_conversions_metric") }}'
  - name: int_accounts__current
    description: >-
      The accounts of the ad platforms and the properties of web analytics whose data this run of
      the transform takes into the core, one row each: those that the lists of accounts and of
      properties give, with their attributes, and those that only the statistics of campaigns or the
      sessions name, as stubs; with the first and the last day of the statistics of campaigns that
      this run reads; but for the accounts that int_g1_failures holds in quarantine in this run,
      once core.account_quarantine has recorded them. The checks hold an account that no list gives
      out as unknown_account, so no stub enters from here. platform and account_id are its key. The
      registry core.dim_account takes its rows from it, and int_campaigns__current,
      int_ad_groups__current and int_ads__current take their accounts from it. It reads the staging
      models of the accounts, the properties, the statistics of campaigns and the sessions of each
      platform. Its tests guard the core: when one of them fails, dbt does not build the models that
      read this one.
    data_tests:
      - unique_combination:
          arguments:
            columns: [platform, account_id]
          config: {tags: [critical]}
    columns:
      - name: platform
        description: '{{ doc("platform") }}'
      - name: account_id
        description: '{{ doc("account_id") }}'
      - name: account_name
        description: '{{ doc("account_name") }}'
      - name: currency
        description: '{{ doc("currency") }}'
      - name: time_zone
        description: '{{ doc("time_zone") }}'
      - name: manager_account_id
        description: '{{ doc("manager_account_id") }}'
      - name: account_status
        description: '{{ doc("account_status") }}'
      - name: is_stub
        description: '{{ doc("is_stub") }}'
      - name: first_report_date
        description: '{{ doc("first_report_date") }}'
      - name: last_report_date
        description: '{{ doc("last_report_date") }}'
  - name: int_campaigns__current
    description: >-
      The campaigns whose data this run of the transform takes into the core, one row each, with
      their current attributes: the newest version of each campaign that a list of its account
      gave, whether the newest list still names it or not, and each campaign that only the
      statistics of campaigns name, as a stub, with the name of its newest row of statistics; with
      the surrogate of its account, the common state of its status, whether the newest list names
      it, when a list last named it, and the first and the last day of the statistics that this run
      reads. platform, account_id and campaign_id are its key. The snapshot dim_campaign_versions
      and the dimension core.dim_campaign read it. It reads the staging models of the campaigns and
      of their statistics of each platform, int_accounts__current, core.dim_account and core.loads.
      Its tests guard the core: when one of them fails, dbt does not build the models that read
      this one.
    data_tests:
      - unique_combination:
          arguments:
            columns: [platform, account_id, campaign_id]
          config: {tags: [critical]}
    columns:
      - name: platform
        description: '{{ doc("platform") }}'
      - name: account_id
        description: '{{ doc("account_id") }}'
      - name: account_sk
        description: '{{ doc("account_sk") }}'
      - name: campaign_id
        description: '{{ doc("campaign_id") }}'
      - name: current_name
        description: '{{ doc("current_name") }}'
      - name: campaign_status
        description: '{{ doc("campaign_status") }}'
      - name: campaign_state
        description: '{{ doc("campaign_state") }}'
      - name: campaign_type
        description: '{{ doc("campaign_type") }}'
      - name: is_listed
        description: '{{ doc("is_listed") }}'
      - name: last_seen_at
        description: '{{ doc("last_seen_at") }}'
      - name: first_report_date
        description: '{{ doc("first_report_date") }}'
      - name: last_report_date
        description: '{{ doc("last_report_date") }}'
  - name: int_ad_groups__current
    description: >-
      The ad groups whose data this run of the transform takes into the core, ad sets of Meta among
      them, one row each, with their campaign and their current attributes: the newest version of
      each ad group that a list of its account gave, whether the newest list still names it or not,
      and each ad group that only the statistics of ad groups name, as a stub, with the name and the
      campaign of its newest row of statistics; with the surrogate of its account, the common state
      of its status, whether the newest list names it, when a list last named it, and the first and
      the last day of the statistics that this run reads. platform, account_id and ad_group_id are
      its key. The snapshot dim_ad_group_versions and the dimension core.dim_ad_group read it. It
      reads the staging models of the ad groups and of their statistics of each platform,
      int_accounts__current, core.dim_account and core.loads. Its tests guard the core: when one of
      them fails, dbt does not build the models that read this one.
    data_tests:
      - unique_combination:
          arguments:
            columns: [platform, account_id, ad_group_id]
          config: {tags: [critical]}
    columns:
      - name: platform
        description: '{{ doc("platform") }}'
      - name: account_id
        description: '{{ doc("account_id") }}'
      - name: account_sk
        description: '{{ doc("account_sk") }}'
      - name: ad_group_id
        description: '{{ doc("ad_group_id") }}'
      - name: campaign_id
        description: '{{ doc("campaign_id") }}'
        data_tests:
          - not_null:
              config: {tags: [critical]}
      - name: current_name
        description: '{{ doc("current_name") }}'
      - name: ad_group_status
        description: '{{ doc("ad_group_status") }}'
      - name: ad_group_state
        description: '{{ doc("ad_group_state") }}'
      - name: ad_group_type
        description: '{{ doc("ad_group_type") }}'
      - name: is_listed
        description: '{{ doc("is_listed") }}'
      - name: last_seen_at
        description: '{{ doc("last_seen_at") }}'
      - name: first_report_date
        description: '{{ doc("first_report_date") }}'
      - name: last_report_date
        description: '{{ doc("last_report_date") }}'
  - name: int_ads__current
    description: >-
      The ads whose data this run of the transform takes into the core, one row each, with their
      campaign, their ad group and their current attributes: the newest version of each ad that a
      list of its account gave, whether the newest list still names it or not, and each ad that
      only the statistics of ads name, as a stub, with the name and the campaign of its newest row
      of statistics; with the surrogate of its account, the common state of its status, whether the
      newest list names it, when a list last named it, and the first and the last day of the
      statistics that this run reads. platform, account_id, ad_group_id and ad_id are its key, as an
      ad is defined only inside its ad group. The snapshot dim_ad_versions and the dimension
      core.dim_ad read it. It reads the staging models of the ads and of their statistics of each
      platform, int_accounts__current, core.dim_account and core.loads. Its tests guard the core:
      when one of them fails, dbt does not build the models that read this one.
    data_tests:
      - unique_combination:
          arguments:
            columns: [platform, account_id, ad_group_id, ad_id]
          config: {tags: [critical]}
    columns:
      - name: platform
        description: '{{ doc("platform") }}'
      - name: account_id
        description: '{{ doc("account_id") }}'
      - name: account_sk
        description: '{{ doc("account_sk") }}'
      - name: ad_group_id
        description: '{{ doc("ad_group_id") }}'
      - name: ad_id
        description: '{{ doc("ad_id") }}'
      - name: campaign_id
        description: '{{ doc("campaign_id") }}'
        data_tests:
          - not_null:
              config: {tags: [critical]}
      - name: current_name
        description: '{{ doc("current_name") }}'
      - name: ad_status
        description: '{{ doc("ad_status") }}'
      - name: ad_state
        description: '{{ doc("ad_state") }}'
      - name: ad_type
        description: '{{ doc("ad_type") }}'
      - name: is_listed
        description: '{{ doc("is_listed") }}'
      - name: last_seen_at
        description: '{{ doc("last_seen_at") }}'
      - name: first_report_date
        description: '{{ doc("first_report_date") }}'
      - name: last_report_date
        description: '{{ doc("last_report_date") }}'
  - name: int_g1_failures
    description: >-
      The checks of G0a, G1 and G1a (ADR-0035) on the data that this run of the transform reads,
      before it writes the core: one row for each load, account, reason and kind of data that
      failed. An account with a row here is in quarantine for this run: int_accounts__current, and
      so every dimension of the core, and the intermediate models of the marts leave it out, and
      core.account_quarantine records it. G1 checks each kind of facts of staging for keys that two
      rows share or that miss a part, and for measures that are missing or below zero; the lists of
      accounts and properties for an account listed twice, a currency outside ISO 4217 and a time
      zone outside IANA; the journal of the loads for an account whose newest pinned load failed,
      and for an account that the loads name and no list gives; the rates for an account whose
      currency has no rate into the reporting currency, neither in the loads of the rates that this
      run reads nor in core.fx_rates_daily; and the fact tables of raw for rows outside the window
      of their load and a spend with more than six decimal places. G0a compares the impressions,
      clicks and spend of the campaigns of each account and day with the totals that its platform
      gives for the account in the same load, where its loads bring them, as those of Google Ads
      do, within the share of var('platform_totals_tolerance'). G1a compares
      the spend of the campaigns of each load, and the sessions of each load of web analytics, with
      what the core holds on the same days. A source with more than half of its pinned accounts
      here stops, and its other pinned accounts get the reason source_stopped. A table that each
      run fills anew, one statement for each kind of data.
      source, load_id, account_id, reason and checked are its key. Its tests guard the core and the
      marts: when one of them fails, dbt does not build the models that read this one.
    data_tests:
      - unique_combination:
          arguments:
            columns: [source, load_id, account_id, reason, checked]
          config: {tags: [critical]}
    columns:
      - name: source
        description: '{{ doc("source") }}'
        data_tests:
          - not_null:
              config: {tags: [critical]}
      - name: load_id
        description: '{{ doc("load_id") }}'
      - name: account_id
        description: '{{ doc("account_id") }}'
        data_tests:
          - not_null:
              config: {tags: [critical]}
      - name: reason
        description: '{{ doc("reason") }}'
        data_tests:
          - not_null:
              config: {tags: [critical]}
          - accepted_values:
              arguments:
                values: ["load_failed", "unknown_account", "duplicate_key", "missing_key", "unknown_currency", "unknown_time_zone", "missing_rate", "too_many_decimals", "missing_measure", "negative_measure", "date_outside_window", "totals_differ", "empty_window", "spend_fall", "source_stopped"]
              config: {tags: [critical]}
      - name: checked
        description: '{{ doc("checked") }}'
        data_tests:
          - not_null:
              config: {tags: [critical]}
      - name: detail
        description: '{{ doc("detail") }}'
      - name: window_from
        description: '{{ doc("window_from") }}'
      - name: window_to
        description: '{{ doc("window_to") }}'
  - name: int_window_days
    description: >-
      The days of the windows that this run of the transform writes into the facts of the core
      (ADR-0038): one row for each account of the ad platforms or property of web analytics and
      each day of the loads that the run pinned, with the newest load that covers the day, the
      surrogate and the currency of the account, and the surrogate and the ID of the load. A model of
      a fact replaces each day whole: the rows of its load go in, and a day on which the load holds no row
      is emptied. An account that the checks of this run hold, in int_g1_failures, has no row here,
      so that every fact keeps its days. A table that each run fills anew. account_sk and
      report_date are its key. Its tests guard the core: when one of them fails, dbt does not build
      the facts.
    data_tests:
      - unique_combination:
          arguments:
            columns: [account_sk, report_date]
          config: {tags: [critical]}
    columns:
      - name: source
        description: '{{ doc("source") }}'
      - name: account_id
        description: '{{ doc("account_id") }}'
      - name: account_sk
        description: '{{ doc("account_sk") }}'
      - name: currency
        description: '{{ doc("currency") }}'
      - name: report_date
        description: '{{ doc("report_date") }}'
      - name: load_sk
        description: '{{ doc("load_sk") }}'
      - name: load_id
        description: '{{ doc("load_id") }}'
      - name: day_key
        description: '{{ doc("day_key") }}'
