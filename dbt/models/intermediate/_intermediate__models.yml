  - name: int_g1_failures
    description: >-
      The checks of G1 and G1a (ADR-0035) on the data that this run of the transform reads, before
      it writes the core: one row for each load, account, reason and kind of data that failed. An
      account with a row here is in quarantine for this run: int_accounts__current, and so every
      dimension of the core, and the intermediate models of the marts leave it out, and
      core.account_quarantine records it. G1 checks each kind of facts of staging for keys that two
      rows share or that miss a part, and for measures that are missing or below zero; the lists of
      accounts and properties for an account listed twice, a currency outside ISO 4217 and a time
      zone outside IANA; the journal of the loads for an account whose newest pinned load failed,
      and for an account that the loads name and no list gives; and the fact tables of raw for rows
      outside the window of their load and a spend with more than six decimal places. G1a compares
      the spend of the campaigns of each load with what the core holds on the same days. A source
      with more than half of its pinned accounts here stops, and its other pinned accounts get the
      reason source_stopped. A table that each run fills anew, one statement for each kind of data.
      source, load_id, account_id, reason and checked are its key. Its tests guard the core and the
      marts: when one of them fails, dbt does not build the models that read this one.
    data_tests:
      - unique_combination:
          arguments:
            columns: [source, load_id, account_id, reason, checked]
          config: {tags: [critical]}
    columns:
      - name: source
        description: '{{ doc("source") }}'
        data_tests:
          - not_null:
              config: {tags: [critical]}
      - name: load_id
        description: '{{ doc("load_id") }}'
      - name: account_id
        description: '{{ doc("account_id") }}'
        data_tests:
          - not_null:
              config: {tags: [critical]}
      - name: reason
        description: '{{ doc("reason") }}'
        data_tests:
          - not_null:
              config: {tags: [critical]}
          - accepted_values:
              arguments:
                values: ["load_failed", "unknown_account", "duplicate_key", "missing_key", "unknown_currency", "unknown_time_zone", "too_many_decimals", "missing_measure", "negative_measure", "date_outside_window", "empty_window", "spend_fall", "source_stopped"]
              config: {tags: [critical]}
      - name: checked
        description: '{{ doc("checked") }}'
        data_tests:
          - not_null:
              config: {tags: [critical]}
      - name: detail
        description: '{{ doc("detail") }}'
      - name: window_from
        description: '{{ doc("window_from") }}'
      - name: window_to
        description: '{{ doc("window_to") }}'
