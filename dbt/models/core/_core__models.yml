          The load that wrote the row, load_sk of core.loads.
  - name: core_ad_stats_ad_daily
    description: >-
      Advertising statistics by day and ad of every ad platform: one row for an ad of an account on
      a day, in the time zone of the account, as the platform reports its ad level, with the amounts
      in the currency of the account. account_sk, ad_group_id, ad_id and report_date are its key, as
      an ad is defined only inside its ad group. Partitioned by month of report_date; a month that
      ended before the window of restatements is frozen (the trigger
      freeze_the_months_before_the_window).
    data_tests:
      - few_without_a_dimension:
          arguments:
            columns: [account_sk, ad_group_id, ad_id]
            to: ref('dim_ad')
            to_columns: [account_sk, ad_group_id, ad_id]
          config:
            where: >-
              report_date >= (select min(window_from) from core.loads where status = 'pinned'
              and outcome = 'loaded')
            tags: [critical]
    columns:
      - name: account_sk
        description: >-
          The account of the row, account_sk of core.dim_account, which gives its platform, ID,
          client, currency and time zone.
      - name: campaign_id
        description: >-
          The campaign of the ad, as the ad platform gives its ID, a number.
      - name: ad_group_id
        description: >-
          The ad group of the ad, as the ad platform gives its ID, a number.
      - name: ad_id
        description: >-
          The ID of the ad as the ad platform gives it, a number, unique inside its ad group;
          core.dim_ad holds its attributes.
      - name: report_date
        description: >-
          The day that the row covers, in the time zone of its account; not the day that the data
          was loaded. Its month is the partition of the row.
      - name: impressions
        description: >-
          How many times the ad was shown on the day, as the ad platform counts it: showings, not
          people.
      - name: clicks
        description: >-
          How many times the ad was clicked on the day with a click that leads to the site, as the
          ad platform counts them: the clicks of Google, the clicks (destination) of TikTok, the
          link clicks of Meta.
      - name: spend
        description: >-
          What the ad cost on the day, as the ad platform reports it in its statistics, in the
          currency of the row, exact to six decimal places; not the amount that the platform
          invoices.
      - name: conversions
        description: >-
          The conversions of the ad on the day in the own metric of conversions of the ad platform,
          such as metrics.conversions of Google, fractional where attribution shares a conversion;
          none where the platform has no such metric.
      - name: all_conversions
        description: >-
          All the conversions of the ad on the day, those of the actions that the own metric of the
          platform leaves out among them, such as metrics.all_conversions of Google; none where the
          platform has no such metric.
      - name: conversion_value
        description: >-
          The value of the conversions of the column conversions, in the currency of the row; none
          where the platform gives none.
      - name: all_conversion_value
        description: >-
          The value of the conversions of the column all_conversions, in the currency of the row;
          none where the platform gives none.
      - name: currency
        description: >-
          The currency of the amounts of the row, that of its account, as a three-letter code of ISO
          4217.
        data_tests:
          - relationships:
              arguments:
                to: ref('seed_iso_4217_currencies')
                field: currency_code
              config:
                where: >-
                  report_date >= (select min(window_from) from core.loads where status = 'pinned'
                  and outcome = 'loaded')
                tags: [critical]
      - name: load_sk
        description: >-
          The load that wrote the row, load_sk of core.loads.
  - name: core_ad_conversions_campaign_daily
    description: >-
      Conversions by day, campaign and conversion action of every ad platform: one row for a
      conversion action of a campaign of an account on a day, in the time zone of the account, with
      the value in the currency of the account. account_sk, campaign_id, conversion_action_sk and
      report_date are its key. Partitioned by month of report_date; a month that ended before the
      window of restatements is frozen (the trigger freeze_the_months_before_the_window).
    data_tests:
