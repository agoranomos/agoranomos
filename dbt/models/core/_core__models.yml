              and outcome = 'loaded')
            tags: [critical]
    columns:
      - name: account_sk
        description: >-
          The account of the row, account_sk of core.dim_account, which gives its platform, ID,
          client, currency and time zone.
      - name: campaign_id
        description: >-
          The ID of the campaign as the ad platform gives it, a number, unique inside its account;
          core.dim_campaign holds its attributes.
      - name: conversion_action_sk
        description: >-
          The conversion action of the row, conversion_action_sk of core.dim_conversion_action,
          which gives its ID, name, category and whether it is primary.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_conversion_action')
