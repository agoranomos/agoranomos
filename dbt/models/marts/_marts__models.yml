  - name: ad_stats_ad_group_daily
    description: >-
      Advertising statistics by day and ad group on every platform. One row is one ad group of one
      ad account on one day, in the time zone of the account: report_date, platform, account_id and
      ad_group_id together are its key. Money is in the currency of the account (currency) and in
      the reporting currency (reporting_currency); add up money across accounts with the columns
      that end in _reporting. Conversions are those of the primary conversion actions only;
      ad_conversions_campaign_daily has the conversions by action, at the grain of campaigns. A
      Performance Max campaign of Google has no ad groups, so the ad groups of an account can add up
      to less than its campaigns in ad_stats_campaign_daily; elsewhere they add up to them.
    config:
      # The table that dbt builds has exactly these columns, with these types, or the build fails.
      contract:
        enforced: true
      meta:
        metabase:
          display_name: Ad Statistics by Ad Group and Day
          # The KPIs of the mart of campaigns, at the level of ad groups.
          metric_level: Ad Groups
          metric_scope: >-
            Over the statistics of the ad groups, which leave out Performance Max campaigns, as
            they have no ad groups.
          metrics: *kpis
