models:
  - name: ad_stats_campaign_daily
    description: >-
      Advertising statistics by day and campaign on every platform, a view over
      core.ad_stats_campaign_daily. One row is one campaign of one ad account on one day, in the
      time zone of the account: report_date, platform, account_id and campaign_id together are its
      key. The names, statuses and states are the current ones of the campaign and its account.
      Money is in the currency of the account (currency) and in the reporting currency
      (reporting_currency), at the rate of the day of the row (fx_rate_into_reporting_currency); add
      up money across accounts with the columns that end in _reporting. conversions is the own
      metric of conversions of the platform, as its account shows it, and none on Meta, which has no
      such metric; conversions_primary is the sum of the conversions of the primary conversion
      actions of the deployment, which ad_conversions_campaign_daily has by action. A row whose
      measures are all zero is not kept. Its platforms are those of ad_platforms with the kind ads.
      Its tests read the days of the windows that the run of the transform pinned.
    config:
      # The table that dbt builds has exactly these columns, with these types, or the build fails.
      contract:
        enforced: true
      meta:
        metabase:
          display_name: Ad Statistics by Campaign and Day
          # The KPIs of the mart, which metabase-init keeps as metrics of Metabase in agoranomos /
          # Metrics, named <KPI> (<metric_level>), such as CTR (Campaigns), and described by
          # metric_scope and then the description of the KPI, and as terms of its glossary, one
          # for each KPI (ADR-0034, docs/reference/describe-the-marts.md#metrics). Each is the sum
          # of numerator over the sum of denominator, times scale, over the rows that a question
          # selects. The marts of ad groups and ads take the first six, each by its anchor; the
          # two of the primary conversion actions are of this level alone, as conversions_primary
          # is none at the levels of ad groups and ads (ADR-0037).
          metric_level: Campaigns
          metric_scope: >-
            Over the statistics of every campaign, Performance Max included: the total of the
            accounts.
          metrics:
            - &ctr
              name: CTR
              description: >-
                Click-through rate: the share of the impressions that led to a click to the site,
                the sum of clicks divided by the sum of impressions over the same rows, not an
                average of the rates of the rows.
              numerator: clicks
              denominator: impressions
              format: percent
            - &cpc
              name: CPC
              description: >-
                Cost per click: the spend for each click to the site, the sum of spend_reporting
                divided by the sum of clicks, in the reporting currency.
              numerator: spend_reporting
              denominator: clicks
              format: currency
              currency: "{{ env_var('AGORANOMOS_REPORTING_CURRENCY', 'USD') }}"
            - &cpm
              name: CPM
              description: >-
                Cost per mille: the spend for a thousand impressions, the sum of spend_reporting
                divided by the sum of impressions, times 1,000, in the reporting currency.
              numerator: spend_reporting
              denominator: impressions
              scale: 1000
              format: currency
              currency: "{{ env_var('AGORANOMOS_REPORTING_CURRENCY', 'USD') }}"
            - &cost_per_conversion
              name: Cost per Conversion
              description: >-
                Cost per conversion, also called cost per acquisition (CPA): the spend for each
                conversion in the own metric of conversions of the platform, as its account shows
                it, the sum of spend_reporting divided by the sum of conversions, in the reporting
                currency; none on Meta, which has no such metric.
              numerator: spend_reporting
              denominator: conversions
              format: currency
              currency: "{{ env_var('AGORANOMOS_REPORTING_CURRENCY', 'USD') }}"
            - &conversion_rate
              name: Conversion Rate
              description: >-
                The conversions in the own metric of conversions of the platform for each click to
                the site, the sum of conversions divided by the sum of clicks. A platform can count
                more than one conversion for a click, and conversions after a view, so it can
                exceed 100%.
              numerator: conversions
              denominator: clicks
              format: percent
            - &roas
              name: ROAS
              description: >-
                Return on ad spend: the value of the conversions in the own metric of conversions
                of the platform for each unit of spend, the sum of conversion_value_reporting
                divided by the sum of spend_reporting, both in the reporting currency; 4.2 means
                4.20 of value for each 1.00 spent.
              numerator: conversion_value_reporting
              denominator: spend_reporting
              format: number
            - name: Cost per Primary Conversion
              description: >-
                The spend for each conversion of the primary conversion actions of the deployment,
                the sum of spend_reporting divided by the sum of conversions_primary, in the
                reporting currency. The primary actions are the choice of the deployment, so this
                can differ from the cost per conversion that the account shows; it has a value on
                every platform, Meta included.
              numerator: spend_reporting
              denominator: conversions_primary
              format: currency
              currency: "{{ env_var('AGORANOMOS_REPORTING_CURRENCY', 'USD') }}"
            - name: Primary Conversion Rate
              description: >-
                The conversions of the primary conversion actions of the deployment for each click
                to the site, the sum of conversions_primary divided by the sum of clicks. A
                platform can count more than one conversion for a click, and conversions after a
                view, so it can exceed 100%.
              numerator: conversions_primary
              denominator: clicks
              format: percent
    data_tests:
      - unique_combination:
          arguments:
            columns: [report_date, platform, account_id, campaign_id]
          config:
            where: >-
              report_date >= (select min(window_from) from core.loads where status = 'pinned'
              and outcome = 'loaded')
    columns:
      - name: report_date
        data_type: date
        description: '{{ doc("report_date") }}'
        data_tests:
          - not_null:
              config:
                where: >-
                  report_date >= (select min(window_from) from core.loads where status = 'pinned'
                  and outcome = 'loaded')
        config:
          meta:
            metabase:
              display_name: Report Date
              semantic_type: null
              has_field_values: none
      - name: platform
        data_type: text
        description: '{{ doc("platform") }}'
        data_tests:
          - not_null:
              config:
                where: >-
                  report_date >= (select min(window_from) from core.loads where status = 'pinned'
                  and outcome = 'loaded')
        config:
          meta:
