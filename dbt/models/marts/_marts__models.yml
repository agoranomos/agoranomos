      property on one day, in the time zone of the property: report_date, property_id,
      session_source, session_medium, session_campaign_name and session_campaign_id together are its
      key. A session whose links carried the ID of exactly one ad campaign of the core in utm_id
      names its platform and account (ad_platform, ad_account_id). Revenue is in the currency of the
      property (currency) and in the reporting currency (reporting_currency), at the rate of the day
      of the row; add up revenue across properties with total_revenue_reporting. Its platforms are
      those of ad_platforms with the kind web_analytics. Its tests read the days of the windows that
      the run of the transform pinned.
