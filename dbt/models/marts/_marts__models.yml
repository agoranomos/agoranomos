      The platforms of the model, one row each: the ad platforms, the web analytics and the
      sources of exchange rates whose data the marts hold, with the kind of data that each gives.
      platform is its key; the marts that name a platform take its name from here. Today it lists
      the fictional platforms of the demo; the platforms of the connectors are planned.
    config:
      contract:
        enforced: true
      meta:
        metabase:
          display_name: Ad Platforms
    constraints:
      - type: primary_key
        columns: [platform]
    data_tests:
      - unique_combination:
          arguments:
            columns: [platform]
    columns:
      - name: platform
        data_type: text
        description: '{{ doc("platform") }}'
        config: {meta: {metabase: {display_name: Platform Code, semantic_type: type/Category}}}
      - name: platform_name
        data_type: text
        description: '{{ doc("platform_name") }}'
        config: {meta: {metabase: {display_name: Platform, semantic_type: type/Name}}}
      - name: kind
        data_type: text
        description: '{{ doc("kind") }}'
        config: {meta: {metabase: {display_name: Kind, semantic_type: type/Category}}}
      - name: mimics
        data_type: text
        description: '{{ doc("mimics") }}'
        config: {meta: {metabase: {display_name: Mimics, semantic_type: type/Category}}}
      - name: is_demo
        data_type: boolean
        description: '{{ doc("is_demo") }}'
        config: {meta: {metabase: {display_name: Is Demo, semantic_type: type/Category}}}
  - name: ad_accounts
    description: >-
      The ad accounts of every ad platform, one row each, with their client, currency and time
      zone, and the first and last days that their statistics in ad_stats_campaign_daily cover.
      platform and account_id together are its key. The client of an account is the one that the
      settings of the deployment name for it, else the one of the demo, else Unassigned. Today it
      holds the accounts of the demo; the sources of real ad platforms are planned.
    config:
      contract:
