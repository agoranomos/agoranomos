        description: '{{ doc("platform") }}'
        config:
          meta:
            metabase:
              display_name: Platform Code
              semantic_type: type/FK
              has_field_values: list
              fk_target_table: marts.ad_platforms
              fk_target_field: platform
      - name: platform_name
