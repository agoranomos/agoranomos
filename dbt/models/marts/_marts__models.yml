models:
  - name: ad_stats_campaign_daily
    description: >-
      Advertising statistics by day and campaign on every platform. One row is one campaign of
      one ad account on one day, in the time zone of the account: report_date, platform,
      account_id and campaign_id together are its key. Money is in the currency of the account
      (currency) and in the reporting currency (reporting_currency); add up money across accounts
      with the columns that end in _reporting. Conversions are those of the primary conversion
      actions; ad_conversions_campaign_daily has them by action. Today it holds the fictional
      platforms of the demo; the sources of real ad platforms are planned.
    config:
      # The table that dbt builds has exactly these columns, with these types, or the build fails.
      contract:
        enforced: true
      meta:
        metabase:
          display_name: Ad Statistics by Campaign and Day
          # The KPIs of the mart, which metabase-init keeps as metrics of Metabase in Agoranomos /
          # Metrics, named <KPI> (<metric_level>), such as CTR (Campaigns), and described by
          # metric_scope and then the description of the KPI, and as terms of its glossary, one
          # for each KPI (ADR-0034, docs/reference/describe-the-marts.md#metrics). Each is the sum
          # of numerator over the sum of denominator, times scale, over the rows that a question
          # selects. The marts of ad groups and ads take the same KPIs (*kpis).
          metric_level: Campaigns
          metric_scope: >-
            Over the statistics of every campaign, Performance Max included: the total of the
            accounts.
          metrics: &kpis
            - name: CTR
              description: >-
                Click-through rate: the share of the impressions that led to a click to the site,
                the sum of clicks divided by the sum of impressions over the same rows, not an
                average of the rates of the rows.
              numerator: clicks
              denominator: impressions
              format: percent
            - name: CPC
              description: >-
                Cost per click: the spend for each click to the site, the sum of spend_reporting
                divided by the sum of clicks, in the reporting currency.
              numerator: spend_reporting
              denominator: clicks
              format: currency
              currency: "{{ env_var('AGORANOMOS_REPORTING_CURRENCY', 'USD') }}"
            - name: CPM
              description: >-
                Cost per mille: the spend for a thousand impressions, the sum of spend_reporting
                divided by the sum of impressions, times 1,000, in the reporting currency.
              numerator: spend_reporting
              denominator: impressions
              scale: 1000
              format: currency
              currency: "{{ env_var('AGORANOMOS_REPORTING_CURRENCY', 'USD') }}"
            - name: Cost per Conversion
              description: >-
                Cost per conversion, also called cost per acquisition (CPA): the spend for each
                conversion of the primary conversion actions, the sum of spend_reporting divided by
                the sum of conversions, in the reporting currency.
              numerator: spend_reporting
              denominator: conversions
              format: currency
              currency: "{{ env_var('AGORANOMOS_REPORTING_CURRENCY', 'USD') }}"
            - name: Conversion Rate
              description: >-
                The conversions of the primary conversion actions for each click to the site, the
                sum of conversions divided by the sum of clicks. A platform can count more than one
                conversion for a click, and conversions after a view, so it can exceed 100%.
              numerator: conversions
              denominator: clicks
              format: percent
            - name: ROAS
              description: >-
                Return on ad spend: the value of the conversions of the primary conversion actions
                for each unit of spend, the sum of conversion_value_reporting divided by the sum of
                spend_reporting, both in the reporting currency; 4.2 means 4.20 of value for each
                1.00 spent.
              numerator: conversion_value_reporting
              denominator: spend_reporting
              format: number
    # The key, as a constraint that PostgreSQL enforces. It has no name on purpose: dbt builds the
    # table under a temporary name and renames it, and the index of the key keeps the name it got,
    # so a named key would collide with itself on the next run.
    constraints:
      - type: primary_key
        columns: [report_date, platform, account_id, campaign_id]
    data_tests:
      - unique_combination:
          arguments:
            columns: [report_date, platform, account_id, campaign_id]
    columns:
      - name: report_date
        data_type: date
        description: '{{ doc("report_date") }}'
        data_tests: [not_null]
        config: {meta: {metabase: {display_name: Report Date, semantic_type: null}}}
      - name: platform
        data_type: text
        description: '{{ doc("platform") }}'
        data_tests: [not_null]
        config: {meta: {metabase: {display_name: Platform Code, semantic_type: type/Category}}}
      - name: platform_name
        data_type: text
        description: '{{ doc("platform_name") }}'
        config: {meta: {metabase: {display_name: Platform, semantic_type: type/Category}}}
      - name: client_id
        data_type: text
        description: '{{ doc("client_id") }}'
        data_tests: [not_null]
        config: {meta: {metabase: {display_name: Client ID, semantic_type: type/Category}}}
      - name: client_name
        data_type: text
        description: '{{ doc("client_name") }}'
        config: {meta: {metabase: {display_name: Client, semantic_type: type/Category}}}
      - name: account_id
        data_type: text
        description: '{{ doc("account_id") }}'
        data_tests: [not_null]
        config: {meta: {metabase: {display_name: Account ID, semantic_type: type/Category}}}
      - name: account_name
        data_type: text
        description: '{{ doc("account_name") }}'
        config: {meta: {metabase: {display_name: Account Name, semantic_type: type/Category}}}
      - name: campaign_id
        data_type: text
        description: '{{ doc("campaign_id") }}'
        data_tests: [not_null]
        config: {meta: {metabase: {display_name: Campaign ID, semantic_type: type/Category}}}
      - name: campaign_name
        data_type: text
        description: '{{ doc("campaign_name") }}'
        config: {meta: {metabase: {display_name: Campaign Name, semantic_type: type/Category}}}
      - name: currency
        data_type: text
        description: '{{ doc("currency") }}'
        data_tests: [not_null]
        config: {meta: {metabase: {display_name: Currency, semantic_type: type/Category}}}
      - name: impressions
        data_type: bigint
        description: '{{ doc("impressions") }}'
        config: {meta: {metabase: {display_name: Impressions, semantic_type: type/Quantity}}}
      - name: clicks
        data_type: bigint
        description: '{{ doc("clicks") }}'
        config: {meta: {metabase: {display_name: Clicks, semantic_type: type/Quantity}}}
      - name: spend
        data_type: numeric(18,6)
        description: '{{ doc("spend") }}'
        # Two currencies in the table: a plain number (docs/reference/describe-the-marts.md).
        data_tests: [not_null]
        config: {meta: {metabase: {display_name: Spend, semantic_type: null}}}
      - name: conversions
        data_type: numeric(18,6)
        description: '{{ doc("conversions") }}'
        config: {meta: {metabase: {display_name: Conversions, semantic_type: null}}}
      - name: conversion_value
        data_type: numeric(18,6)
        description: '{{ doc("conversion_value") }}'
        config: {meta: {metabase: {display_name: Conversion Value, semantic_type: null}}}
      - name: reporting_currency
        data_type: text
        description: '{{ doc("reporting_currency") }}'
        # One currency in the whole table, and never NULL: the condition for the columns that end
        # in _reporting to be money in Metabase. The test has a name of its own, as the name that
        # dbt makes would carry the expression.
        data_tests:
          - not_null
          - accepted_values:
              name: ad_stats_campaign_daily_has_one_reporting_currency
              arguments:
                values: ["{{ env_var('AGORANOMOS_REPORTING_CURRENCY', 'USD') }}"]
        config: {meta: {metabase: {display_name: Reporting Currency, semantic_type: type/Category}}}
      - name: spend_reporting
        data_type: numeric(18,6)
        description: '{{ doc("spend_reporting") }}'
        data_tests: [not_null]
        config:
          meta:
            metabase:
              display_name: Spend in Reporting Currency
              semantic_type: type/Currency
              currency: "{{ env_var('AGORANOMOS_REPORTING_CURRENCY', 'USD') }}"
      - name: conversion_value_reporting
        data_type: numeric(18,6)
        description: '{{ doc("conversion_value_reporting") }}'
        config:
          meta:
            metabase:
              display_name: Conversion Value in Reporting Currency
              semantic_type: type/Currency
              currency: "{{ env_var('AGORANOMOS_REPORTING_CURRENCY', 'USD') }}"
  - name: ad_conversions_campaign_daily
    description: >-
      Conversions by day, campaign and conversion action on every platform. One row is one
      conversion action of one campaign of one ad account on one day, in the time zone of the
      account, with any conversion: report_date, platform, account_id, campaign_id and
      conversion_action_id together are its key. Each action has a category (conversion_category)
      and says whether it counts in the conversions of the campaign (is_primary): the rows of the
      primary actions add up to the conversions of ad_stats_campaign_daily. Money is in the currency
      of the account (currency) and in the reporting currency (reporting_currency); add up money
      across accounts with the columns that end in _reporting. Today it holds the fictional
      platforms of the demo; the sources of real ad platforms are planned.
    config:
      contract:
        enforced: true
      meta:
        metabase:
          display_name: Conversions by Campaign, Day and Action
    constraints:
      - type: primary_key
        columns: [report_date, platform, account_id, campaign_id, conversion_action_id]
    data_tests:
      - unique_combination:
          arguments:
            columns: [report_date, platform, account_id, campaign_id, conversion_action_id]
    columns:
      - name: report_date
        data_type: date
        description: '{{ doc("report_date") }}'
        data_tests: [not_null]
        config: {meta: {metabase: {display_name: Report Date, semantic_type: null}}}
      - name: platform
        data_type: text
        description: '{{ doc("platform") }}'
        config: {meta: {metabase: {display_name: Platform Code, semantic_type: type/Category}}}
      - name: platform_name
        data_type: text
        description: '{{ doc("platform_name") }}'
        config: {meta: {metabase: {display_name: Platform, semantic_type: type/Category}}}
      - name: client_id
        data_type: text
        description: '{{ doc("client_id") }}'
        config: {meta: {metabase: {display_name: Client ID, semantic_type: type/Category}}}
      - name: client_name
        data_type: text
        description: '{{ doc("client_name") }}'
        config: {meta: {metabase: {display_name: Client, semantic_type: type/Category}}}
      - name: account_id
        data_type: text
        description: '{{ doc("account_id") }}'
        config: {meta: {metabase: {display_name: Account ID, semantic_type: type/Category}}}
      - name: account_name
        data_type: text
        description: '{{ doc("account_name") }}'
        config: {meta: {metabase: {display_name: Account Name, semantic_type: type/Category}}}
      - name: campaign_id
        data_type: text
        description: '{{ doc("campaign_id") }}'
        config: {meta: {metabase: {display_name: Campaign ID, semantic_type: type/Category}}}
      - name: campaign_name
        data_type: text
        description: '{{ doc("campaign_name") }}'
        config: {meta: {metabase: {display_name: Campaign Name, semantic_type: type/Category}}}
      - name: conversion_action_id
        data_type: text
        description: '{{ doc("conversion_action_id") }}'
        config: {meta: {metabase: {display_name: Conversion Action ID, semantic_type: type/Category}}}
      - name: conversion_action_name
        data_type: text
        description: '{{ doc("conversion_action_name") }}'
        config: {meta: {metabase: {display_name: Conversion Action, semantic_type: type/Category}}}
      - name: conversion_category
        data_type: text
        description: '{{ doc("conversion_category") }}'
        data_tests:
          - accepted_values:
              arguments:
                values: ["purchase", "lead", "sign_up", "add_to_cart", "app_install", "other"]
        config: {meta: {metabase: {display_name: Conversion Category, semantic_type: type/Category}}}
      - name: is_primary
        data_type: boolean
        description: '{{ doc("is_primary") }}'
        config: {meta: {metabase: {display_name: Is Primary, semantic_type: type/Category}}}
      - name: attribution_setting
        data_type: text
        description: '{{ doc("attribution_setting") }}'
        config: {meta: {metabase: {display_name: Attribution Setting, semantic_type: type/Category}}}
      - name: currency
        data_type: text
        description: '{{ doc("currency") }}'
        data_tests: [not_null]
        config: {meta: {metabase: {display_name: Currency, semantic_type: type/Category}}}
      - name: conversions
        data_type: numeric(18,6)
        description: '{{ doc("conversions") }}'
        config: {meta: {metabase: {display_name: Conversions, semantic_type: null}}}
      - name: conversion_value
        data_type: numeric(18,6)
        description: '{{ doc("conversion_value") }}'
        config: {meta: {metabase: {display_name: Conversion Value, semantic_type: null}}}
      - name: reporting_currency
        data_type: text
        description: '{{ doc("reporting_currency") }}'
        data_tests:
          - not_null
          - accepted_values:
              name: ad_conversions_campaign_daily_has_one_reporting_currency
              arguments:
                values: ["{{ env_var('AGORANOMOS_REPORTING_CURRENCY', 'USD') }}"]
        config: {meta: {metabase: {display_name: Reporting Currency, semantic_type: type/Category}}}
      - name: conversion_value_reporting
        data_type: numeric(18,6)
        description: '{{ doc("conversion_value_reporting") }}'
        config:
          meta:
            metabase:
              display_name: Conversion Value in Reporting Currency
              semantic_type: type/Currency
              currency: "{{ env_var('AGORANOMOS_REPORTING_CURRENCY', 'USD') }}"
  - name: web_sessions_daily
    description: >-
      Sessions of web analytics by day, property, source, medium and campaign. One row is the
      sessions of one property on one day, in the time zone of the property, with one source,
      medium and campaign: report_date, property_id, session_source, session_medium,
      session_campaign_name and session_campaign_id together are its key. ad_platform and
      ad_account_id name the ad campaign whose ID the links carried, when exactly one campaign of
      the data has it. Revenue is in the currency of the property (currency) and in the reporting
      currency (reporting_currency). Today it holds the fictional web analytics of the demo; the
      sources of real web analytics are planned.
    config:
      contract:
        enforced: true
      meta:
        metabase:
          display_name: Web Sessions by Day
    constraints:
      - type: primary_key
        columns: [report_date, property_id, session_source, session_medium, session_campaign_name, session_campaign_id]
    data_tests:
      - unique_combination:
          arguments:
            columns: [report_date, property_id, session_source, session_medium, session_campaign_name, session_campaign_id]
    columns:
      - name: report_date
        data_type: date
        description: '{{ doc("report_date") }}'
        config: {meta: {metabase: {display_name: Report Date, semantic_type: null}}}
      - name: platform
        data_type: text
        description: '{{ doc("platform") }}'
        config: {meta: {metabase: {display_name: Platform Code, semantic_type: type/Category}}}
      - name: platform_name
        data_type: text
        description: '{{ doc("platform_name") }}'
        config: {meta: {metabase: {display_name: Platform, semantic_type: type/Category}}}
      - name: client_id
        data_type: text
        description: '{{ doc("client_id") }}'
        config: {meta: {metabase: {display_name: Client ID, semantic_type: type/Category}}}
      - name: client_name
        data_type: text
        description: '{{ doc("client_name") }}'
        config: {meta: {metabase: {display_name: Client, semantic_type: type/Category}}}
      - name: property_id
        data_type: text
        description: '{{ doc("property_id") }}'
        config: {meta: {metabase: {display_name: Property ID, semantic_type: type/Category}}}
      - name: property_name
        data_type: text
        description: '{{ doc("property_name") }}'
        config: {meta: {metabase: {display_name: Property, semantic_type: type/Category}}}
      - name: session_source
        data_type: text
        description: '{{ doc("session_source") }}'
        config: {meta: {metabase: {display_name: Session Source, semantic_type: type/Source}}}
      - name: session_medium
        data_type: text
        description: '{{ doc("session_medium") }}'
        config: {meta: {metabase: {display_name: Session Medium, semantic_type: type/Category}}}
      - name: session_campaign_id
        data_type: text
        description: '{{ doc("session_campaign_id") }}'
        config: {meta: {metabase: {display_name: Session Campaign ID, semantic_type: type/Category}}}
      - name: session_campaign_name
        data_type: text
        description: '{{ doc("session_campaign_name") }}'
        config: {meta: {metabase: {display_name: Session Campaign Name, semantic_type: type/Category}}}
      - name: session_default_channel_group
        data_type: text
        description: '{{ doc("session_default_channel_group") }}'
        config: {meta: {metabase: {display_name: Channel Group, semantic_type: type/Source}}}
      - name: ad_platform
        data_type: text
        description: '{{ doc("ad_platform") }}'
        config: {meta: {metabase: {display_name: Ad Platform Code, semantic_type: type/Category}}}
      - name: ad_account_id
        data_type: text
        description: '{{ doc("ad_account_id") }}'
        config: {meta: {metabase: {display_name: Ad Account ID, semantic_type: type/Category}}}
      - name: currency
        data_type: text
        description: '{{ doc("currency") }}'
        config: {meta: {metabase: {display_name: Currency, semantic_type: type/Category}}}
      - name: sessions
        data_type: bigint
        description: '{{ doc("sessions") }}'
        config: {meta: {metabase: {display_name: Sessions, semantic_type: type/Quantity}}}
      - name: engaged_sessions
        data_type: bigint
        description: '{{ doc("engaged_sessions") }}'
        config: {meta: {metabase: {display_name: Engaged Sessions, semantic_type: type/Quantity}}}
      - name: key_events
        data_type: numeric(18,6)
        description: '{{ doc("key_events") }}'
        config: {meta: {metabase: {display_name: Key Events, semantic_type: null}}}
      - name: total_revenue
        data_type: numeric(18,6)
        description: '{{ doc("total_revenue") }}'
        config: {meta: {metabase: {display_name: Total Revenue, semantic_type: null}}}
      - name: reporting_currency
        data_type: text
        description: '{{ doc("reporting_currency") }}'
        data_tests:
          - not_null
          - accepted_values:
              name: web_sessions_daily_has_one_reporting_currency
              arguments:
                values: ["{{ env_var('AGORANOMOS_REPORTING_CURRENCY', 'USD') }}"]
        config: {meta: {metabase: {display_name: Reporting Currency, semantic_type: type/Category}}}
      - name: total_revenue_reporting
        data_type: numeric(18,6)
        description: '{{ doc("total_revenue_reporting") }}'
        config:
