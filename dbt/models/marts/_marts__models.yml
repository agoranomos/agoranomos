  - name: fx_rates_daily
    description: >-
      The exchange rates into the reporting currency, one row for each day and each currency of
      the data: the rates at which the columns that end in _reporting convert the money of each
      day, through the reference rates of the euro, each the last one published on or before the
      day. rate_date, currency and reporting_currency together are its key. The reporting
      currency has the rate 1 on every day; another currency has rows from the first day on which
      the source published a rate for it. Today the rates come from the fictional source of the
      demo, which covers USD and EUR; a source of real rates is planned.
    config:
      contract:
        enforced: true
      meta:
        metabase:
          display_name: Exchange Rates by Day
    constraints:
      - type: primary_key
        columns: [rate_date, currency, reporting_currency]
    data_tests:
      - unique_combination:
          arguments:
            columns: [rate_date, currency, reporting_currency]
    columns:
      - name: rate_date
