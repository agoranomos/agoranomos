        description: '{{ doc("last_report_date") }}'
        config: {meta: {metabase: {display_name: Last Report Date, semantic_type: null}}}
  - name: clients
    description: >-
      The clients of the business, such as brands, shops or legal entities, one row each: those
      that the settings of the deployment name, those of the demo while an account or a property
      of the demo is in the data, and the default client Unassigned, which holds the accounts
      that no setting names. client_id is its key, and the other marts name a client by it.
    config:
      contract:
        enforced: true
      meta:
        metabase:
          display_name: Clients
    constraints:
      - type: primary_key
        columns: [client_id]
    data_tests:
      - unique_combination:
          arguments:
            columns: [client_id]
