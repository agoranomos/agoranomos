        description: '{{ doc("rate_date") }}'
        config: {meta: {metabase: {display_name: Rate Date, semantic_type: null}}}
      - name: currency
        data_type: text
        description: '{{ doc("currency") }}'
        config: {meta: {metabase: {display_name: Currency, semantic_type: type/Category}}}
      - name: reporting_currency
        data_type: text
        description: '{{ doc("reporting_currency") }}'
