  - name: ad_campaigns
    description: >-
      The campaigns of every ad platform, one row each, as their newest version has them,
      whether the platform still lists them or not: the current name, status and type, the first
      and last days that their statistics in ad_stats_campaign_daily cover, and how many names
      each had, which ad_campaign_names lists. platform, account_id and campaign_id together are
      its key. Today it holds the campaigns of the demo; the sources of real ad platforms are
      planned.
    config:
      contract:
        enforced: true
      meta:
        metabase:
          display_name: Ad Campaigns
    constraints:
      - type: primary_key
