models:
  - name: ad_spend_daily
    description: >-
      Advertising spend and results by day and campaign, for dashboards and AI access. One row is
      one campaign of one ad account on one day: report_date, account_id and campaign_id together
      are its key. Today it holds the demo account, from raw_demo; the sources of real ad platforms
      are planned.
    config:
      # The table that dbt builds has exactly these columns, with these types, or the build fails.
      contract:
        enforced: true
      meta:
        metabase:
          display_name: Ad Spend by Day
    # The key, as a constraint that PostgreSQL enforces. It has no name on purpose: dbt builds the
    # table under a temporary name and renames it, and the index of the key keeps the name it got,
    # so a named key would collide with itself on the next run.
    constraints:
      - type: primary_key
        columns: [report_date, account_id, campaign_id]
    data_tests:
      - unique_combination:
          arguments:
            columns: [report_date, account_id, campaign_id]
    columns:
      - name: report_date
        data_type: date
        description: '{{ doc("report_date") }}'
        data_tests: [not_null]
        config:
          meta:
            metabase:
              display_name: Report Date
              semantic_type: null
      - name: account_id
        data_type: text
        description: '{{ doc("account_id") }}'
        data_tests: [not_null]
        config:
          meta:
            metabase:
              display_name: Account ID
              semantic_type: type/Category
      - name: campaign_id
        data_type: text
        description: '{{ doc("campaign_id") }}'
        data_tests: [not_null]
        config:
          meta:
            metabase:
              display_name: Campaign ID
              semantic_type: type/Category
      - name: campaign_name
        data_type: text
        description: '{{ doc("campaign_name") }}'
        config:
          meta:
            metabase:
              display_name: Campaign Name
              semantic_type: type/Category
      - name: currency
        data_type: text
        description: '{{ doc("currency") }}'
        # One currency in the whole table: the condition for spend to be a currency in Metabase.
        data_tests:
          - accepted_values:
              arguments:
                values: ["USD"]
        config:
          meta:
            metabase:
              display_name: Currency
              semantic_type: type/Category
      - name: impressions
        data_type: bigint
        description: '{{ doc("impressions") }}'
        config:
          meta:
            metabase:
              display_name: Impressions
              semantic_type: type/Quantity
      - name: clicks
        data_type: bigint
        description: '{{ doc("clicks") }}'
        config:
          meta:
            metabase:
              display_name: Clicks
              semantic_type: type/Quantity
      - name: spend
        data_type: numeric(12,2)
        description: '{{ doc("spend") }}'
        data_tests: [not_null]
        config:
          meta:
            metabase:
              display_name: Spend
              semantic_type: type/Currency
              currency: USD
      - name: conversions
        data_type: numeric(12,2)
        description: '{{ doc("conversions") }}'
        config:
          meta:
            metabase:
              display_name: Conversions
              semantic_type: null
