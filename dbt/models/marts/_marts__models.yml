      - name: account_name
        data_type: text
        description: '{{ doc("account_name") }}'
        config: {meta: {metabase: {display_name: Account Name, semantic_type: type/Name}}}
      - name: client_id
        data_type: text
        description: '{{ doc("client_id") }}'
        config: {meta: {metabase: {display_name: Client ID, semantic_type: type/Category}}}
      - name: client_name
