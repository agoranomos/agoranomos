  - name: ad_conversions_campaign_daily
    description: >-
      Conversions by day, campaign and conversion action on every platform, a view over
      core.ad_conversions_campaign_daily. One row is one conversion action of one campaign of one ad
      account on one day, in the time zone of the account, with any conversion: report_date,
      platform, account_id, campaign_id and conversion_action_id together are its key. Each action
      has a category (conversion_category) and says whether it is primary for the deployment
      (is_primary): the rows of the primary actions add up to conversions_primary of
      ad_stats_campaign_daily, through all_conversions where the platform has it. conversions is the
      own metric of conversions of the platform for the action, 0 on Google for an action that the
      metric leaves out, which all_conversions counts. Money is in the currency of the account
      (currency) and in the reporting currency (reporting_currency), at the rate of the day of the
      row (fx_rate_into_reporting_currency); add up money across accounts with the columns that end
      in _reporting. Its platforms are those of ad_platforms with the kind ads. Its tests read the
      days of the windows that the run of the transform pinned.
    config:
      contract:
        enforced: true
      meta:
        metabase:
          display_name: Conversions by Campaign, Day and Action
    data_tests:
      - unique_combination:
          arguments:
            columns: [report_date, platform, account_id, campaign_id, conversion_action_id]
          config:
            where: >-
              report_date >= (select min(window_from) from core.loads where status = 'pinned'
              and outcome = 'loaded')
    columns:
      - name: report_date
        data_type: date
        description: '{{ doc("report_date") }}'
        data_tests:
          - not_null:
              config:
                where: >-
                  report_date >= (select min(window_from) from core.loads where status = 'pinned'
                  and outcome = 'loaded')
        config:
          meta:
            metabase:
              display_name: Report Date
              semantic_type: null
              has_field_values: none
